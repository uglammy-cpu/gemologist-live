<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagina non trovata</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#FBF8F2;color:#2B2520;display:grid;place-items:center;min-height:100vh}p{text-align:center;padding:24px;line-height:1.6}a{color:inherit}</style></head>
<body><script>
(function(){
  var m = location.pathname.match(/^\/show\/([a-z0-9-]{2,40})(\/panel|\/profile)?\/?$/);
  if (!m || m[1] === "join" || m[1] === "img") return;
  fetch(m[2] === "/panel" ? "/show/_panel.html" : (m[2] === "/profile" ? "/show/_profile.html" : "/show/_viewer.html"), { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(h){ document.open(); document.write(h); document.close(); });
})();
</script><p><b>Pagina non trovata · Page not found</b><br><a href="/show/">Vai alla vetrina · Go to the showcase</a></p></body></html>
