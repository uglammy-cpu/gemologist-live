<!doctype html><html lang="{{LANG}}"><head>{{HEAD}}<title>{{NAME}}</title><style>{{CSS}}</style></head>
<body class="vetrina">
<header class="topv wrap"><div class="col">
  <div class="brand"><a class="logo" href="{{BASE}}/live" aria-label="{{NAME}}"><svg class="ulogo" xmlns="http://www.w3.org/2000/svg" viewBox="88 32 830 190" role="img" aria-label="Uniqaia"><g font-family="'Cormorant Garamond',Garamond,'Times New Roman',serif" font-weight="500" font-size="150" fill="currentColor" text-anchor="middle"><text x="151" y="160">U</text><text x="283" y="160">N</text><text x="386" y="160">I</text><text x="659" y="160">A</text><text x="756" y="160">I</text><text x="853" y="160">A</text></g><path fill="var(--logo-gold,#A47F3A)" fill-rule="evenodd" d="M 435 112.5 A 75 75 0 1 0 585 112.5 A 75 75 0 1 0 435 112.5 Z M 453 112.5 A 57 67 0 1 0 567 112.5 A 57 67 0 1 0 453 112.5 Z"/><path fill="var(--logo-gold,#A47F3A)" d="M 521.7 186.6 C 545 196 575 203 610 202 C 575 214 540 212 512 196 Z"/><path d="M 470.1 90.5 A 44 52 0 0 1 495 63.6" fill="none" stroke="var(--logo-gold,#A47F3A)" stroke-width="5" stroke-linecap="round"/><circle cx="510" cy="112.5" r="14" fill="var(--logo-gem,#D43F52)"/></svg></a><small id="tag"></small></div>
  <div class="langs" id="langs"><button type="button" class="cur" id="langCur" aria-haspopup="listbox">IT</button><div class="menu" id="langMenu" hidden><button type="button" data-lang="it">Italiano <small>IT</small></button><button type="button" data-lang="en">English <small>EN</small></button><button type="button" data-lang="fr">Français <small>FR</small></button><button type="button" data-lang="ar">العربية <small>AR</small></button><button type="button" data-lang="ru">Русский <small>RU</small></button></div></div>
</div></header>
<main class="wrap"><div class="jpage" id="page"></div></main>
<footer class="wrap" id="foot"></footer>
<script>
{{LKJS}}
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","base":"{{BASE}}","name":"{{NAME}}","lang":"{{LANG}}"};
  var TT = {{T}};
  var sb = window.supabase.createClient(CFG.url, CFG.key);
  var $ = function(id){ return document.getElementById(id); };
  var lang = CFG.lang;
  if (!TT[lang]) { try { lang = localStorage.getItem("vetrina-lang") || ""; } catch(e){} }
  if (!TT[lang]) { var nav = (navigator.language || "it").slice(0,2).toLowerCase(); lang = TT[nav] ? nav : "it"; }
  var t = TT[lang];
  function li(arr){ return '<ul>' + arr.map(function(x){ return '<li><i></i>' + esc(x) + '</li>'; }).join("") + '</ul>'; }
  function render(){
    t = TT[lang]; document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; $("langCur").textContent = lang.toUpperCase();
    $("tag").textContent = t.tag; $("foot").textContent = t.foot; var dn = document.querySelector(".demo span"); if (dn && t.demoNote) dn.textContent = t.demoNote;
    Array.prototype.forEach.call(document.querySelectorAll("#langMenu button"), function(b){ b.classList.toggle("on", b.getAttribute("data-lang") === lang); });
    $("page").innerHTML = '<span class="eyebrow">' + esc(t.jEyebrow) + '</span><h1>' + esc(t.jTitle) + '</h1><p class="lead">' + esc(t.jLead) + '</p>' +
      '<h3>' + esc(t.jWhatH) + '</h3>' + li(t.jWhat) + '<h3>' + esc(t.jWhoH) + '</h3>' + li(t.jWho) +
      '<div class="price"><b>149 €</b> ' + esc(t.jPrice) + '</div>' +
      '<h3>' + esc(t.jFormH) + '</h3><form class="jform" id="jForm">' +
        '<label>' + esc(t.fName) + '<input id="jName" type="text" maxlength="80" required></label><label>' + esc(t.fCity) + '<input id="jCity" type="text" maxlength="60" required></label>' +
        '<label>' + esc(t.fKind) + '<select id="jKind"><option value="shop">' + esc(t.kShop) + '</option><option value="gems">' + esc(t.kGems) + '</option></select></label><label>' + esc(t.fSite) + '<input id="jSite" type="text" maxlength="160" placeholder="www…"></label>' +
        '<label class="full">' + esc(t.fNight) + '<select id="jNight"><option value="">' + esc(t.nightAny) + '</option></select></label>' +
        '<label class="full">' + esc(t.fShow) + '<textarea id="jShow" maxlength="600"></textarea></label>' +
        '<label>' + esc(t.fEmail) + '<input id="jEmail" type="email" maxlength="120" required></label><label>' + esc(t.fPhone) + '<input id="jPhone" type="tel" maxlength="40"></label>' +
        '<button class="submit" type="submit" id="jSend">' + esc(t.jSend) + '</button></form><p class="hint">' + esc(t.jFine) + '</p>';
    // Le serate a tema sono il motivo per cui uno si candida adesso invece
    // che un giorno qualunque: vanno messe davanti, non nascoste.
    sb.rpc("list_nights", { p_from: null }).then(function(r){
      var sel = $("jNight"); if (!sel || r.error) return;
      (r.data || []).forEach(function(n){
        if (!n.applications_open) return;
        var o = document.createElement("option");
        o.value = n.id;
        var i18n = n.title_i18n || {};
        var nome = i18n[lang] || (lang !== "it" && i18n.en) || n.title;
        var quando = "";
        try { quando = new Intl.DateTimeFormat(lang || "it", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" }).format(new Date(n.starts_at)); } catch(e){}
        o.textContent = nome + (quando ? " · " + quando : "");
        sel.appendChild(o);
      });
    });
    $("jForm").addEventListener("submit", function(e){
      e.preventDefault();
      var name = $("jName").value.trim(), city = $("jCity").value.trim(), email = $("jEmail").value.trim();
      if (!name || !city || !email){ toast(t.need); return; }
      $("jSend").disabled = true; $("jSend").textContent = t.sending;
      sb.rpc("apply_seller", { p_name: name, p_city: city, p_kind: $("jKind").value, p_site: $("jSite").value.trim(), p_show_what: $("jShow").value.trim(), p_email: email, p_phone: $("jPhone").value.trim(), p_lang: lang, p_night: ($("jNight") && $("jNight").value) || null }).then(function(r){
        if (r.error){ toast(r.error.message); $("jSend").disabled = false; $("jSend").textContent = t.jSend; return; }
        $("page").innerHTML = '<div class="thanks"><span class="okc">✓</span><h2>' + esc(t.thTitle) + '</h2><p>' + esc(t.thText) + '</p><a class="btn dark" style="margin-top:8px" href="' + CFG.base + '/live">' + esc(t.thBtn) + '</a></div>';
        window.scrollTo(0, 0);
      });
    });
  }
  $("langCur").addEventListener("click", function(e){ e.stopPropagation(); $("langMenu").hidden = !$("langMenu").hidden; });
  document.addEventListener("click", function(){ $("langMenu").hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll("#langMenu button"), function(b){ b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); $("langMenu").hidden = true; try { localStorage.setItem("vetrina-lang", lang); } catch(e){} render(); }); });
  render();
})();
</script>
</body></html>
