    var o = ST.onb; if (!o || !o.theme) return "";
    var d = (o.next_nights || []).map(function(n){ var p = String(n.day).split("-"); try { return new Intl.DateTimeFormat(lang === "ar" ? "ar-AE-u-nu-latn" : lang, { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" }).format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]))); } catch(e){ return n.day; } }).join(" · ");
    return '<p><b>' + esc(j("onbTheme", { t: o.theme })) + '</b>' + (d ? '<br><span class="hint">' + esc(j("onbNext", { d: d })) + '</span>' : "") + '</p>';
  }
  function guideHtml(panelUrl){
    var steps = [1, 2, 3, 4, 5, 6].map(function(k){
      var extra = k === 5 ? ' <a class="lnk" href="https://www.instagram.com/" target="_blank" rel="noopener">' + esc(j("g5btn")) + '</a>' : "";
      return '<li><b>' + esc(j("g" + k + "h")) + '</b>' + esc(j("g" + k)) + extra + '</li>';
    }).join("");
    return '<div class="guide"><h3>' + esc(j("gH")) + '</h3><ol>' + steps + '</ol>' + (panelUrl ? '<a class="btn dark wide" href="' + panelUrl + '">' + esc(j("openPanel")) + '</a>' : "") + '</div>';
  }
  function approvedCard(sub){
    var pay = sub.pay_token ? '<a class="btn dark wide" id="aPay" href="' + PFX + '/pay/?t=' + encodeURIComponent(sub.pay_token) + '">ACTIVATE YOUR SUBSCRIPTION</a><p class="hint">' + esc(j("apprNote")) + '</p>' : '<p class="notice">' + esc(j("apprWait")) + '</p>';
    return '<div class="acard astat"><span class="okc" aria-hidden="true">✓</span><h2>' + esc(j("apprH")) + '</h2>' + onbLines() + '<div class="plan"><p><b>' + esc(j("apprFirst", { p: eur(sub.first_month_cents) })) + '</b></p><p>' + esc(j("apprNext", { s: eur(sub.standard_cents) })) + '</p><p>' + esc(planLine()) + '</p></div>' + pay + '<p class="hint">' + esc(j("onbAfterPay")) + '</p></div>';
  }
  function activeCard(sub){
    var p = ST.me.plan || {}, panel = ST.me.panel;
    if (sub.status === "active"){
      var url = panel ? PFX + '/' + encodeURIComponent(panel.slug) + '/panel/?k=' + encodeURIComponent(panel.key) : "", fd = ST.onb && ST.onb.founding_no;
      return '<div class="acard astat"><span class="okc" aria-hidden="true">✓</span><h2>' + esc(j("actH")) + '</h2>' +
        (fd ? '<p class="founding"><b>' + esc(j("fdBadge", { n: (fd < 10 ? "0" : "") + fd })) + '</b><br>' + esc(j("fdText")) + '</p>' : "") +
        '<p>' + esc(j("actText", { n: p.lives_per_month || 4, m: p.live_max_min || 60, s: eur(sub.standard_cents) })) + '</p>' + onbLines() +
        (url ? '<a class="btn dark wide" href="' + url + '">' + esc(j("openPanel")) + '</a>' : "") + '</div>' + guideHtml(url);
    }
    if (sub.status === "past_due") return statusCard(j("pdH"), j("pdText"));
    return statusCard(j("cancH"), j("cancText"));
  }
  function statusCard(h, p){ return '<div class="acard astat"><h2>' + esc(h) + '</h2><p>' + esc(p) + '</p></div>'; }

  // ---------------------------------------------------------------- comportamento
  function say(m, ok){ ST.msg = m || ""; ST.msgOk = !!ok; var el = document.querySelector("#acct .amsg"); if (el) { el.textContent = ST.msg; el.classList.toggle("ok", !!ok); } }
  function collect(){
    var F = ST.form, val = function(id){ var e = $(id); return e ? e.value : undefined; }, chk = function(id){ var e = $(id); return e ? e.checked : undefined; };
    var map = { aEmail: "aEmail", jName: "name", jLegal: "legal_name", jVat: "vat_number", jContact: "contact_name", jPhone: "phone", jCountry: "country", jCity: "city", jSite: "site", jIg: "instagram", jKind: "kind", jNight: "night_id", jDesc: "description", jShow: "show_what" };
    Object.keys(map).forEach(function(id){ var x = val(id); if (x !== undefined) F[map[id]] = x; });
    var p = chk("jPrivacy"), tm = chk("jTerms"); if (p !== undefined) F.privacy = p; if (tm !== undefined) F.terms = tm;
  }
  function authError(e, reg){
    var c = String(e.code || "") + " " + String(e.message || "");
    if (/already|exists|registered/i.test(c)) { ST.tab = "login"; renderAcct(); say(j("errExists")); return; }
    if (/weak|password.*(short|characters)/i.test(c)) return say(j("errWeak"));
    if (/not.?confirmed/i.test(c)) return say(j("errConfirm"));
    if (/invalid|credentials|grant/i.test(c)) return say(j("errAuth"));
    say(j("errGeneric"));
  }
  function bindAuth(){
    Array.prototype.forEach.call(document.querySelectorAll("#acct [data-tab]"), function(b){ b.addEventListener("click", function(){ collect(); ST.tab = b.getAttribute("data-tab"); ST.msg = ""; renderAcct(); var e = $("aEmail"); if (e) e.focus(); }); });
    var fg = $("aForgot"); if (fg) fg.addEventListener("click", function(){
      var em = ($("aEmail").value || "").trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $("aEmail").focus(); return; }
      http(CFG.url + "/auth/v1/recover", { email: em }).then(function(){ say(j("forgotSent"), true); }, function(){ say(j("forgotSent"), true); });
    });
    $("aForm").addEventListener("submit", function(e){
      e.preventDefault(); collect();
      var em = ($("aEmail").value || "").trim().toLowerCase(), pw = $("aPass").value || "", reg = ST.tab === "reg";
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $("aEmail").focus(); return say(j("errAuth")); }
      if (pw.length < 8) { $("aPass").focus(); return say(j("errWeak")); }
      ST.busy = true; $("aSend").disabled = true; say(j("loading"), true);
      var p = reg ? http(CFG.url + "/auth/v1/signup", { email: em, password: pw, data: { source: "join" } }) : http(CFG.url + "/auth/v1/token?grant_type=password", { email: em, password: pw });
      p.then(function(d){
        ST.busy = false; var s = asSess(d);
        if (!s) { ST.tab = "login"; renderAcct(); say(j("confirmMail"), true); return; }   // conferma dell'indirizzo richiesta
        saveSess(s); ST.msg = ""; announce(); afterLogin();
      }, function(err){ ST.busy = false; var b = $("aSend"); if (b) b.disabled = false; authError(err, reg); });
    });
  }
  function afterLogin(){
    renderAcct();
    var dev = (window.UQWheel && UQWheel.device && UQWheel.device()) || (function(){ try { return localStorage.getItem("uqw-device"); } catch(e){ return null; } })();
    // il premio giocato da questo dispositivo passa all'account: da qui in poi non si perde più
    (dev ? rpc("account_claim_spin", { p_device: dev }).catch(function(){}) : Promise.resolve()).then(loadMe);
  }
  function loadMe(){
    return rpc("account_me", {}).then(function(me){
      ST.me = me;
      // serata, numero Founding e prossime date: solo dopo l'approvazione (se la funzione non c'è ancora, l'area resta com'era)
      if (me && me.application && me.application.status === "approved") rpc("account_onboarding", {}).then(function(o){ ST.onb = o; renderAcct(); }, function(){});
      var needInvite = ST.invite && !me.application && !ST.inviteData;
      return needInvite ? rpc("get_application_by_token", { p_token: ST.invite }).then(function(r){ ST.inviteData = (r && r[0]) || null; }, function(){}) : null;
    }).then(function(){ renderAcct(); announce(); }, function(e){
      if (/JWT|token|401|Accedi/i.test(String(e.message))) { saveSess(null); ST.me = null; announce(); }
      renderAcct(); say(j("errGeneric"));
    });
  }
  function bindAcct(){
    var out = $("aOut"); if (out) out.addEventListener("click", function(){
      var tok = SESS && SESS.access_token; saveSess(null); ST.me = null; ST.inviteData = null; ST.form = {}; ST.cats = []; ST.files = { draft: null, logo: null, photo1: null, photo2: null }; ST.fileMsg = {};
      if (tok) http(CFG.url + "/auth/v1/logout", {}, tok).catch(function(){});
      announce(); renderAcct();
    });
    var f = $("jForm"); if (!f) return;
    Array.prototype.forEach.call(f.querySelectorAll(".chip"), function(b){ b.addEventListener("click", function(){
      var c = b.getAttribute("data-cat"), i = ST.cats.indexOf(c);
      if (i >= 0) ST.cats.splice(i, 1); else if (ST.cats.length < 3) ST.cats.push(c); else { say(j("errCats")); return; }
      b.classList.toggle("on", i < 0); b.setAttribute("aria-pressed", String(i < 0)); say("");
    }); });
    Array.prototype.forEach.call(f.querySelectorAll('input[type="file"]'), function(inp){ inp.addEventListener("change", function(){ upload(inp); }); });
    f.addEventListener("submit", function(e){ e.preventDefault(); submit(); });
  }
  function upload(inp){
    var kind = inp.getAttribute("data-kind"), file = inp.files && inp.files[0], m = $("m_" + kind); if (!file) return;
    var show = function(x){ ST.fileMsg[kind] = x; if ($("m_" + kind)) $("m_" + kind).textContent = x; };
    if (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) < 0) { inp.value = ""; return show(j("errFileType")); }
    if (file.size > 10 * 1024 * 1024) { inp.value = ""; return show(j("errFileSize")); }
    show(j("uploading")); ST.files[kind] = null;
    http(CFG.url + "/functions/v1/seller-files", { action: "upload", kind: kind, type: file.type, size: file.size, draft: ST.files.draft }).then(function(d){
      var fd = new FormData(); fd.append("cacheControl", "3600"); fd.append("", file);
      return fetch(d.signedUrl, { method: "PUT", headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "x-upsert": "true" }, body: fd }).then(function(r){
        if (!r.ok) throw new Error("upload " + r.status); ST.files.draft = d.draft; ST.files[kind] = d.path; show("✓ " + j("uploaded") + " · " + file.name);
      });
    }).catch(function(e){ show((e && e.message && !/HTTP|upload/.test(e.message)) ? e.message : j("errGeneric")); });
  }
  function submit(){
    collect();
    var F = ST.form, a = ST.me && ST.me.application, pre = (a && a.fields) || ST.inviteData || {};
    if (!ST.terms || !ST.terms.legal_ready) return say(j("legalMissing"));
    var req = ["name", "legal_name", "vat_number", "contact_name", "city", "description"];
    for (var i = 0; i < req.length; i++) if (!String(F[req[i]] || "").trim()) { var map = { name: "jName", legal_name: "jLegal", vat_number: "jVat", contact_name: "jContact", city: "jCity", description: "jDesc" }; $(map[req[i]]).focus(); return say(j("errRequired")); }
    if (!ST.cats.length) return say(j("errCats"));
    var hasLogo = ST.files.logo || pre.has_logo, hasPhotos = (ST.files.photo1 && ST.files.photo2) || pre.has_photos;
    if (!hasLogo || !hasPhotos) return say(j("errFiles"));
    if (!F.privacy || !F.terms) return say(j("errConsents"));
    var p = { name: F.name, legal_name: F.legal_name, vat_number: F.vat_number, contact_name: F.contact_name, phone: F.phone || "", country: F.country || "IT", city: F.city,
      site: F.site || "", instagram: F.instagram || "", kind: F.kind || "shop", categories: ST.cats, description: F.description, show_what: F.show_what || "", night_id: F.night_id || null,
      privacy: true, terms: true, privacy_version: "v1", terms_version: "v1", lang: lang, draft: ST.files.draft };
    if (ST.files.logo) p.logo_path = ST.files.logo;
    if (ST.files.photo1 && ST.files.photo2) p.photo_paths = [ST.files.photo1, ST.files.photo2];
    if (ST.invite && !a) p.token = ST.invite;
    ST.busy = true; var b = $("jSend"); if (b) { b.disabled = true; b.textContent = t.sending; }
    rpc("account_submit_application", { p: p }).then(function(){
      ST.busy = false; ST.form = {}; ST.cats = []; ST.files = { draft: null, logo: null, photo1: null, photo2: null }; ST.fileMsg = {}; ST.msg = "";
      return loadMe();
    }).then(function(){ var box = $("acct"); if (box) window.scrollTo({ top: box.getBoundingClientRect().top + window.pageYOffset - 70 }); }, function(e){
      ST.busy = false; var b2 = $("jSend"); if (b2) { b2.disabled = false; b2.textContent = t.jSend; } say(e.message || j("errGeneric"));
    });
  }

  // ---------------------------------------------------------------- avvio
  $("langCur").addEventListener("click", function(e){ e.stopPropagation(); $("langMenu").hidden = !$("langMenu").hidden; });
  document.addEventListener("click", function(){ $("langMenu").hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll("#langMenu button"), function(b){ b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); $("langMenu").hidden = true; try { localStorage.setItem("vetrina-lang", lang); } catch(e){} render(); }); });
  // il premio giocato prima della registrazione compare nel riquadro dell'account, senza ridisegnare il modulo
  document.addEventListener("uqw:change", function(){
    if (SESS) return; var box = $("acct"); if (!box) return;
    var old = box.querySelector(".offer"), html = offerHtml(true);
    if (old) { if (html) old.outerHTML = html; else old.parentNode.removeChild(old); }
    else if (html) { var lead = box.querySelector(".lead"); if (lead) lead.insertAdjacentHTML("afterend", html); }
  });
  render();
  rpc("site_terms", {}).then(function(x){ ST.terms = x; renderAcct(); }, function(){});
  // Founding 20: il contatore è vero, letto dal database (se la funzione non c'è ancora non compare niente)
  rpc("founding_left", {}).then(function(n){ if (typeof n === "number"){ ST.fLeft = n; render(); } }, function(){});
  rpc("list_nights", { p_from: null }).then(function(r){ ST.nights = (r || []).filter(function(n){ return n.applications_open; }); if (SESS && ST.me) renderAcct(); }, function(){});
  if (SESS) loadMe();
  if (/#acct$/.test(location.hash)) setTimeout(function(){ var b = $("acct"); if (b) b.scrollIntoView(); }, 50);
})();
</script>
<style>
.acct{margin-top:18px;scroll-margin-top:80px}
.jform .full{grid-column:1/-1}
.acard{border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:#FFFDF8;display:flex;flex-direction:column;gap:12px}
.acard h2{font-family:var(--display);font-size:clamp(22px,5vw,28px);line-height:1.15}
.acard h2.brandh{letter-spacing:.06em}
.acard .lead{font-size:14.5px;color:var(--muted);line-height:1.5}
.acard.astat{align-items:center;text-align:center;padding:28px 18px}
.acard.astat p{max-width:46ch;line-height:1.55;font-size:15px}
.acard .okc{width:50px;height:50px;border-radius:50%;background:var(--soft-2);color:var(--gold-edge);display:grid;place-items:center;font-size:24px;border:1px solid var(--gold-hi)}
.atabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.atabs button{border:0;background:none;padding:10px 12px;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.atabs button.on{border-color:var(--gold);color:var(--ink);font-weight:500}
.lnk{border:0;background:none;padding:4px;color:var(--gold-edge);text-decoration:underline;font-size:13.5px;cursor:pointer}
.amsg{font-size:14px;color:#B42318;min-height:1em;margin:0}
.amsg.ok{color:var(--gold-edge)}
.amsg:empty{display:none}
.userbar{font-size:13.5px;color:var(--muted);text-align:end;margin:0 0 8px}
.offer{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--gold-hi);background:var(--soft-2);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;text-align:start;margin:0}
.offer svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice{background:#FFF6E5;border:1px solid var(--gold-hi);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;margin:0}
.notice p{margin:4px 0 0}
.chips{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:36px}
.chip.on{background:var(--gold-ink);color:var(--gold-hi);border-color:var(--gold-ink)}
.jform textarea{min-height:96px;border-radius:12px;padding:10px 14px;resize:vertical}
.jform label small{font-size:11.5px;color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.filebox{border:1px dashed var(--gold-hi);border-radius:12px;padding:10px;background:var(--paper)}
.filebox input{border:0;padding:4px 0;min-height:0;border-radius:0;font-size:13px;max-width:100%}
.consent{flex-direction:row;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink)}
.consent input{min-height:0;width:20px;height:20px;margin-top:1px;flex:none}
.consent a{color:var(--gold-edge)}
.jform .submit:disabled{opacity:.45;cursor:not-allowed}
.plan{display:flex;flex-direction:column;gap:2px;border:1px solid var(--gold-hi);background:var(--soft-2);border-radius:12px;padding:12px 16px;margin:4px 0}
.plan p{margin:0;font-size:15px}
.btn.wide{width:100%;max-width:360px;letter-spacing:.12em;font-size:14px;min-height:50px}
.guide{border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.guide h3{margin:0}
.guide ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.55;list-style:decimal}
.guide ol li{display:list-item;padding-inline-start:4px}
.guide ol li b{display:block;margin-bottom:2px}
.founding{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0}
.fdleft{font-size:13.5px;color:var(--muted);margin:8px 0 0}
@media (max-width:640px){.jform{grid-template-columns:1fr}.files{grid-template-columns:1fr}.userbar{text-align:start}}
</style>
