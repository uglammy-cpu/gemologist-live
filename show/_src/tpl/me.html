<!doctype html><html lang="{{LANG}}"><head>{{HEAD}}<title>{{NAME}}</title><style>{{CSS}}</style><style>
/* 15/11 · pagina personale dello spettatore: My Saved Lives, promemoria, My Invitations (brief di Elena) */
.me h1{font-family:var(--display);font-weight:400;font-size:34px;margin:18px 0 4px}.me .who{color:var(--muted);font-size:14px;margin:0 0 22px;word-break:break-all}
.me section{border-top:1px solid var(--line);padding:20px 0}.me h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px}
.me .lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 14px}
.sl{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sl .d{text-align:center;line-height:1}.sl .d small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-edge)}.sl .d b{display:block;font-family:var(--display);font-size:26px;font-weight:400;margin-top:3px}
.sl .t b{display:block;font-size:16px;font-weight:500}.sl .t a{color:inherit;text-decoration:none}.sl .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sl .rm{background:none;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.tog{display:flex;flex-direction:row;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;color:var(--ink);cursor:pointer}.tog input{width:20px!important;height:20px;min-height:0!important;flex:0 0 20px;margin:2px 0 0;padding:0;accent-color:#1C1406}
.inv{display:flex;gap:8px;flex-wrap:wrap}.inv input{flex:1 1 220px;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14px}
.inv .btn{flex:0 0 auto}.big{font-family:var(--display);font-size:40px;line-height:1;display:block;margin:6px 0 2px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 16px}.danger{color:#B42318;border-color:#E9B8B2}
.me .acts{display:flex;gap:10px;flex-wrap:wrap}
.sl .rr{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}.sl .rr label{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;min-height:32px}
.sl .rr input{width:17px!important;height:17px;min-height:0!important;margin:0;padding:0;accent-color:#1C1406}
.me .me-lbl{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-edge);margin:0 0 6px}
</style></head>
<body class="vetrina">
<header class="topv wrap"><div class="col"><div class="brand"><a class="logo" href="{{BASE}}/live" aria-label="{{NAME}}"><!--LOGO--></a></div></div></header>
<main class="wrap"><div class="col me" id="page"><p class="hint" style="padding:40px 0">…</p></div></main>
<footer class="wrap" id="foot"></footer>
<script>{{GROWTH}}</script>
<script>
{{LKJS}}
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","base":"{{BASE}}","lang":"{{LANG}}"};
  var ROOT = "{{BASE}}/live";   // radice del sito, con la barra finale
  var TT = {{T}};
  // Testi del Legal (LEG-015, sezione D): My Invitations senza premi, conferma della cancellazione. Francese, russo e arabo da rivedere a Traduzioni.
  var ME = {
    en: {"title": "My account", "out": "Sign in with your email to find the lives you saved and your invitation link.", "signin": "Sign in", "saved": "My Saved Lives", "empty": "Nothing saved yet. Tap “Remind me” on a live or an evening and you'll find it here.", "browse": "See the schedule", "remove": "Remove", "open": "Open", "evening": "Evening", "liveNow": "Live now", "ended": "Ended", "rem": "Email reminders for my saved lives", "remOffDone": "Reminders are off. You can turn them back on here.", "remOffOne": "Reminders turned off for this live.", "inv": "My Invitations", "invT": "Invite a friend", "yourLink": "Your link", "copy": "Copy link", "copied": "Link copied", "joined": "Friends who joined: {n}", "yourCode": "Your code: {c}", "privacyNote": "We only show the number, never who joined.", "invMsg": "Join me on Uniqaia, live shows of jewellery and gems: {link} (code {code})", "signout": "Sign out", "del": "Delete my account", "delAsk": "We'll delete your account, your saved shows, your reminders and your invitation link. Requests you've already sent to sellers stay with them and, with us, for the 12 months set out in the privacy notice. Do you want to continue?", "delYes": "Delete", "delNo": "Cancel", "delDone": "Your account has been deleted.", "delSeller": "This email is also used for a seller account: write to seller@uniqaia.com to delete it.", "err": "Something went wrong. Please try again."},
    it: {"title": "Il mio account", "out": "Entra con la tua email per ritrovare le dirette che hai salvato e il tuo link per invitare.", "signin": "Entra", "saved": "Le mie dirette", "empty": "Non hai ancora salvato niente. Tocca «Ricordamelo» su una diretta o una serata e la ritrovi qui.", "browse": "Guarda il palinsesto", "remove": "Togli", "open": "Apri", "evening": "Serata", "liveNow": "In diretta ora", "ended": "Terminata", "rem": "Promemoria via email per le mie dirette salvate", "remOffDone": "Promemoria spenti. Puoi riaccenderli qui.", "remOffOne": "Promemoria spenti per questa diretta.", "inv": "I miei inviti", "invT": "Invita un amico", "yourLink": "Il tuo link", "copy": "Copia link", "copied": "Link copiato", "joined": "Amici che si sono iscritti: {n}", "yourCode": "Il tuo codice: {c}", "privacyNote": "Mostriamo solo il numero, mai chi si è iscritto.", "invMsg": "Ti invito su Uniqaia, le dirette di gioielli e gemme: {link} (codice {code})", "signout": "Esci", "del": "Elimina il mio account", "delAsk": "Cancelliamo il tuo account, le dirette salvate, i promemoria e il tuo link di invito. Le richieste che hai già mandato ai seller restano a loro e, da noi, per i 12 mesi previsti dall'informativa. Vuoi continuare?", "delYes": "Elimina", "delNo": "Annulla", "delDone": "Il tuo account è stato cancellato.", "delSeller": "Questa email è anche quella di un account seller: scrivi a seller@uniqaia.com per cancellarlo.", "err": "Qualcosa non ha funzionato. Riprova."},
    fr: {"title": "Mon compte", "out": "Connectez-vous avec votre e-mail pour retrouver les lives enregistrés et votre lien d'invitation.", "signin": "Se connecter", "saved": "Mes lives", "empty": "Rien d'enregistré pour l'instant. Touchez « Me le rappeler » sur un live ou une soirée et vous le retrouverez ici.", "browse": "Voir le programme", "remove": "Retirer", "open": "Ouvrir", "evening": "Soirée", "liveNow": "En direct", "ended": "Terminé", "rem": "Rappels par e-mail pour mes lives enregistrés", "remOffDone": "Rappels désactivés. Vous pouvez les réactiver ici.", "remOffOne": "Rappels désactivés pour ce live.", "inv": "Mes invitations", "invT": "Inviter un ami", "yourLink": "Votre lien", "copy": "Copier le lien", "copied": "Lien copié", "joined": "Amis inscrits : {n}", "yourCode": "Votre code : {c}", "privacyNote": "Nous affichons uniquement le nombre, jamais qui s'est inscrit.", "invMsg": "Rejoins-moi sur Uniqaia, les lives de bijoux et de pierres précieuses : {link} (code {code})", "signout": "Se déconnecter", "del": "Supprimer mon compte", "delAsk": "Nous supprimerons votre compte, vos lives enregistrés, vos rappels et votre lien d'invitation. Les demandes déjà envoyées aux vendeurs restent chez eux et, chez nous, pendant les 12 mois prévus par la politique de confidentialité. Voulez-vous continuer ?", "delYes": "Supprimer", "delNo": "Annuler", "delDone": "Votre compte a été supprimé.", "delSeller": "Cet e-mail est aussi celui d'un compte vendeur : écrivez à seller@uniqaia.com pour le supprimer.", "err": "Une erreur s'est produite. Réessayez."},
    ru: {"title": "Мой аккаунт", "out": "Войдите по e-mail, чтобы увидеть сохранённые эфиры и вашу ссылку для приглашений.", "signin": "Войти", "saved": "Мои эфиры", "empty": "Пока ничего не сохранено. Нажмите «Напомнить» у эфира или вечера — он появится здесь.", "browse": "Смотреть программу", "remove": "Удалить", "open": "Открыть", "evening": "Вечер", "liveNow": "В эфире", "ended": "Завершён", "rem": "Напоминания на e-mail о сохранённых эфирах", "remOffDone": "Напоминания выключены. Их можно снова включить здесь.", "remOffOne": "Напоминания для этого эфира выключены.", "inv": "Мои приглашения", "invT": "Пригласить друга", "yourLink": "Ваша ссылка", "copy": "Копировать ссылку", "copied": "Ссылка скопирована", "joined": "Зарегистрировались друзья: {n}", "yourCode": "Ваш код: {c}", "privacyNote": "Мы показываем только число, но не имена.", "invMsg": "Присоединяйся к Uniqaia — прямые эфиры с украшениями и камнями: {link} (код {code})", "signout": "Выйти", "del": "Удалить мой аккаунт", "delAsk": "Мы удалим ваш аккаунт, сохранённые эфиры, напоминания и вашу ссылку для приглашений. Запросы, которые вы уже отправили продавцам, остаются у них, а у нас — на 12 месяцев, как указано в политике конфиденциальности. Продолжить?", "delYes": "Удалить", "delNo": "Отмена", "delDone": "Ваш аккаунт удалён.", "delSeller": "Этот e-mail используется и для аккаунта продавца: напишите на seller@uniqaia.com, чтобы удалить его.", "err": "Что-то пошло не так. Попробуйте ещё раз."},
    ar: {"title": "حسابي", "out": "سجّل الدخول ببريدك الإلكتروني لتجد البثوث التي حفظتها ورابط الدعوة الخاص بك.", "signin": "تسجيل الدخول", "saved": "بثوثي", "empty": "لم تحفظ شيئًا بعد. اضغط «ذكّرني» على بث أو أمسية وستجدها هنا.", "browse": "شاهد البرنامج", "remove": "إزالة", "open": "فتح", "evening": "أمسية", "liveNow": "مباشر الآن", "ended": "انتهى", "rem": "تذكيرات بالبريد الإلكتروني لبثوثي المحفوظة", "remOffDone": "التذكيرات متوقفة. يمكنك إعادة تفعيلها هنا.", "remOffOne": "تم إيقاف التذكيرات لهذا البث.", "inv": "دعواتي", "invT": "ادعُ صديقًا", "yourLink": "رابطك", "copy": "نسخ الرابط", "copied": "تم نسخ الرابط", "joined": "أصدقاء انضموا: {n}", "yourCode": "رمزك: {c}", "privacyNote": "نعرض العدد فقط، ولا نعرض أبدًا من انضم.", "invMsg": "انضم إليّ على Uniqaia، بثوث مباشرة للمجوهرات والأحجار الكريمة: {link} (الرمز {code})", "signout": "تسجيل الخروج", "del": "حذف حسابي", "delAsk": "سنحذف حسابك والبثوث المحفوظة والتذكيرات ورابط دعوتك. الطلبات التي أرسلتها بالفعل إلى البائعين تبقى لديهم، ولدينا لمدة 12 شهرًا كما يرد في إشعار الخصوصية. هل تريد المتابعة؟", "delYes": "حذف", "delNo": "إلغاء", "delDone": "تم حذف حسابك.", "delSeller": "هذا البريد مستخدم أيضًا لحساب بائع: راسل seller@uniqaia.com لحذفه.", "err": "حدث خطأ. أعد المحاولة."}
  };
  var CATPAGES = { "nuovi-talenti":"independent-designers", "fatto-a-mano":"the-gem-room", "gioielli-indiani":"collection", "perle":"pearls-corals", "gemme-di-colore":"specials", "made-in-italy":"the-classics" };
  var LOC = { it:"it-IT", en:"en-GB", fr:"fr-FR", ar:"ar-AE-u-nu-latn", ru:"ru-RU" };
  var Q = new URLSearchParams(location.search), lang = (Q.get("lang") || "").toLowerCase();
  if (!ME[lang]) { try { lang = localStorage.getItem("vetrina-lang") || ""; } catch(e){} }
  if (!ME[lang]) { var nav = (navigator.language || "en").slice(0, 2).toLowerCase(); lang = ME[nav] ? nav : "en"; }
  var m = ME[lang], t = TT[lang] || TT.en, $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); };
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; document.title = m.title + " · Uniqaia";
  $("foot").innerHTML = uqFoot(t);
  var sb = window.supabase.createClient(CFG.url, CFG.key);
  var offMsg = "";
  // link in fondo ai promemoria: con k e id spegne solo quella diretta, senza spegne tutto. Funziona con un tocco, senza entrare (LEG-015, E.7)
  var off = (Q.get("off") || "").replace(/[^a-f0-9]/g, "").slice(0, 64), offK = Q.get("k"), offId = (Q.get("id") || "").replace(/[^a-f0-9-]/g, "").slice(0, 36);
  var one = (offK === "show" || offK === "night") && offId.length === 36;
  var start = off.length === 64 ? sb.rpc("reminders_off", one ? { p_token: off, p_kind: offK, p_id: offId } : { p_token: off }).then(function(r){ if (r.data) offMsg = one ? m.remOffOne : m.remOffDone; }) : Promise.resolve();
  if (off) { ["off", "k", "id"].forEach(function(k){ Q.delete(k); }); try { history.replaceState(null, "", location.pathname + (Q.toString() ? "?" + Q.toString() : "")); } catch(e){} }
  start.then(function(){ return UQG.init(sb, { lang: lang, base: CFG.base }); }).then(render);
  UQG.onAuth(render);

  function tr(o, fb){ o = o || {}; return o[lang] || o.en || fb || ""; }
  function fmt(d, o){ try { return new Intl.DateTimeFormat(LOC[lang], o).format(new Date(d)); } catch(e){ return ""; } }
  function link(x){
    if (x.kind === "night") return ROOT + (CATPAGES[x.category] ? "c/" + CATPAGES[x.category] + "/" : "") + "?lang=" + lang;
    if (x.status === "live" || !x.slug) return ROOT + x.seller_slug + "/?s=" + x.id + "&lang=" + lang;
    return ROOT + x.seller_slug + "/" + x.slug + (lang === "en" ? "/" : "/" + lang + "/");
  }
  function render(){
    var u = UQG.user(), page = $("page");
    if (!u) {
      page.innerHTML = '<h1>' + esc(m.title) + '</h1>' + (offMsg ? '<p class="note">' + esc(offMsg) + '</p>' : '') + '<p class="lead">' + esc(m.out) + '</p><p><button class="btn dark" type="button" id="in">' + esc(m.signin) + '</button></p>';
      $("in").addEventListener("click", function(){ UQG.login({ title: m.title }); });
      return;
    }
    Promise.all([UQG.rpc("my_profile"), UQG.rpc("my_saved")]).then(function(r){
      var p = r[0] || {}, list = r[1] || [], inv = "https://uniqaia.com/?ref=" + p.ref_code;
      var rows = list.map(function(x){
        var st = x.status === "live" ? m.liveNow : (x.status === "ended" ? m.ended : fmt(x.at, { hour:"2-digit", minute:"2-digit" }));
        var sub = x.kind === "night" ? m.evening : (x.seller || "") + " · " + st;   // le serate durano tutto il giorno: niente orario
        return '<div class="sl"><div class="d"><small>' + esc(fmt(x.at, { weekday:"short" })) + '</small><b>' + esc(fmt(x.at, { day:"numeric" })) + '</b></div>'
          + '<div class="t"><a href="' + esc(link(x)) + '"><b dir="auto">' + esc(tr(x.title_i18n, x.title)) + '</b><small>' + esc(fmt(x.at, { month:"long" })) + ' · ' + esc(sub) + '</small></a>'
          + (x.status === "ended" ? "" : '<div class="rr"><label><input type="checkbox" data-r="24" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '"' + (x.rem24 !== false ? " checked" : "") + '>' + esc(UQG.t("rem24")) + '</label>'
            + '<label><input type="checkbox" data-r="15" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '"' + (x.rem15 !== false ? " checked" : "") + '>' + esc(UQG.t("rem15")) + '</label></div>')
          + '</div><button class="rm" type="button" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '">' + esc(m.remove) + '</button></div>';
      }).join("");
      var n = +p.invited || 0;
      page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="who">' + esc(p.email || "") + '</p>' + (offMsg ? '<p class="note">' + esc(offMsg) + '</p>' : '')
        + '<section><h2>' + esc(m.saved) + '</h2>' + (rows || '<p class="lead">' + esc(m.empty) + '</p><p><a class="btn" href="' + ROOT + '?lang=' + lang + '">' + esc(m.browse) + '</a></p>')
        + '<p style="margin-top:16px"><label class="tog"><input type="checkbox" id="rem"' + (p.reminders ? " checked" : "") + '><span>' + esc(m.rem) + '</span></label></p></section>'
        // My Invitations: solo il numero, nessun premio né classifica (LEG-015, sezione D)
        + '<section><h2>' + esc(m.inv) + '</h2><p class="lead">' + esc(m.invT) + '</p><span class="me-lbl">' + esc(m.yourLink) + '</span><div class="inv"><input readonly id="invUrl" aria-label="' + esc(m.yourLink) + '" value="' + esc(inv) + '"><button class="btn" type="button" id="cp">' + esc(m.copy) + '</button><span id="shr"></span></div>'
        + '<p class="lead" style="font-size:13px;margin-top:8px">' + esc(m.yourCode.replace("{c}", p.ref_code || "")) + '</p>'
        + '<p class="lead" style="margin:14px 0 2px;color:var(--ink)">' + esc(m.joined.replace("{n}", n)) + '</p><p class="lead" style="font-size:13px">' + esc(m.privacyNote) + '</p></section>'
        + '<section class="acts"><button class="btn" type="button" id="out">' + esc(m.signout) + '</button><button class="btn danger" type="button" id="del">' + esc(m.del) + '</button></section>'
        + '<div class="note" id="delBox" hidden><p style="margin:0 0 12px">' + esc(m.delAsk) + '</p><div class="acts"><button class="btn danger" type="button" id="delYes">' + esc(m.delYes) + '</button><button class="btn" type="button" id="delNo">' + esc(m.delNo) + '</button></div></div>'
        + '<p class="lead" id="msg" role="status"></p>';
      Array.prototype.forEach.call(page.querySelectorAll(".rm"), function(b){ b.addEventListener("click", function(){ b.disabled = true; UQG.rpc("save_life", { p_kind: b.getAttribute("data-k"), p_id: b.getAttribute("data-id"), p_on: false }).then(render, function(){ b.disabled = false; $("msg").textContent = m.err; }); }); });
      Array.prototype.forEach.call(page.querySelectorAll("[data-r]"), function(c){ c.addEventListener("change", function(){
        var row = c.closest(".rr"), a = row.querySelector('[data-r="24"]'), b = row.querySelector('[data-r="15"]');
        UQG.rpc("set_life_reminders", { p_kind: c.getAttribute("data-k"), p_id: c.getAttribute("data-id"), p_rem24: a.checked, p_rem15: b.checked }).catch(function(){ c.checked = !c.checked; $("msg").textContent = m.err; });
      }); });
      $("rem").addEventListener("change", function(){ var c = this; UQG.rpc("set_reminders", { p_on: c.checked }).then(function(){ offMsg = ""; }, function(){ c.checked = !c.checked; $("msg").textContent = m.err; }); });
      $("cp").addEventListener("click", function(){ var i = $("invUrl"); i.select(); var done = function(){ UQG.toast(m.copied); }; if (navigator.clipboard) navigator.clipboard.writeText(i.value).then(done, done); else { try { document.execCommand("copy"); } catch(e){} done(); } });
      $("shr").replaceWith(UQG.shareBtn({ kind: "home", id: null, url: inv, title: "Uniqaia", text: m.invMsg.replace("{code}", p.ref_code || "") }, "btn"));
      $("out").addEventListener("click", function(){ UQG.signOut().then(render); });
      $("del").addEventListener("click", function(){ $("delBox").hidden = false; $("delYes").focus(); });
      $("delNo").addEventListener("click", function(){ $("delBox").hidden = true; $("del").focus(); });
      $("delYes").addEventListener("click", function(){
        this.disabled = true;
        UQG.rpc("delete_my_account").then(function(){ return UQG.signOut(); }).then(function(){ page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="note">' + esc(m.delDone) + '</p>'; },
          function(e){ $("delYes").disabled = false; $("msg").textContent = /seller/.test(String(e && e.message)) ? m.delSeller : m.err; });
      });
    }, function(){ page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="lead">' + esc(m.err) + '</p>'; });
  }
})();
</script>
</body></html>
