<!doctype html><html lang="it"><head>{{HEAD}}<meta name="robots" content="noindex,nofollow"><title>Seller · {{NAME}}</title><style>{{CSS}}
.sa{max-width:1240px;margin:0 auto;padding:20px 14px 80px;display:flex;flex-direction:column;gap:16px}
.sa h1{font-family:var(--display);font-size:clamp(24px,4vw,32px)}
.sa h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-edge);font-weight:500;margin:0 0 10px}
.sa .box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.sa .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sa .sm{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.sa .sm.dark{background:var(--gold-ink);color:var(--gold-hi);border-color:var(--gold-ink)}
.sa .sm.on{background:var(--gold-ink);color:var(--gold-hi);border-color:var(--gold-ink)}
.sa .sm:disabled{opacity:.5;cursor:default}
.sa .warn{background:#FFF6E5;border:1px solid #EDD596;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.sa .err{color:#B42318}
.sa .muted{color:var(--muted);font-size:13px}
.sa table{width:100%;border-collapse:collapse;font-size:13.5px}
.sa th{text-align:start;font-weight:500;color:var(--muted);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sa td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.sa tr.app{cursor:pointer}
.sa tr.app:hover td{background:var(--soft)}
.sa tr.sel td{background:var(--soft-2)}
.sa .scroll{overflow-x:auto}
.sa .st{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.sa .st.new{background:#FFF6E5;border-color:#EDD596}
.sa .st.approved,.sa .st.active,.sa .st.sent{background:#E9F6EF;border-color:#9fd3b6}
.sa .st.rejected,.sa .st.blocked,.sa .st.failed,.sa .st.past_due,.sa .st.canceled{background:#f8e7e7;border-color:#e2b4b4}
.sa .detail{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.sa dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:14px}
.sa dt{color:var(--muted)}
.sa dd{margin:0;word-break:break-word}
.sa .imgs{display:flex;gap:8px;flex-wrap:wrap}
.sa .imgs img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.sa input[type=text],.sa textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;width:100%;font-size:14px}
.sa textarea{min-height:70px}
.sa .act{display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.sa .detail{grid-template-columns:1fr}.sa dl{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top wrap"><div class="col"><div class="brand"><a class="logo" href="{{BASE}}/" aria-label="{{NAME}}">Uniqaia</a><small>SELLER · CANDIDATURE, APPROVAZIONI, PAGAMENTI</small></div></div></header>
<main class="sa" id="app"><p class="muted">Caricamento…</p></main>
<script>
{{LKJS}}
// Pannello di approvazione dei seller (4 novembre 2026). Solo con la chiave della gemmologa (?k=).
// L'approvazione non attiva l'abbonamento: prepara il link di pagamento. L'abbonamento si attiva solo con il pagamento confermato da Stripe.
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","base":"{{BASE}}","token":"{{TOKEN}}"};
  var $ = function(id){ return document.getElementById(id); };
  var PFX = location.pathname.replace(/\/admin\/?.*$/, ""), D = null, H = null, OUT = [], sel = null, msg = "", imgs = {}, G = null, TH = [], WO = null;
  var GST = { da_pagare: "Da pagare", pagata: "Pagata", annullata: "Annullata" };
  function themeSel(id, cur, withNone){ return '<select id="' + id + '" class="sm" style="padding:0 10px">' + (withNone ? '<option value="">— nessuna serata —</option>' : '<option value="">Scegli la serata…</option>') +
    TH.map(function(t){ return '<option value="' + esc(t.title) + '"' + (t.title === cur ? " selected" : "") + '>' + esc(t.title) + '</option>'; }).join("") + '</select>'; }
  function eur(c){ return c == null ? "—" : new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: c % 100 ? 2 : 0 }).format(c / 100); }
  function dt(s){ return s ? new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date(s)) : "—"; }
  function post(path, body){ return fetch(CFG.url + path, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + CFG.key }, body: JSON.stringify(body) })
    .then(function(r){ return r.text().then(function(x){ var d = null; try { d = x ? JSON.parse(x) : null; } catch(e){} if (!r.ok) throw new Error((d && (d.message || d.error)) || r.status); return d; }); }); }
  function rpc(fn, a){ return post("/rest/v1/rpc/" + fn, a); }
  function slugify(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40); }
  var APP = { new: "In attesa", needs_info: "Integrazioni richieste", invited: "Proposta da te", approved: "Approvata", rejected: "Rifiutata" };
  var LINK = { blocked: "Fermo: Stripe non collegato", queued: "In invio", held: "Pronto, email non attive", sent: "Inviato", failed: "Invio fallito", cancelled: "Annullato" };
  var MS = { queued: "In coda", sending: "In invio", held: "Trattenuta (Resend non attivo)", blocked: "Ferma (Stripe non in produzione)", sent: "Inviata", failed: "Non inviata", cancelled: "Annullata" };
  var MT = { received: "Candidatura ricevuta", admin_new: "Avviso nuova candidatura", approved_payment: "Approvazione + link di pagamento", activated: "Abbonamento attivo + pannello", info_request: "Richiesta integrazioni", rejected: "Candidatura non accolta", invite: "Invito", approved: "Approvazione (vecchia)" };
  var SUB = { awaiting_payment: "In attesa di pagamento", active: "Attivo", past_due: "Rinnovo non pagato", unpaid: "Non pagato", canceled: "Disdetto" };
  var BILL = { off: "Spento", test: "Prova", live: "Produzione" };
  var PRIZE = { provisional: "provvisorio", linked: "legato all'account", confirmed: "confermato", redeemed: "usato", void: "annullato" };

  function load(){
    return Promise.all([
      rpc("seller_admin_list", { p_token: CFG.token }),
      rpc("list_outbox", { p_token: CFG.token }).catch(function(){ return []; }),
      post("/functions/v1/billing", { action: "health" }).catch(function(){ return null; }),
      rpc("gem_admin_list", { p_token: CFG.token }).catch(function(){ return null; }),
      rpc("night_themes", { p_token: CFG.token }).catch(function(){ return null; }),
      rpc("welcome_admin_get", { p_token: CFG.token }).catch(function(){ return null; })
    ]).then(function(r){ D = r[0]; OUT = r[1] || []; H = r[2]; G = r[3]; TH = r[4] || []; WO = r[5]; draw(); }, function(e){ $("app").innerHTML = '<p class="warn err">' + esc(e.message) + '</p>'; });
  }

  function draw(){
    var A = D.applications || [], h = [], bm = D.billing_mode;
    h.push('<div class="row" style="justify-content:space-between"><h1>Seller</h1><a class="sm" href="' + PFX + '/wheel-admin/?k=' + encodeURIComponent(CFG.token) + '">The Jeweler\'s Wheel →</a></div>');
    if (msg) h.push('<p class="warn err">' + esc(msg) + '</p>');
    // stato dei collegamenti
    var warn = [];
    if (bm === "off") warn.push("Stripe non collegato: le approvazioni preparano il link di pagamento ma l'email resta ferma" + (D.blocked_links ? " (" + D.blocked_links + " in attesa)" : "") + ".");
    if (bm === "test") warn.push("Stripe in prova: i link funzionano solo con le carte di prova e li vedi solo tu, qui. I seller non vedono il pulsante di pagamento e non ricevono email. Quello che paghi in prova non vale: passando a «Produzione» torna da pagare.");
    if (!D.legal_ready) warn.push("Informativa privacy e condizioni non pubblicate: il modulo di candidatura non si può inviare.");
    if (D.mail_mode !== "live") warn.push("Invio email non attivo (Resend): le email restano in coda e si leggono qui sotto.");
    var hk = H ? (H.key === "none" ? "chiave assente" : "chiave di " + (H.key === "live" ? "produzione" : "prova")) + (H.webhook ? ", webhook configurato" : ", webhook mancante") : "funzione di pagamento non raggiungibile";
    h.push('<section class="box"><h2>Pagamenti con Stripe</h2><div class="row">' + ["off", "test", "live"].map(function(m){ return '<button class="sm' + (bm === m ? " on" : "") + '" data-bill="' + m + '">' + BILL[m] + '</button>'; }).join("") +
      '<span class="muted">Stripe: ' + esc(hk) + ' · ' + D.plan.lives_per_month + ' dirette al mese da ' + D.plan.live_max_min + ' minuti, ' + eur(D.plan.price_cents) + ' al mese</span></div>' +
      (warn.length ? '<div class="warn" style="margin-top:10px">' + warn.map(esc).join("<br>") + '</div>' : "") +
      ((D.alerts || []).length ? '<div class="warn err" style="margin-top:10px"><b>Da controllare su Stripe</b> — pagamenti doppi o non corrispondenti:<br>' +
        D.alerts.map(function(x){ return esc(dt(x.at) + " · " + x.type + " · " + x.result); }).join("<br>") + '</div>' : "") + '</section>');
    // offerta di benvenuto uguale per tutti, al posto della ruota (7/11/2026)
    if (WO) {
      var woOn = WO.active, woP = (WO.first_cents || WO.preview_cents || 11900) / 100, woU = WO.until ? new Date(WO.until) : null;
      var woD = woU ? new Date(woU.getTime() - woU.getTimezoneOffset() * 60000).toISOString().slice(0, 10) : "";
      h.push('<section class="box"><h2>Offerta di benvenuto</h2>' +
        '<p class="muted" style="margin:0 0 10px">Al posto della ruota (in demo dal 7/11): il primo mese a un prezzo d\'offerta, uguale per tutti, per ogni brand approvato. Vale per chi si candida mentre è accesa e per chi approvi mentre è accesa: se la spegni, chi si era già candidato la tiene. La vedono nella finestra di benvenuto, nel riquadro per i seller in home e su /join; l\'anteprima è <a href="' + PFX + '/join/?welcome=preview" target="_blank" rel="noopener">/join/?welcome=preview</a>.</p>' +
        '<p>' + (woOn ? '<span class="st active">Accesa</span> dal ' + dt(WO.since) + ' · primo mese <b>' + eur(WO.first_cents) + '</b> invece di ' + eur(WO.std_cents) + (WO.until ? ' · fino al ' + dt(WO.until) : ' · senza data di fine') : '<span class="st canceled">Spenta</span>') + '</p>' +
        '<div class="row" style="margin-top:8px"><label class="muted">Primo mese (€) <input type="number" id="woP" min="1" step="1" value="' + woP + '" class="sm" style="max-width:90px"></label>' +
        '<label class="muted">Fino al (facoltativo) <input type="date" id="woU" value="' + woD + '" class="sm"></label>' +
        '<button class="sm dark" data-do="woOn">' + (woOn ? "Aggiorna" : "Accendi") + '</button>' + (woOn ? '<button class="sm" data-do="woOff">Spegni</button>' : "") + '</div>' +
        ((WO.history || []).length ? '<p class="muted" style="margin-top:8px">Storico: ' + WO.history.slice(0, 5).map(function(x){ return eur(x.first_cents) + ' dal ' + dt(x.from) + (x.to ? ' al ' + dt(x.to) : ' (accesa)'); }).map(esc).join(' · ') + '</p>' : "") +
        '</section>');
    }
    // candidature
    h.push('<section class="box"><h2>Candidature (' + A.length + ')</h2>');
    if (!A.length) h.push('<p class="muted">Nessuna candidatura.</p>');
    else {
      h.push('<div class="scroll"><table><thead><tr><th>Brand</th><th>Email del referente</th><th>Candidatura</th><th>Premio della ruota</th><th>Primo mese</th><th>Inviata</th><th>Approvata</th><th>Link di pagamento</th><th>Abbonamento</th></tr></thead><tbody>');
      A.forEach(function(a){
        var prize = a.prize_name ? esc(a.prize_name) + (a.prize_mode === "demo" ? ' <span class="muted">(demo)</span>' : "") : '<span class="muted">—</span>';
        h.push('<tr class="app' + (sel === a.id ? " sel" : "") + '" data-id="' + a.id + '"><td><b>' + esc(a.brand) + '</b>' + (a.has_account ? "" : '<br><span class="muted">senza account</span>') + '</td><td>' + esc(a.email) + '</td>' +
          '<td><span class="st ' + a.status + '">' + (APP[a.status] || a.status) + '</span></td><td>' + prize + '</td><td>' + eur(a.first_month_cents) + '</td>' +
          '<td class="muted">' + dt(a.submitted_at) + '</td><td class="muted">' + (a.status === "approved" ? dt(a.decided_at) : "—") + '</td>' +
          '<td>' + (a.link_status ? '<span class="st ' + a.link_status + '">' + (LINK[a.link_status] || a.link_status) + '</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (a.subscription_status ? '<span class="st ' + a.subscription_status + '">' + (SUB[a.subscription_status] || a.subscription_status) + (a.test_payment && a.subscription_status !== "awaiting_payment" ? " (prova)" : "") + '</span>' + (a.activated_at ? '<br><span class="muted">dal ' + dt(a.activated_at) + '</span>' : "") : '<span class="muted">—</span>') + '</td></tr>');
        if (sel === a.id) h.push('<tr><td colspan="9">' + detail(a) + '</td></tr>');
      });
      h.push('</tbody></table></div>');
    }
    h.push('<p class="muted" style="margin-top:8px">Il prezzo del primo mese lo calcola il server all\'approvazione: se spetta l\'offerta di benvenuto vale l\'offerta; altrimenti solo un premio confermato della ruota pubblica (oggi in demo: nessuno sconto). Prima dell\'approvazione la colonna «Primo mese» non conta ancora l\'offerta di benvenuto. L\'abbonamento diventa «Attivo» solo quando Stripe conferma il pagamento.</p></section>');
    // calendario delle dirette (7/11/2026): serata di ogni seller, prenotazioni della gemmologa, ore bloccate
    if (G) {
      var B = G.bookings || [], K = G.blocks || [], J = G.themes || [];
      h.push('<section class="box"><h2>Calendario delle dirette · gemmologa</h2>' +
        '<p class="muted" style="margin:0 0 10px">Ogni seller prenota da solo le sue dirette: 4 al mese, una a settimana. Orari liberi, nel fuso del seller, nei giorni della sua serata; brand diversi possono sovrapporsi. La gemmologa costa 50 € l\'ora ed è prenotabile dalle 5 all\'una di notte (ora italiana), se non è già in un\'altra diretta e se non hai bloccato quelle ore.</p>' +
        '<h3 style="font-size:14px;margin:6px 0">Serata di ogni seller' + (G.founding_left != null ? ' · Founding 20: restano ' + G.founding_left + ' numeri' : '') + '</h3><div class="scroll"><table><thead><tr><th>Seller</th><th>Serata</th><th></th></tr></thead><tbody>' +
        J.map(function(j, i){ return '<tr><td><b>' + esc(j.name) + '</b>' + (j.founding_no ? ' <span class="st active">Founding #' + (j.founding_no < 10 ? "0" : "") + j.founding_no + '</span>' : '') + '<br><span class="muted">/' + esc(j.slug) + '</span></td><td>' + themeSel("th" + i, j.theme, true) + '</td><td><button class="sm" data-theme="' + i + '">Salva</button></td></tr>'; }).join("") + '</tbody></table></div>' +
        '<h3 style="font-size:14px;margin:14px 0 6px">Prenotazioni della gemmologa</h3>' + (B.length ? '<div class="scroll"><table><thead><tr><th>Quando</th><th>Seller</th><th>Diretta</th><th>Prezzo</th><th>Stato</th><th></th></tr></thead><tbody>' +
          B.map(function(g){ return '<tr><td>' + dt(g.at) + '</td><td>' + esc(g.seller) + '</td><td>' + esc(g.show_title || "") + '</td><td>' + eur(g.price_cents) + '</td><td><span class="st ' + (g.status === "pagata" ? "active" : (g.status === "annullata" ? "canceled" : "new")) + '">' + esc(GST[g.status] || g.status) + '</span>' + (g.paid_at ? '<br><span class="muted">' + dt(g.paid_at) + '</span>' : "") + '</td><td class="row">' +
            (g.status !== "pagata" ? '<button class="sm" data-gem="' + g.id + '" data-st="pagata">Segna pagata</button>' : '<button class="sm" data-gem="' + g.id + '" data-st="da_pagare">Da pagare</button>') +
            (g.status !== "annullata" ? '<button class="sm" data-gem="' + g.id + '" data-st="annullata">Annulla</button>' : "") + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<p class="muted">Nessuna prenotazione della gemmologa.</p>') +
        '<h3 style="font-size:14px;margin:14px 0 6px">Ore in cui non ci sei</h3>' + (K.length ? '<div class="scroll"><table><tbody>' + K.map(function(k){ return '<tr><td>' + dt(k.from) + ' → ' + dt(k.to) + '</td><td>' + esc(k.note || "") + '</td><td><button class="sm" data-unblock="' + k.id + '">Togli</button></td></tr>'; }).join("") + '</tbody></table></div>' : '<p class="muted">Nessuna ora bloccata: sei disponibile in tutte le dirette non ancora prenotate.</p>') +
        '<div class="row" style="margin-top:8px"><label class="muted">Giorno <input type="date" id="blDay" class="sm"></label><label class="muted">dalle <input type="time" id="blFrom" value="18:00" class="sm"></label><label class="muted">alle <input type="time" id="blTo" value="21:00" class="sm"></label><input type="text" id="blNote" placeholder="Nota (facoltativa)" style="max-width:220px"><button class="sm dark" data-do="block">Blocca</button></div>' +
        '</section>');
    }
    // coda email
    h.push('<section class="box"><h2>Email in coda</h2>' + (OUT.length ? '<div class="scroll"><table><thead><tr><th>Data</th><th>Tipo</th><th>A</th><th>Stato</th><th>Oggetto</th></tr></thead><tbody>' + OUT.slice(0, 60).map(function(o){
      return '<tr><td class="muted">' + dt(o.created_at) + '</td><td>' + esc(MT[o.template] || o.template) + '</td><td>' + esc(o.to_email) + '</td><td><span class="st ' + o.status + '">' + esc(MS[o.status] || o.status) + '</span></td><td>' + esc(o.subject || "") + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<p class="muted">Nessuna email.</p>') + '</section>');
    $("app").innerHTML = h.join(""); bind();
  }

  function detail(a){
    var cats = (a.categories || []).join(", "), im = imgs[a.id];
    var dl = [["Ragione sociale", a.legal_name], ["Partita IVA", a.vat_number], ["Referente", a.contact_name], ["Telefono", a.phone], ["Paese e città", (a.country || "") + " · " + (a.city || "")],
      ["Sito", a.site], ["Instagram", a.instagram ? "@" + a.instagram : ""], ["Tipo", a.kind === "gems" ? "Commerciante di Pietre Preziose" : "Gioielleria"], ["Categorie", cats], ["Chi sono", a.description], ["Cosa mostrerebbe", a.show_what],
      ["Lingua", a.lang], ["Premio", a.prize_name ? a.prize_name + " · " + (a.prize_mode === "demo" ? "demo, senza sconto" : (PRIZE[a.prize_status] || a.prize_status)) : "—"], ["Note", a.notes || a.info_request]]
      .map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1] || "—") + '</dd>'; }).join("");
    var act = [];
    if (a.status === "new") {
      act.push('<label class="muted">Indirizzo pubblico del seller<input type="text" id="slug" value="' + esc(slugify(a.brand)) + '"></label>' +
        (G ? '<label class="muted">Serata in cui potrà prenotare le dirette' + themeSel("theme", "", false) + '</label>' : "") +
        '<button class="sm dark" data-do="approve">Approva e prepara il pagamento</button>');
      act.push('<label class="muted">Cosa manca<textarea id="info"></textarea></label><button class="sm" data-do="info">Chiedi integrazioni</button>');
      act.push('<label class="muted">Nota interna sul rifiuto<input type="text" id="rej"></label><button class="sm" data-do="reject">Rifiuta</button>');
    }
    if (a.pay_token) act.push('<div class="warn">Link di pagamento' + (D.billing_mode === "test" ? " (solo per le tue prove con le carte di prova: il seller non lo vede)" : " (lo stesso dell'email al seller)") + ':<br><input type="text" readonly value="' + esc(location.origin + PFX + "/pay/?t=" + a.pay_token) + '" id="paylink"><button class="sm" data-do="copy" style="margin-top:6px">Copia il link</button></div>');
    if (a.subscription_status === "awaiting_payment" && D.billing_mode === "off") act.push('<p class="warn">Approvata: il link di pagamento partirà quando colleghi Stripe in produzione. Nessun link finto viene inviato.</p>');
    if (a.slug && a.subscription_status === "active") act.push('<p class="muted">Pagina del seller: ' + esc(PFX + "/" + a.slug + "/") + (a.is_public ? "" : " (ancora nascosta)") + '</p>');
    return '<div class="detail"><dl>' + dl + '</dl><div class="act"><div class="imgs">' + (im ? im.map(function(u){ return '<img src="' + esc(u) + '" alt="">'; }).join("") : (a.has_logo ? '<button class="sm" data-do="imgs">Mostra logo e foto</button>' : '<span class="muted">Nessuna immagine</span>')) + '</div>' + act.join("") + '</div></div>';
  }

  function act(p){ msg = ""; return p.then(load, function(e){ msg = e.message; draw(); }); }
  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme]"), function(b){ b.addEventListener("click", function(){
      var j = (G.themes || [])[+b.getAttribute("data-theme")]; if (!j) return;
      act(rpc("set_seller_theme", { p_token: CFG.token, p_jeweler: j.id, p_theme: $("th" + b.getAttribute("data-theme")).value || null }));
    }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-gem]"), function(b){ b.addEventListener("click", function(){
      if (b.getAttribute("data-st") === "annullata" && !confirm("Annullare la gemmologa per questa diretta? L'ora torna libera per gli altri seller.")) return;
      act(rpc("gem_mark", { p_token: CFG.token, p_id: b.getAttribute("data-gem"), p_status: b.getAttribute("data-st") }));
    }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-unblock]"), function(b){ b.addEventListener("click", function(){ act(rpc("gem_block_remove", { p_token: CFG.token, p_id: b.getAttribute("data-unblock") })); }); });
    Array.prototype.forEach.call(document.querySelectorAll("tr.app"), function(tr){ tr.addEventListener("click", function(){ var id = tr.getAttribute("data-id"); sel = sel === id ? null : id; draw(); }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-bill]"), function(b){ b.addEventListener("click", function(){
      var m = b.getAttribute("data-bill");
      if (m === "live" && !confirm("Rendere attivi i pagamenti veri? Le email con i link di pagamento in attesa partiranno ai seller approvati. I pagamenti fatti in prova vengono annullati e tornano da pagare.")) return;
      act(rpc("billing_admin_set_mode", { p_token: CFG.token, p_mode: m }));
    }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-do]"), function(b){ b.addEventListener("click", function(e){
      e.stopPropagation(); var d = b.getAttribute("data-do"), id = sel;
      if (d === "approve") {
        var th = $("theme") ? $("theme").value : "";
        if (G && !th) { msg = "Scegli la serata in cui il seller potrà prenotare le dirette."; draw(); return; }
        act(rpc("approve_application", { p_token: CFG.token, p_id: id, p_slug: $("slug").value }).then(function(rows){
          var row = rows && rows[0]; if (!th || !row || !row.jeweler_id) return rows;
          return rpc("set_seller_theme", { p_token: CFG.token, p_jeweler: row.jeweler_id, p_theme: th });
        }));
      }
      if (d === "block") {
        var day = $("blDay").value, f = $("blFrom").value, t = $("blTo").value;
        if (!day || !f || !t) { msg = "Scegli il giorno e le ore da bloccare."; draw(); return; }
        act(rpc("gem_block_add", { p_token: CFG.token, p_from: new Date(day + "T" + f).toISOString(), p_to: new Date(day + "T" + t).toISOString(), p_note: $("blNote").value }));
      }
      if (d === "woOn") {
        var eu = parseFloat(($("woP").value || "").replace(",", ".")), ud = $("woU").value;
        if (!(eu > 0)) { msg = "Scrivi il prezzo del primo mese."; draw(); return; }
        act(rpc("welcome_admin_set", { p_token: CFG.token, p_on: true, p_first_cents: Math.round(eu * 100), p_until: ud ? new Date(ud + "T23:59:59").toISOString() : null }));
      }
      if (d === "woOff") { if (!confirm("Spegnere l'offerta di benvenuto? Chi si è già candidato la tiene.")) return; act(rpc("welcome_admin_set", { p_token: CFG.token, p_on: false })); }
      if (d === "reject") act(rpc("reject_application", { p_token: CFG.token, p_id: id, p_notes: $("rej").value }));
      if (d === "info") act(rpc("request_info", { p_token: CFG.token, p_id: id, p_message: $("info").value }));
      if (d === "copy") { var i = $("paylink"); i.select(); try { navigator.clipboard.writeText(i.value); } catch(x){ document.execCommand("copy"); } b.textContent = "Copiato"; }
      if (d === "imgs") post("/functions/v1/seller-files", { action: "view", key: CFG.token, id: id }).then(function(r){ imgs[id] = (r.files || []).map(function(f){ return f.url; }); draw(); }, function(x){ msg = x.message; draw(); });
    }); });
  }

  if (!CFG.token) { $("app").innerHTML = '<p class="warn">Apri questa pagina con il tuo link da gemmologa: lo stesso indirizzo con <b>?k=</b> e la tua chiave del pannello.</p>'; return; }
  load();
})();
</script>
</body></html>
