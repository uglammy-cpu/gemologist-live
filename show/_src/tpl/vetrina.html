<!doctype html><html lang="{{LANG}}"><head>{{HEAD}}<title>{{NAME}}</title><style>{{CSS}}</style></head>
<body class="vetrina">
<header class="topv wrap"><div class="col">
  <div class="brand"><a class="logo" href="{{BASE}}/live" aria-label="{{NAME}}"><svg class="ulogo" xmlns="http://www.w3.org/2000/svg" viewBox="88 32 830 190" role="img" aria-label="Uniqaia"><g font-family="'Cormorant Garamond',Garamond,'Times New Roman',serif" font-weight="500" font-size="150" fill="currentColor" text-anchor="middle"><text x="151" y="160">U</text><text x="283" y="160">N</text><text x="386" y="160">I</text><text x="659" y="160">A</text><text x="756" y="160">I</text><text x="853" y="160">A</text></g><path fill="var(--logo-gold,#A47F3A)" fill-rule="evenodd" d="M 435 112.5 A 75 75 0 1 0 585 112.5 A 75 75 0 1 0 435 112.5 Z M 453 112.5 A 57 67 0 1 0 567 112.5 A 57 67 0 1 0 453 112.5 Z"/><path fill="var(--logo-gold,#A47F3A)" d="M 521.7 186.6 C 545 196 575 203 610 202 C 575 214 540 212 512 196 Z"/><path d="M 470.1 90.5 A 44 52 0 0 1 495 63.6" fill="none" stroke="var(--logo-gold,#A47F3A)" stroke-width="5" stroke-linecap="round"/><circle cx="510" cy="112.5" r="14" fill="var(--logo-gem,#D43F52)"/></svg></a><small id="tag"></small></div><template id="logoTpl"><svg class="ulogo" xmlns="http://www.w3.org/2000/svg" viewBox="88 32 830 190" role="img" aria-label="Uniqaia"><g font-family="'Cormorant Garamond',Garamond,'Times New Roman',serif" font-weight="500" font-size="150" fill="currentColor" text-anchor="middle"><text x="151" y="160">U</text><text x="283" y="160">N</text><text x="386" y="160">I</text><text x="659" y="160">A</text><text x="756" y="160">I</text><text x="853" y="160">A</text></g><path fill="var(--logo-gold,#A47F3A)" fill-rule="evenodd" d="M 435 112.5 A 75 75 0 1 0 585 112.5 A 75 75 0 1 0 435 112.5 Z M 453 112.5 A 57 67 0 1 0 567 112.5 A 57 67 0 1 0 453 112.5 Z"/><path fill="var(--logo-gold,#A47F3A)" d="M 521.7 186.6 C 545 196 575 203 610 202 C 575 214 540 212 512 196 Z"/><path d="M 470.1 90.5 A 44 52 0 0 1 495 63.6" fill="none" stroke="var(--logo-gold,#A47F3A)" stroke-width="5" stroke-linecap="round"/><circle cx="510" cy="112.5" r="14" fill="var(--logo-gem,#D43F52)"/></svg></template>
  <div class="topright"><button class="about-btn" type="button" id="aboutBtn"></button><div class="langs" id="langs"><button type="button" class="cur" id="langCur" aria-haspopup="listbox">IT</button><div class="menu" id="langMenu" hidden><button type="button" data-lang="it">Italiano <small>IT</small></button><button type="button" data-lang="en">English <small>EN</small></button><button type="button" data-lang="fr">Français <small>FR</small></button><button type="button" data-lang="ar">العربية <small>AR</small></button><button type="button" data-lang="ru">Русский <small>RU</small></button></div></div></div>
</div></header>
<main class="wrap"><div class="col">
  <div class="search" style="display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:10px 16px;margin-top:14px;color:var(--muted);font-size:15px"><span id="searchIc" style="display:flex"></span><input id="q" type="search" style="flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);min-height:0;padding:0"></div>
  <nav class="tabs" id="tabs">
    <button class="tab on" type="button" data-to="live"><span data-t="tabLive"></span><span class="n" id="nLive" hidden>0</span></button>
    <button class="tab" type="button" data-to="soon" data-t="tabSoon"></button>
    <button class="tab" type="button" data-to="browse" data-t="tabCats"></button>
    <button class="tab" type="button" data-to="shops" data-t="tabShops"></button>
  </nav>
  <div class="cats" id="cats"></div>
  <div class="hero" id="hero"><div class="track" id="track"></div><button class="arr prev" type="button" id="prevSlide" aria-label="‹">‹</button><button class="arr next" type="button" id="nextSlide" aria-label="›">›</button><div class="dots" id="dots"></div></div>
  <div class="trust" id="trust"></div>
  <section id="week" class="week"><div class="sh"><h2 data-t="thisWeek"></h2></div><div id="weekBody"></div></section>
  <section id="live"><div class="sh"><h2 data-t="hLive"></h2></div><div class="grid" id="gridLive"></div><div class="empty" id="emptyLive" hidden></div></section>
  <section id="soon"><div class="sh"><h2 data-t="later"></h2></div><div class="grid" id="gridSoon"></div><div class="empty" id="emptySoon" hidden></div></section>
  <section id="browse"><div class="sh"><h2 data-t="hCats"></h2></div><div class="tiles" id="tiles"></div></section>
  <section id="shops"><div class="sh"><h2 data-t="hShops"></h2><a id="joinLink" href="{{BASE}}/live/join" data-t="join"></a></div><div class="shops" id="shopsRow"></div></section>
  <div class="cta" id="cta"></div>
</div></main>
<footer class="wrap" id="foot"></footer>
<div class="welcome" id="welcome" hidden></div>
<script>
{{LKJS}}
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","base":"{{BASE}}","name":"{{NAME}}","lang":"{{LANG}}","art":{{ART}}};
  var TT = {{T}};
  var sb = window.supabase.createClient(CFG.url, CFG.key);
  var $ = function(id){ return document.getElementById(id); };
  var LOC = { it:"it-IT", en:"en-GB", fr:"fr-FR", ar:"ar-AE-u-nu-latn", ru:"ru-RU" };
  var PAL = ["#3A2A17,#0F0A05","#122B45,#070D15","#2A2A30,#0A0A0D","#3A1F2C,#120810","#1C3328,#06100B","#2E2140,#0C0814","#22303A,#070B0E"];
  var lang = "";
  try { lang = localStorage.getItem("vetrina-lang") || ""; } catch(e){}
  if (!TT[lang]) { var nav = (CFG.lang || navigator.language || "it").slice(0,2).toLowerCase(); lang = TT[nav] ? nav : "it"; }
  var t = TT[lang];
  var state = { jewelers:{}, shows:[], covers:{}, photos:{}, viewers:{}, channels:{}, cats:[], cat:"", highlights:[], slide:0, timer:null };
  try { var c0 = new URLSearchParams(location.search).get("c") || ""; if (/^[a-z0-9-]{2,40}$/.test(c0)) state.cat = c0; } catch(e){}
  $("searchIc").innerHTML = ICON.search;

  function fday(iso){ try { return new Intl.DateTimeFormat(LOC[lang], { weekday:"short", day:"numeric", month:"short" }).format(new Date(iso)); } catch(e){ return iso; } }
  function ftime(iso){ try { return new Intl.DateTimeFormat(LOC[lang], { hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(iso)); } catch(e){ return ""; } }
  function pal(key){ var h = 0; for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0; return PAL[h % PAL.length].split(","); }
  function title(s){ var i = s.title_i18n || {}; return i[lang] || (lang !== "it" && i.en) || s.title; }
  function kindLabel(j){ return j.kind === "gems" ? t.gems : t.shop; }
  function catName(slug){ var c = null; for (var i = 0; i < state.cats.length; i++) if (state.cats[i].slug === slug) c = state.cats[i]; if (!c) return slug; var n = c.name_i18n || {}; return n[lang] || n.en || n.it || slug; }
  var FOLLOWS = []; try { FOLLOWS = JSON.parse(localStorage.getItem("vetrina-follows") || "[]"); } catch(e){}
  function followed(j){ return FOLLOWS.indexOf(j.slug) >= 0; }
  function inCat(x){ return !state.cat || ((x.categories || []).indexOf(state.cat) >= 0); }
  function catLabel(s){ var bits = [(s.lang || "").toUpperCase()].concat((s.categories || []).slice(0, 2).map(catName)); if (s.price_range) bits.push(s.price_range); return '<small>' + esc(bits.filter(Boolean).join(" · ")) + '</small>'; }
  function nShows(n){ if (n === 0) return t.catSoon; if (n === 1) return t.catOne; if (lang === "ru" && t.catFew){ var m10 = n % 10, m100 = n % 100; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return t.catFew.replace("{n}", n); } return t.catMany.replace("{n}", n); }
  function setCat(slug){ state.cat = slug === state.cat ? "" : slug; try { var u = new URL(location.href); if (state.cat) u.searchParams.set("c", state.cat); else u.searchParams.delete("c"); history.replaceState(null, "", u.toString()); } catch(e){} renderCats(); renderHero(); renderWeek(); renderTiles(); renderLive(); renderSoon(); renderShops(); }
  function renderCats(){
    var box = $("cats"); box.innerHTML = "";
    var all = document.createElement("button"); all.type = "button"; all.className = state.cat ? "" : "on"; all.textContent = t.catAll; all.addEventListener("click", function(){ setCat(""); }); box.appendChild(all);
    state.cats.forEach(function(c){
      var n = state.shows.filter(function(s){ return (s.categories || []).indexOf(c.slug) >= 0; }).length;
      var b = document.createElement("button"); b.type = "button"; b.className = state.cat === c.slug ? "on" : ""; b.innerHTML = esc(catName(c.slug)) + (n ? '<small>' + n + '</small>' : '');
      b.addEventListener("click", function(){ setCat(c.slug); }); box.appendChild(b);
    });
  }
  function renderTiles(){
    var box = $("tiles"); box.innerHTML = "";
    state.cats.forEach(function(c){
      var n = state.shows.filter(function(s){ return (s.categories || []).indexOf(c.slug) >= 0; }).length;
      var p = pal(c.slug);
      var b = document.createElement("button"); b.type = "button"; b.className = "tile" + (state.cat === c.slug ? " on" : ""); b.style.cssText = "--c1:" + p[0] + ";--c2:" + p[1];
      b.innerHTML = (CFG.art[c.art] || CFG.art.ring) + '<b>' + esc(catName(c.slug)) + '</b><small>' + esc(nShows(n)) + '</small>';
      b.addEventListener("click", function(){ setCat(c.slug); var el = $("live"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); });
      box.appendChild(b);
    });
  }
  function showUrl(s, j){ return (s.status === "live" || !s.slug) ? CFG.base + "/live/" + j.slug + "?s=" + s.id + "&lang=" + lang : CFG.base + "/live/" + j.slug + "/" + s.slug + "?lang=" + lang; }

  function cover(s, j, extra){
    var p = pal(j.slug), cv = state.covers[s.id];
    var art = ((s.pieces && s.pieces[0] && CFG.art[s.pieces[0].art]) || CFG.art.ring);
    return '<div class="cover" style="--c1:' + p[0] + ';--c2:' + p[1] + '"><div class="ph"></div>' + (cv ? '<img class="cv" alt="" src="' + cv + '">' : '<div class="art">' + art + '</div>') + extra + '</div>';
  }
  function meta(j){
    return '<div class="meta"><span class="av">' + esc((j.name || "?").charAt(0).toUpperCase()) + '</span><span style="min-width:0"><b>' + esc(j.name) + '<span class="chk">✓</span></b><small>' + esc(j.city || "") + (j.city ? ' · ' : '') + esc(kindLabel(j)) + '</small></span></div>';
  }
  function renderStatic(){
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; $("langCur").textContent = lang.toUpperCase();
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(el){ el.textContent = t[el.getAttribute("data-t")]; });
    $("tag").textContent = t.tag; $("q").placeholder = t.search; $("aboutBtn").textContent = "i"; $("aboutBtn").title = t.about; $("aboutBtn").setAttribute("aria-label", t.about);
    $("trust").innerHTML = t.trust.map(function(x){ return '<span><i></i>' + esc(x) + '</span>'; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#langMenu button"), function(b){ b.classList.toggle("on", b.getAttribute("data-lang") === lang); });
    $("cta").innerHTML = '<div><b>' + esc(t.ctaTitle) + '</b><small>' + esc(t.ctaText) + '</small></div><a class="go" href="' + CFG.base + '/live/join?lang=' + lang + '">' + esc(t.ctaBtn) + '</a>';
    $("joinLink").href = CFG.base + "/live/join?lang=" + lang;
    $("foot").innerHTML = esc(t.foot) + '<br>' + esc(t.footJoin);
    $("emptyLive").innerHTML = '<b>' + esc(t.emptyLiveT) + '</b>' + esc(t.emptyLive);
    $("emptySoon").innerHTML = '<b>' + esc(t.emptySoonT) + '</b>' + esc(t.emptySoon);
  }
  function renderLive(){
    var g = $("gridLive"); g.innerHTML = "";
    var rows = state.shows.filter(function(s){ return s.status === "live" && state.jewelers[s.jeweler_id] && inCat(s); });
    rows.forEach(function(s){
      var j = state.jewelers[s.jeweler_id];
      var a = document.createElement("a"); a.className = "vcard"; a.href = showUrl(s, j);
      a.innerHTML = cover(s, j, '<span class="lbl"><i></i>' + esc(t.live) + '</span><div class="stat"><span>' + ICON.heart + '<span data-likes="' + s.id + '">' + fmtK(s.likes, LOC[lang]) + '</span></span><span>' + ICON.eye + '<span data-viewers="' + s.id + '">' + (state.viewers[s.id] || 0) + '</span></span></div><div class="ctitle" dir="auto">' + catLabel(s) + esc(title(s)) + '</div>') + meta(j);
      g.appendChild(a);
    });
    $("emptyLive").hidden = true; $("live").hidden = rows.length === 0; $("nLive").hidden = !rows.length; $("nLive").textContent = rows.length;
    $("emptyLive").innerHTML = state.cat ? '<b>' + esc(catName(state.cat)) + '</b>' + esc(t.noneCat) : '<b>' + esc(t.emptyLiveT) + '</b>' + esc(t.emptyLive);
  }
  function renderSoon(){
    var g = $("gridSoon"); g.innerHTML = "";
    var rows = state.shows.filter(function(s){ return s.status === "scheduled" && state.jewelers[s.jeweler_id] && inCat(s) && new Date(s.scheduled_at).getTime() > Date.now() + 7 * 86400000; }).sort(function(a,b){ return new Date(a.scheduled_at) - new Date(b.scheduled_at); });
    rows.forEach(function(s){
      var j = state.jewelers[s.jeweler_id];
      var d = document.createElement("div"); d.className = "vcard";
      d.innerHTML = '<a class="vcard" href="' + showUrl(s, j) + '">' + cover(s, j, '<span class="lbl off"><i></i>' + esc(t.soon) + '</span><div class="when"><small>' + esc(fday(s.scheduled_at)) + '</small><b>' + esc(ftime(s.scheduled_at)) + '</b></div><div class="ctitle" dir="auto">' + catLabel(s) + esc(title(s)) + '</div>') + meta(j) + '</a><a class="btn sm" style="align-self:flex-start;color:var(--gold-edge);border-color:var(--gold-hi);font-size:13px;min-height:34px" download="' + esc(j.slug) + '-live.ics" href="' + icsUrl(s, j) + '" data-remind>' + esc(t.remind) + '</a>';
      d.querySelector("[data-remind]").addEventListener("click", function(){ toast(t.remindToast + fday(s.scheduled_at) + " · " + ftime(s.scheduled_at)); });
      g.appendChild(d);
    });
    $("emptySoon").hidden = true; $("soon").hidden = rows.length === 0;
    $("emptySoon").innerHTML = state.cat ? '<b>' + esc(catName(state.cat)) + '</b>' + esc(t.noneCat) : '<b>' + esc(t.emptySoonT) + '</b>' + esc(t.emptySoon);
  }
  function icsUrl(s, j){
    function z(d){ return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
    var start = new Date(s.scheduled_at), end = new Date(start.getTime() + 60 * 60000);
    var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//live//IT","BEGIN:VEVENT","UID:" + s.id + "@live","DTSTAMP:" + z(new Date()),"DTSTART:" + z(start),"DTEND:" + z(end),"SUMMARY:" + title(s).replace(/,/g, "\\,") + " · " + j.name.replace(/,/g, "\\,"),"URL:" + showUrl(s, j),"DESCRIPTION:" + showUrl(s, j),"END:VEVENT","END:VCALENDAR"].join("\r\n");
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  }
  function renderShops(){
    var row = $("shopsRow"); row.innerHTML = "";
    var liveBy = {}; state.shows.forEach(function(s){ if (s.status === "live") liveBy[s.jeweler_id] = true; });
    Object.keys(state.jewelers).map(function(k){ return state.jewelers[k]; }).filter(function(j){ return !state.cat || (j.categories || []).indexOf(state.cat) >= 0 || state.shows.some(function(s){ return s.jeweler_id === j.id && inCat(s); }); }).sort(function(a,b){ return (liveBy[b.id] ? 1 : 0) - (liveBy[a.id] ? 1 : 0) || (followed(b) ? 1 : 0) - (followed(a) ? 1 : 0) || a.name.localeCompare(b.name); }).forEach(function(j){
      var a = document.createElement("a"); a.href = CFG.base + "/live/" + j.slug + "/profile?lang=" + lang; a.className = "seller" + (liveBy[j.id] ? " live" : "");
      a.innerHTML = '<span class="big">' + esc((j.name || "?").charAt(0).toUpperCase()) + '</span>' + (liveBy[j.id] ? '<span class="live-tag">' + esc(t.live) + '</span>' : '') + '<b>' + (followed(j) ? '★ ' : '') + esc(j.name) + '</b><small>' + esc(j.city || "") + '<br>' + esc(kindLabel(j)) + '</small>';
      row.appendChild(a);
    });
  }
  // ---- home: carosello (slide in evidenza + dirette della settimana) e agenda della settimana
  function fweek(iso){ try { return new Intl.DateTimeFormat(LOC[lang], { weekday:"long", day:"numeric", month:"long" }).format(new Date(iso)); } catch(e){ return iso; } }
  function catArt(slug){ for (var i = 0; i < state.cats.length; i++) if (state.cats[i].slug === slug) return CFG.art[state.cats[i].art] || CFG.art.ring; return CFG.art.ring; }
  function weekShows(){ var now = Date.now(), end = now + 7 * 86400000; return state.shows.filter(function(s){ var at = new Date(s.scheduled_at).getTime(); return state.jewelers[s.jeweler_id] && inCat(s) && (s.status === "live" || (s.status === "scheduled" && at >= now - 12 * 3600000 && at <= end)); }).sort(function(a,b){ return (b.status === "live") - (a.status === "live") || new Date(a.scheduled_at) - new Date(b.scheduled_at); }); }
  function i18n(obj){ obj = obj || {}; return obj[lang] || obj.en || obj.it || ""; }
  function linkOf(h){ var l = h.link || ""; if (l.indexOf("cat:") === 0) return CFG.base + "/live?c=" + encodeURIComponent(l.slice(4)) + "&lang=" + lang; if (l.indexOf("seller:") === 0) return CFG.base + "/live/" + l.slice(7) + "/profile?lang=" + lang; if (l.indexOf("show:") === 0){ var s = state.shows.filter(function(x){ return x.id === l.slice(5); })[0]; return s ? showUrl(s, state.jewelers[s.jeweler_id]) : CFG.base + "/live"; } return l || (CFG.base + "/live"); }
  function slides(){
    var out = [];
    state.highlights.forEach(function(h){
      var l = h.link || "", art = l.indexOf("cat:") === 0 ? catArt(l.slice(4)) : CFG.art.sparkle;
      out.push({ key: "h" + h.id, img: h.image || "", art: art, eyebrow: "", title: i18n(h.title_i18n), sub: i18n(h.subtitle_i18n), cta: t.discover, href: linkOf(h), live: false });
    });
    weekShows().forEach(function(s){
      var j = state.jewelers[s.jeweler_id], live = s.status === "live";
      var firstCat = (s.categories || [])[0];
      out.push({ key: "s" + s.id, img: state.covers[s.id] || state.photos[s.id] || "", art: s.pieces && s.pieces[0] ? (CFG.art[s.pieces[0].art] || CFG.art.ring) : catArt(firstCat), eyebrow: (firstCat ? catName(firstCat) + " · " : "") + j.name, title: title(s), sub: live ? t.heroLive : t.liveOn.replace("{day}", fweek(s.scheduled_at)).replace("{time}", ftime(s.scheduled_at)), cta: live ? t.enter : t.discover, href: showUrl(s, j), live: live });
    });
    return out.slice(0, 8);
  }
  function renderHero(){
    var track = $("track"), dots = $("dots"), list = slides(); track.innerHTML = ""; dots.innerHTML = "";
    $("hero").hidden = !list.length;
    list.forEach(function(sl, i){
      var p = pal(sl.key);
      var a = document.createElement("a"); a.className = "slide"; a.href = sl.href; a.style.cssText = "--c1:" + p[0] + ";--c2:" + p[1];
      a.innerHTML = (sl.img ? '<img class="cv" alt="" src="' + sl.img + '">' : '<div class="art">' + sl.art + '</div>') + (sl.live ? '<span class="lbl"><i></i>' + esc(t.live) + '</span>' : '') + (sl.eyebrow ? '<span class="eyebrow">' + esc(sl.eyebrow) + '</span>' : '') + '<h2 dir="auto">' + esc(sl.title) + '</h2>' + (sl.sub ? '<p dir="auto">' + esc(sl.sub) + '</p>' : '') + '<span class="go">' + esc(sl.cta) + '</span>';
      track.appendChild(a);
      var d = document.createElement("button"); d.type = "button"; d.className = i === 0 ? "on" : ""; d.setAttribute("aria-label", String(i + 1)); d.addEventListener("click", function(){ goSlide(i, true); }); dots.appendChild(d);
    });
    state.slide = 0; startAuto();
  }
  function goSlide(i, manual){
    var track = $("track"), n = track.children.length; if (!n) return;
    state.slide = (i + n) % n;
    track.scrollTo({ left: track.children[state.slide].offsetLeft, behavior: "smooth" });
    Array.prototype.forEach.call($("dots").children, function(d, k){ d.className = k === state.slide ? "on" : ""; });
    if (manual) startAuto();
  }
  function startAuto(){ if (state.timer) clearInterval(state.timer); state.timer = setInterval(function(){ if (document.hidden) return; goSlide(state.slide + 1); }, 6000); }
  $("prevSlide").addEventListener("click", function(){ goSlide(state.slide - 1, true); });
  $("nextSlide").addEventListener("click", function(){ goSlide(state.slide + 1, true); });
  $("track").addEventListener("scroll", function(){ var tr = $("track"), w = tr.clientWidth || 1, i = Math.round(tr.scrollLeft / w); if (i !== state.slide && i >= 0 && i < tr.children.length){ state.slide = i; Array.prototype.forEach.call($("dots").children, function(d, k){ d.className = k === i ? "on" : ""; }); } });
  $("track").addEventListener("touchstart", function(){ if (state.timer) clearInterval(state.timer); }, { passive: true });
  function renderWeek(){
    var box = $("weekBody"); box.innerHTML = "";
    var rows = weekShows();
    if (!rows.length){ box.innerHTML = '<div class="empty">' + esc(t.noWeek) + '</div>'; return; }
    var list = document.createElement("div"); list.className = "agenda";
    rows.forEach(function(s){
      var j = state.jewelers[s.jeweler_id], p = pal(j.slug), live = s.status === "live", img = state.covers[s.id] || state.photos[s.id] || "";
      var wd = "", dn = ""; try { wd = new Intl.DateTimeFormat(LOC[lang], { weekday:"short" }).format(new Date(s.scheduled_at)); dn = new Intl.DateTimeFormat(LOC[lang], { day:"numeric" }).format(new Date(s.scheduled_at)); } catch(e){}
      var bits = [(s.lang || "").toUpperCase()].concat((s.categories || []).slice(0, 2).map(catName)); if (s.price_range) bits.push(s.price_range);
      var a = document.createElement("a"); a.className = "ag" + (live ? " live" : ""); a.href = showUrl(s, j);
      a.innerHTML = '<div class="agd"><small>' + esc(live ? t.live : wd) + '</small><b>' + esc(dn) + '</b><span>' + esc(ftime(s.scheduled_at)) + '</span></div>' +
        '<div class="agi" style="--c1:' + p[0] + ';--c2:' + p[1] + '">' + (img ? '<img alt="" src="' + img + '">' : ((s.pieces && s.pieces[0] && CFG.art[s.pieces[0].art]) || CFG.art.ring)) + '</div>' +
        '<div class="agt"><small>' + esc(bits.filter(Boolean).join(" · ")) + '</small><b dir="auto">' + esc(title(s)) + '</b><span>' + esc(j.name) + (j.city ? ' · ' + esc(j.city) : '') + '</span></div>';
      list.appendChild(a);
    });
    box.appendChild(list);
  }
  function renderAll(){ t = TT[lang]; renderStatic(); renderCats(); renderHero(); renderWeek(); renderTiles(); renderLive(); renderSoon(); renderShops(); }

  // benvenuto (prima visita)
  function renderWelcome(){
    var w = $("welcome");
    w.innerHTML = '<div class="wcard"><div class="wm"><span class="logo">' + $("logoTpl").innerHTML + '</span><small>' + esc(t.tag) + '</small></div><h1>' + t.wTitle + '</h1><p class="lead">' + esc(t.wLead) + '</p><ul>' + t.wPoints.map(function(x){ return '<li><i></i>' + esc(x) + '</li>'; }).join("") + '</ul><div class="actions"><button class="go" type="button" id="wGo">' + esc(t.wGo) + '</button><a class="sellers" href="' + CFG.base + '/live/join?lang=' + lang + '">' + esc(t.wSellers) + '</a></div><p class="sig">' + esc(t.wSig) + '</p></div>';
    w.hidden = false; document.body.style.overflow = "hidden";
    $("wGo").addEventListener("click", closeWelcome);
  }
  function closeWelcome(){ $("welcome").hidden = true; document.body.style.overflow = ""; try { localStorage.setItem("vetrina-welcomed", "1"); } catch(e){} }
  $("aboutBtn").addEventListener("click", renderWelcome);

  $("langCur").addEventListener("click", function(e){ e.stopPropagation(); $("langMenu").hidden = !$("langMenu").hidden; });
  document.addEventListener("click", function(){ $("langMenu").hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll("#langMenu button"), function(b){
    b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); $("langMenu").hidden = true; try { localStorage.setItem("vetrina-lang", lang); } catch(e){} renderAll(); if (!$("welcome").hidden) renderWelcome(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(tb){
    tb.addEventListener("click", function(){ Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.classList.remove("on"); }); tb.classList.add("on"); var el = $(tb.getAttribute("data-to")); if (el && el.hidden) el = $("hero"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); });
  });
  $("q").addEventListener("input", function(){ var q = this.value.trim().toLowerCase(); Array.prototype.forEach.call(document.querySelectorAll(".grid > *"), function(c){ c.hidden = q && c.textContent.toLowerCase().indexOf(q) < 0; }); });

  // presenze (spettatori) per ogni diretta in corso
  function watchPresence(){
    state.shows.filter(function(s){ return s.status === "live"; }).forEach(function(s){
      if (state.channels[s.id]) return;
      var ch = sb.channel("show-" + s.id, { config: { presence: { key: "w" + Math.random().toString(36).slice(2, 10) } } });
      ch.on("presence", { event:"sync" }, function(){ var n = Object.keys(ch.presenceState()).length; state.viewers[s.id] = n; var el = document.querySelector('[data-viewers="' + s.id + '"]'); if (el) el.textContent = n; }).subscribe();
      state.channels[s.id] = ch;
    });
    Object.keys(state.channels).forEach(function(id){ var s = state.shows.filter(function(x){ return x.id === id; })[0]; if (!s || s.status !== "live"){ sb.removeChannel(state.channels[id]); state.channels[id] = null; } });
  }

  function loadShows(){
    var since = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
    return sb.from("shows").select("id,jeweler_id,slug,title,title_i18n,scheduled_at,status,lang,likes,current_piece_id,categories,price_range").eq("visibility", "public").in("status", ["live","scheduled"]).gte("scheduled_at", since).order("scheduled_at").then(function(r){
      state.shows = r.data || [];
      var ids = state.shows.map(function(s){ return s.id; });
      if (!ids.length) return;
      return Promise.all([
        sb.from("show_covers").select("show_id,data").in("show_id", ids),
        sb.from("pieces").select("id,show_id,art,position").in("show_id", ids).order("position"),
        sb.from("highlights").select("id,position,title_i18n,subtitle_i18n,link,image").order("position")
      ]).then(function(res){
        state.covers = {}; (res[0].data || []).forEach(function(c){ state.covers[c.show_id] = c.data; });
        var byShow = {}; (res[1].data || []).forEach(function(p){ (byShow[p.show_id] = byShow[p.show_id] || []).push(p); });
        state.shows.forEach(function(s){ s.pieces = byShow[s.id] || []; });
        state.highlights = res[2].data || [];
        var firstIds = state.shows.map(function(s){ return s.pieces[0] && s.pieces[0].id; }).filter(Boolean);
        if (firstIds.length) return sb.from("piece_photos").select("piece_id,data").in("piece_id", firstIds).then(function(ph){ state.photos = {}; (ph.data || []).forEach(function(x){ state.shows.forEach(function(s){ if (s.pieces[0] && s.pieces[0].id === x.piece_id) state.photos[s.id] = x.data; }); }); });
      });
    });
  }
  function refresh(){ return loadShows().then(function(){ renderCats(); renderHero(); renderWeek(); renderTiles(); renderLive(); renderSoon(); renderShops(); watchPresence(); }); }

  function boot(){
    Promise.all([
      sb.from("jewelers").select("id,slug,name,city,country,kind,tagline,categories").eq("is_public", true),
      sb.from("categories").select("slug,position,name_i18n,art").eq("active", true).order("position")
    ]).then(function(r){
      (r[0].data || []).forEach(function(j){ state.jewelers[j.id] = j; });
      state.cats = r[1].data || [];
      return refresh();
    }).then(function(){
      renderStatic();
      sb.channel("vetrina")
        .on("postgres_changes", { event:"*", schema:"public", table:"shows" }, function(){ clearTimeout(state.rt); state.rt = setTimeout(refresh, 400); })
        .on("postgres_changes", { event:"*", schema:"public", table:"highlights" }, function(){ clearTimeout(state.rt); state.rt = setTimeout(refresh, 400); })
        .on("postgres_changes", { event:"*", schema:"public", table:"show_covers" }, function(p){ if (p.new && p.new.data){ state.covers[p.new.show_id] = p.new.data; var img = document.querySelector('[data-cover="' + p.new.show_id + '"]'); renderLive(); renderSoon(); } })
        .subscribe();
      setInterval(refresh, 60000);
    });
    var welcomed = false; try { welcomed = localStorage.getItem("vetrina-welcomed") === "1"; } catch(e){}
    if (!welcomed) renderWelcome();
  }
  renderStatic(); boot();
})();
</script>
</body></html>
