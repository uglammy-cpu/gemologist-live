<!doctype html><html lang="{{LANG}}"><head>{{HEAD}}<title>Diretta</title><style>{{CSS}}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&display=swap"><style id="restyle">
/* =====================================================================
   UNIQAIA — pagina della diretta, interfacce del visitatore (ANTEPRIMA, non in produzione)
   Brief di Elena del 7/11/2026: «Entra in diretta» chiara ed elegante, player scuro e immersivo.
   Solo trattamento visivo: stessi elementi, stesse posizioni, stessi testi, stesse funzioni.
   Stessi colori e caratteri della home V2 (nessun design system nuovo).
   ===================================================================== */

/* ---------- 1. Token (gli stessi della home) ---------- */
body.dark{
  --paper:#F8F2EB; --cream:#FFFCF8; --ink:#1D1A1F; --anth:#2E2A31; --muted:#5B5560;
  --edge:#D8CDBD; --line:#E8DFD3;
  --red:#E11D2E; --red-text:#D31A2B; --livered:#E11D2E;
  --gold:#C9A45C; --gold-hi:#E6CF97;
  --ivory:#F8F2EB;                         /* testo e icone sul fondo scuro */
  --ivory-2:rgba(248,242,235,.78);         /* testo secondario sul fondo scuro */
  --glass:rgba(29,26,31,.58);              /* superfici sopra il video */
  --hair:rgba(248,242,235,.16);            /* bordi e separatori sul fondo scuro */
  --sans:"Manrope",system-ui,sans-serif;
  background:var(--ink);color:var(--ivory);
}

/* ---------- 2. Player: antracite, il video protagonista ---------- */
.phone{background:var(--ink)}
@media (min-width:760px){.phone{box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 6px var(--anth)}}
.vid{background:linear-gradient(180deg,var(--anth),var(--ink))}
.vid::before{display:none}                                   /* via l'alone dorato decorativo */
.vid .poster{filter:none}                                    /* copertina vera, non sfocata */
.videos .main{background:var(--ink)}
/* ombre solo dove servono: in alto per l'intestazione, in basso per chat e comandi */
.shade{background:linear-gradient(to top,rgba(20,18,22,.74) 0%,rgba(20,18,22,.3) 24%,transparent 42%),linear-gradient(to bottom,rgba(20,18,22,.46),transparent 16%)}
.videos.on ~ .shade{background:linear-gradient(to top,rgba(20,18,22,.66) 0%,rgba(20,18,22,.22) 22%,transparent 38%),linear-gradient(to bottom,rgba(20,18,22,.42),transparent 15%)}

/* ---------- 3. Intestazione della diretta ---------- */
.ptop .pill{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--hair);color:var(--ivory);padding:5px 13px 5px 5px}
.ptop .pill b{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:-.01em}
.ptop .pill .who span{font-size:12px;color:var(--ivory-2)}
.av{background:var(--cream);color:var(--ink);border:1px solid var(--edge);font-family:var(--sans);font-weight:700}
.ptop .eye,.ptop .x{background:var(--glass);border:1px solid var(--hair);color:var(--ivory)}
.ptop .x{font-weight:300}
/* LIVE rosso solo quando è davvero in onda; pulsa solo il punto. In programma e Terminata restano neutre */
.lbl{font-family:var(--body);font-weight:600;letter-spacing:.08em;border-radius:6px;padding:5px 8px}
.lbl:not(.off){background:var(--livered);animation:none}
.lbl i{animation:pulsew 1.6s ease-out infinite}
.lbl.off{background:var(--glass);border:1px solid var(--hair);color:var(--ivory)}
.lbl.off i{animation:none;background:var(--ivory);opacity:.7}
@media (prefers-reduced-motion:reduce){.lbl i{animation:none}}
.pchip{background:var(--glass);border:1px solid var(--hair);color:var(--ivory)}
.pchip i{background:var(--gold)}

/* ---------- 4. Attesa, fine diretta, pagina non trovata ---------- */
/* la copertina resta leggibile: un velo solo dietro al testo, non su tutta l'immagine */
.waitv{background:linear-gradient(to bottom,rgba(20,18,22,.08) 0%,rgba(20,18,22,.5) 38%,rgba(20,18,22,.5) 62%,rgba(20,18,22,.12) 100%);color:var(--ivory);padding-inline-end:90px;padding-inline-start:20px}
.waitv b{font-family:var(--sans);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.waitv span{font-size:15.5px;line-height:1.5;color:var(--ivory);text-shadow:0 1px 12px rgba(0,0,0,.4)}

/* ---------- 5. Barra degli strumenti: icone lineari avorio, stesso peso per tutte ---------- */
.rail{gap:13px}
/* etichette su due righe se lunghe, così non invadono la chat */
.rail button{color:var(--ivory);font-family:var(--body);font-size:11.5px;font-weight:500;letter-spacing:.01em;line-height:1.2;text-align:center;max-width:66px;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.rail .ic{width:46px;height:46px;background:var(--glass);border:1px solid var(--hair);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ivory);transition:background .2s,color .2s,border-color .2s}
.rail .ic svg{width:21px;height:21px}
/* il cuore come le altre icone: a filo, pieno solo quando si è toccato */
.rail .ic.heart svg path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.rail .ic.heart.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.rail .ic.heart.on svg path{fill:currentColor;stroke:none}
/* «Mi interessa» e «Acquista»: superficie scura, icona avorio, un filo d'oro che le distingue come azioni commerciali */
.rail .ic.goldbg{background:var(--glass);color:var(--ivory);border:1.5px solid var(--gold);box-shadow:none}
/* stato attivo (sottotitoli accesi) distinto e leggibile */
.rail button.on .ic{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.rail button:focus-visible{outline:none}
.rail button:focus-visible .ic{outline:2px solid var(--ivory);outline-offset:3px}
.rail button:disabled{opacity:.45}
/* i cuoricini che volano restano rossi (decisione di Elena, 7/11) */

/* ---------- 6. Chat e campo per scrivere ---------- */
.pm{background:var(--glass);border:1px solid var(--hair);color:var(--ivory);font-family:var(--body);font-size:13.5px;line-height:1.35}
.pm b{color:var(--gold-hi);font-weight:600}
.pm.shop b{color:var(--ivory)}
.pm.gemologist{border-color:rgba(201,164,92,.6)}
.pm.gemologist b{color:var(--gold-hi)}
.pm.me{background:rgba(248,242,235,.94);color:var(--ink);border-color:transparent}
.pm.me b{color:var(--muted)}
.pin input{background:var(--glass);border:1px solid rgba(248,242,235,.3);color:var(--ivory);font-family:var(--body)}
.pin input::placeholder{color:var(--ivory-2)}
.pin input:focus{border-color:var(--ivory)}
.pin button{background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:600}
.pin button:disabled,.pin input:disabled{opacity:.55}
.audio-btn{background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:600}

/* ---------- 7. Sottotitoli: fascia sotto l'immagine ---------- */
.subsbar{background:var(--ink);border-top-color:var(--hair)}
.subsbar .st{color:var(--ivory)}
.subsbar .sl{background:var(--ink);border-color:var(--hair);color:var(--ivory-2)}

/* ---------- 8. «Ci sei ancora?» e diretta in pausa ---------- */
.idlev{background:rgba(20,18,22,.8);color:var(--ivory)}
.idlev b{font-family:var(--sans);font-weight:800;font-size:25px;letter-spacing:-.02em}
.idlev p{color:var(--ivory-2)}
.idlev button{background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:600}

/* ---------- 9. Pannelli (Come funziona, Prenota, Mi interessa, Sottotitoli, Pagamento): scuri come il player ---------- */
.modal{background:rgba(12,11,14,.62)}
.mcard{background:var(--ink);color:var(--ivory);border:1px solid var(--hair);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.45);font-family:var(--body)}
.mcard h3{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;color:var(--ivory)}
.mcard .eyebrow{color:var(--gold-hi);font-weight:600;letter-spacing:.14em}
.mcard .muted{color:var(--ivory-2)}
.mcard p{color:var(--ivory)}
.mcard .x{color:var(--ivory-2)}
.mcard input,.mcard select,.mcard textarea{background:rgba(248,242,235,.06);border:1px solid rgba(248,242,235,.24);color:var(--ivory);border-radius:12px}
.mcard input::placeholder{color:rgba(248,242,235,.6)}
.mcard input:focus{outline:none;border-color:var(--ivory)}
.mcard .btn.dark{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:600}
.mcard .btn.dark:hover{background:#FFFFFF}
.mcard .btn.sm,.mcard .btn:not(.dark){color:var(--ivory);border-color:rgba(248,242,235,.4)}
.mcard .btn:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.mcard .slot{background:rgba(248,242,235,.05);border:1px solid rgba(248,242,235,.2);color:var(--ivory)}
.mcard .slot:hover{border-color:var(--gold);background:rgba(201,164,92,.12)}
.mcard .sublist button{border-color:rgba(248,242,235,.2);color:var(--ivory)}
.mcard .sublist button.on{border-color:var(--gold);background:rgba(201,164,92,.14)}
.mcard .ok{color:var(--gold-hi)}
.toast{background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast i{background:var(--gold)}
.credit{color:rgba(248,242,235,.55)}

/* =====================================================================
   «Entra in diretta»: chiara, luminosa, elegante
   ===================================================================== */
.gate{background:var(--paper);color:var(--ink);justify-content:flex-start;align-items:center;gap:12px;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));
  --logo-gold:#A47F3A;--logo-gem:#D43F52}
.gate > *{width:100%;max-width:360px}
.gate .glogo{height:34px;flex:none;color:var(--ink);margin:auto 0 14px;display:flex;justify-content:center}
.gate .fine{margin-bottom:auto}
.gate .glogo svg{height:100%;width:auto;display:block;overflow:visible}
.gate b{font-family:var(--sans);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.12;color:var(--ink);text-align:center}
.gate p{color:var(--anth);font-size:15px;line-height:1.5;text-align:center}
.gate input[type=email],.gate input[type=text]{background:#FFFFFF;border:1px solid var(--edge);color:var(--ink);border-radius:12px;padding:13px 14px;min-height:50px;font-family:var(--body);font-size:16px;transition:border-color .15s,box-shadow .15s}
.gate input::placeholder{color:#6E6872}
.gate input[type=email]:focus,.gate input[type=text]:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,26,31,.1)}
/* errore: bordo rosso solo dopo che si è scritto qualcosa di non valido */
.gate input[type=email]:user-invalid,.gate input[type=text]:user-invalid{border-color:var(--red-text);box-shadow:0 0 0 3px rgba(211,26,43,.12)}
/* casella accanto al suo testo (una regola generale delle etichette la metteva sopra) */
.gate .cons{flex-direction:row;color:var(--anth);font-size:14px;line-height:1.5;gap:12px;padding:4px 0;min-height:44px;align-items:flex-start}
.gate .cons input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--ink);cursor:pointer}
.gate .fine{color:var(--muted);font-size:12.5px;line-height:1.55;text-align:center}
.gate button{background:var(--ink);color:var(--cream);font-family:var(--body);font-weight:600;font-size:16px;min-height:52px;border-radius:999px;transition:background .2s}
.gate button:hover{background:var(--anth)}
.gate button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.gate button:disabled{opacity:.6;cursor:progress}
.gate[dir="rtl"] .cons{text-align:right}
/* al computer, mentre si entra, anche il fondo intorno diventa chiaro */
body.dark:has(#gate.on),.phone:has(#gate.on){background:var(--paper)}
@media (min-width:760px){.phone:has(#gate.on){box-shadow:0 24px 60px rgba(60,30,20,.14),0 0 0 1px var(--line)}}
body.dark:has(#gate.on) .credit{color:var(--muted)}
body.dark:has(#gate.on) .toast{background:var(--ink);color:var(--paper)}
</style></head>
<body class="dark">
<div class="stagev">

    <div class="vid" id="vid"><img class="poster" id="poster" alt="" hidden><div class="artwrap" id="art"></div><div class="videos" id="videos"></div><div class="shade"></div></div>
    <div class="ptop">
      <a class="pill" id="pill" href="{{BASE}}/live"><span class="av" id="av"></span><span class="who"><b id="jname">…</b><span id="jsub" dir="auto"></span></span></a>
      <span class="lbl off" id="lbl"><i></i><span id="lblTxt"></span></span>
      <span class="eye" id="eye" hidden><span id="eyeIc"></span><span id="viewers">0</span></span>

    <form class="gate" id="gate"><div class="glogo"><svg class="ulogo" xmlns="http://www.w3.org/2000/svg" viewBox="88 32 830 190" role="img" aria-label="Uniqaia"><g font-family="'Cormorant Garamond',Garamond,'Times New Roman',serif" font-weight="500" font-size="150" fill="currentColor" text-anchor="middle"><text x="151" y="160">U</text><text x="283" y="160">N</text><text x="386" y="160">I</text><text x="659" y="160">A</text><text x="756" y="160">I</text><text x="853" y="160">A</text></g><path fill="var(--logo-gold,#A47F3A)" fill-rule="evenodd" d="M 435 112.5 A 75 75 0 1 0 585 112.5 A 75 75 0 1 0 435 112.5 Z M 453 112.5 A 57 67 0 1 0 567 112.5 A 57 67 0 1 0 453 112.5 Z"/><path fill="var(--logo-gold,#A47F3A)" d="M 521.7 186.6 C 545 196 575 203 610 202 C 575 214 540 212 512 196 Z"/><path d="M 470.1 90.5 A 44 52 0 0 1 495 63.6" fill="none" stroke="var(--logo-gold,#A47F3A)" stroke-width="5" stroke-linecap="round"/><circle cx="510" cy="112.5" r="14" fill="var(--logo-gem,#D43F52)"/></svg></div><b id="gateT"></b><p id="gateL"></p><input id="gateName" type="text" maxlength="60" autocomplete="name"><input id="gateMail" type="email" maxlength="254" autocomplete="email" inputmode="email" required><label class="cons"><input id="gateCons" type="checkbox"><span id="gateConsT"></span></label><button type="submit" id="gateGo"></button><p class="fine" id="gateP"></p></form>
    <button class="audio-btn" type="button" id="audioBtn" hidden></button>
    <div class="idlev" id="idle" hidden aria-live="polite"><div><b id="idleT"></b><p id="idleS" dir="auto"></p><button type="button" id="idleGo"></button></div></div>
    <div class="pchat" id="msgs" aria-live="polite"></div>
    <div class="hearts" id="hearts"></div>
    <div class="rail">
      <button type="button" id="heart"><span class="ic heart" id="heartIc"></span><span id="likes">0</span></button>
      <button type="button" id="interest" disabled><span class="ic goldbg" id="gemIc"></span><span id="interestTxt"></span></button>
      <button type="button" id="book" disabled><span class="ic" id="calIc"></span><span id="bookTxt"></span></button>
      <button type="button" id="share"><span class="ic" id="shareIc"></span><span id="shareTxt"></span></button>
      <button type="button" id="cc"><span class="ic" id="ccIc"></span><span id="ccTxt"></span></button>
      <button type="button" id="buy" hidden><span class="ic goldbg" id="bagIc"></span><span id="buyTxt"></span></button>
      <button type="button" id="how"><span class="ic" id="helpIc"></span><span id="howTxt"></span></button>
    </div>
    <form class="pin" id="form"><input id="msg" type="text" maxlength="500" autocomplete="off"><button type="submit" id="send"></button></form>
    <div class="subsbar" id="subsbar"><span class="sl" id="subLang"></span><p class="st" id="subTxt" data-wait=""></p></div>
    <div class="waitv" id="notfound" hidden><div><b>404</b><span id="nfTxt">Pagina non trovata.</span></div></div>
  </div>
</div>
<p class="credit" id="credit"></p>
<div class="modal" id="modal" hidden></div>
<script>
{{LKJS}}
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","slug":"{{SLUG}}","token":"{{TOKEN}}","lang":"{{LANG}}","tokenUrl":"{{TOKENURL}}","base":"{{BASE}}","showId":"{{SHOWID}}","art":{{ART}}};
  var TT = {{T}};
  var sb = window.supabase.createClient(CFG.url, CFG.key);
  var $ = function(id){ return document.getElementById(id); };
  var LOC = { it:"it-IT", en:"en-GB", fr:"fr-FR", ar:"ar-AE-u-nu-latn", ru:"ru-RU" };
  var state = { jeweler:null, show:null, pieces:[], photos:{}, invite:null, name:"", contact:"", lang:"it", t:TT.it, likes:0, channel:null, lastTap:0, queued:0 };
  try { state.name = localStorage.getItem("live-name") || ""; state.contact = localStorage.getItem("live-contact") || ""; } catch(e){}
  $("heartIc").innerHTML = ICON.heart; $("gemIc").innerHTML = ICON.gem; $("calIc").innerHTML = ICON.cal; $("shareIc").innerHTML = ICON.share; $("eyeIc").innerHTML = ICON.eye; $("bagIc").innerHTML = ICON.bag; $("helpIc").innerHTML = ICON.help; if (ICON.cc) $("ccIc").innerHTML = ICON.cc;

  function fmtDate(iso){ try { return new Intl.DateTimeFormat(LOC[state.lang] || "it-IT", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(iso)); } catch(e){ return iso; } }
  function currentPiece(){ var id = state.show && state.show.current_piece_id; for (var i = 0; i < state.pieces.length; i++) if (state.pieces[i].id === id) return state.pieces[i]; return state.pieces[0] || null; }
  function tr(obj, fb){ var i = obj || {}; return i[state.lang] || (state.lang !== "it" && i.en) || fb || ""; }
  function showTitle(){ var s = state.show, i = s.title_i18n || {}; return i[state.lang] || (state.lang !== "it" && i.en) || s.title; }

  function render(){
    var s = state.show, t = state.t, j = state.jeweler;
    $("av").textContent = (j.name || "?").charAt(0).toUpperCase();
    $("jname").textContent = j.name; $("jsub").textContent = (j.city ? j.city + " · " : "") + showTitle();
    var live = s.status === "live";
    $("lbl").className = "lbl" + (live ? "" : " off"); $("lblTxt").textContent = live ? t.live : (s.status === "ended" ? t.ended : t.soon);
    $("eye").hidden = !live;
    var p = currentPiece();
    $("art").innerHTML = (p && state.photos[p.id]) ? '<img src="' + state.photos[p.id] + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">' : (p ? (CFG.art[p.art] || CFG.art.none) : CFG.art.none);
    var cap = p ? tr(p.caption_i18n, p.caption) : ""; $("pchip").hidden = !cap; $("pchipTxt").textContent = cap;
    var w = $("wait");
    if (s.status === "scheduled"){ w.hidden = false; $("waitT").textContent = t.waitSoon; $("waitS").textContent = fmtDate(s.scheduled_at); }
    else if (s.status === "ended"){ w.hidden = false; $("waitT").textContent = t.waitEnded; $("waitS").textContent = t.waitEndedSub; }
    else { w.hidden = true; }
    $("likes").textContent = fmtK(s.likes, LOC[state.lang]); state.likes = s.likes || 0;
    $("interestTxt").textContent = t.interest; $("bookTxt").textContent = t.book; $("shareTxt").textContent = t.invite; $("buyTxt").textContent = t.buy; $("howTxt").textContent = t.how; $("send").textContent = t.send; $("msg").placeholder = t.ask; $("audioBtn").textContent = t.audio;
    $("ccTxt").textContent = t.cc; $("subTxt").setAttribute("data-wait", t.subsWait); applySubs();
    aggiornaBuy(); apriPorta(); aggiornaPresenza(); $("pill").href = CFG.base + "/live/" + CFG.slug + "/profile?lang=" + state.lang;
    $("interest").disabled = false; $("book").disabled = false; $("heart").disabled = !live; $("send").disabled = s.status === "ended"; $("msg").disabled = s.status === "ended";
    $("back").title = t.backTo; $("pill").title = t.profile;
    $("credit").textContent = t.foot;
    document.title = j.name + " · " + showTitle();
    if (live) connectVideo(); else disconnectVideo();
  }

  // ---- video (solo ricezione) ----
  var video = { room:null, tiles:null, connecting:false, tries:0, retry:null };
  // Se la trasmissione cade e riparte, la stanza è nuova: senza riaggancio
  // automatico lo spettatore resta sullo schermo nero e se ne va credendo
  // che la diretta sia finita.
  function riprova(ms){
    if (video.retry || video.room) return;
    video.retry = setTimeout(function(){
      video.retry = null;
      if (state.show && state.show.status === "live") connectVideo();
    }, ms || 2000);
  }
  function connectVideo(){
    var LK = window.LivekitClient;
    // Il video parte solo dopo la porta: chi si ferma alla richiesta dell'email non riceve niente.
    if (video.room || video.connecting || pres.paused || !(porta && porta.dentro)) return;
    if (!LK){ video.tries++; if (video.tries < 20 && state.show && state.show.status === "live") setTimeout(connectVideo, 1500); return; }
    video.connecting = true;
    if (!video.tiles) video.tiles = new LkTiles($("videos"), { onChange: function(n){ $("videos").className = "videos" + (n ? " on" : ""); $("art").hidden = n > 0; $("poster").hidden = n > 0 || !$("poster").getAttribute("src"); } });
    var qs = "?show=" + encodeURIComponent(state.show.id) + (CFG.token ? "&t=" + encodeURIComponent(CFG.token) : "") + "&name=" + encodeURIComponent(guestName() || state.t.guest);
    fetch(CFG.tokenUrl + qs, { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.token) throw new Error(j && j.error || "token");
      var room = new LK.Room({ adaptiveStream:true, dynacast:true });
      lkAttachRemote(room, video.tiles, LK);
      attachSubs(room);
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function(){ $("audioBtn").hidden = room.canPlaybackAudio; });
      room.on(LK.RoomEvent.Disconnected, function(){
        video.room = null; $("audioBtn").hidden = true;

  // ---- presenza: niente spettatori fantasma ----
  // Chi non sta guardando esce dalla stanza video e dal conteggio degli spettatori:
  // altrimenti paga minuti di collegamento, occupa un posto nella stanza e gonfia i numeri.
  // Vale sul sito e nell'app installata, che apre questa stessa pagina.
  //  - schermo nascosto (telefonata, altra app, telefono bloccato, altra scheda) da 5 minuti:
  //    si esce; quando lo schermo torna visibile si rientra da soli.
  //  - schermo acceso ma nessun tocco, clic o tasto da 15 minuti: «Sei ancora qui?» per 60 secondi,
  //    poi pausa; basta un tocco per rientrare.
  // Con lo schermo nascosto il video si ferma gia' da solo (adaptiveStream), ma il collegamento resta.
  // I tempi si misurano con l'orologio e non con i timer, che il telefono rallenta in secondo piano.
  var PRES = { hiddenMs: 5 * 60000, idleMs: 15 * 60000, askMs: 60000 };
  var pres = { paused:"", hiddenAt: document.hidden ? Date.now() : 0, lastAct: Date.now(), askUntil: 0, tracked: false };

  function presenzaGiusta(){ return !pres.paused && (!isLive() || !!(porta && porta.dentro)); }
  function aggiornaPresenza(){
    var ch = state.channel, vuole = presenzaGiusta();
    if (!ch || vuole === pres.tracked) return;
    pres.tracked = vuole;
    try { var p = vuole ? ch.track({ at: Date.now() }) : ch.untrack(); if (p && p.catch) p.catch(function(){}); } catch(e){}
  }
  function presShow(kind){
    var el = $("idle"), t = state.t;

    var ask = kind === "ask";

    $("idleT").textContent = ask ? t.idleT : t.pausedT;
    $("idleS").textContent = ask ? t.idleS.replace("{n}", Math.max(0, Math.ceil((pres.askUntil - Date.now()) / 1000))) : t.pausedS;
    $("idleGo").textContent = ask ? t.idleGo : t.pausedGo;

  }
  function presPause(why){

  }
  function presResume(){
    if (!pres.paused) return;
    pres.paused = ""; pres.askUntil = 0; pres.lastAct = Date.now();

  }
  // Ogni gesto vero conta come «ci sono». Lo scorrimento no: la chat scorre da sola quando arrivano i messaggi.
  function presAct(){
    pres.lastAct = Date.now();

      pres.lastAct = now;

      if (pres.paused) presResume();

    }
    if (pres.paused) return;
    if (pres.askUntil){
      if (now >= pres.askUntil) presPause("idle"); else presShow("ask");

      (l.piece_name ? '<p class="muted" style="font-size:14px;margin:0 0 10px">' + esc(l.piece_name) + '</p>' : '') +
      '<p style="font-size:14px;line-height:1.5;margin:0 0 4px"><b>' + esc(t.payBy) + '</b> ' + esc(l.seller_name || "") + (l.seller_city ? ' · ' + esc(l.seller_city) : '') + (l.seller_country ? ' (' + esc(l.seller_country) + ')' : '') + '</p>' +
      '<p style="font-size:14px;line-height:1.5;margin:0 0 10px"><b>' + esc(t.payOn) + '</b> ' + esc(l.host) + '</p>' +
      (l.note ? '<p style="font-size:14px;line-height:1.5">' + esc(l.note) + '</p>' : '') +
      '<a class="btn dark" id="payGo" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.payOpen) + '</a>' +
      '<p class="muted" style="font-size:12.5px;line-height:1.5;margin-top:10px">' + esc(t.payOutside) + '</p>');
    var g = $("payGo");
    if (g) g.addEventListener("click", function(){ sb.rpc("mark_payment_link_seen", { p_claim: l.claim, p_id: l.id }); });
  }
  function loadPay(){
    var cs = claims(); if (!cs.length) return;
    sb.rpc("my_payment_links", { p_claims: cs }).then(function(r){
      if (r.error || !r.data || !r.data.length) return;
      var l = r.data[r.data.length - 1];
      var nuovo = !pay.last || pay.last.id !== l.id;
      pay.last = l; aggiornaBuy();
      if (!nuovo) return;
      var k = "uniqaia-pay-" + l.id, visto = false;
      try { visto = !!localStorage.getItem(k); localStorage.setItem(k, "1"); } catch(e){}
      if (!visto){ toast(state.t.payArrived); apriPagamento(l); }
    });
  }
  $("buy").addEventListener("click", function(){
    if (pay.last){ apriPagamento(pay.last); return; }
    var p = currentPiece();
    if (p && p.buy_url){ loPrendo(p, p.buy_url); return; }
    if (p && p.price_cents){ loPrendo(p, null); return; }
    var u = state.jeweler && state.jeweler.shop_url;
    if (u) window.open(/^https?:/i.test(u) ? u : "https://" + u, "_blank", "noopener");
  });
  pay.timer = setInterval(loadPay, 7000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) loadPay(); });
  loadPay();
  $("how").addEventListener("click", function(){
    var j = state.jeweler, t = state.t;
    openModal('<p class="eyebrow">' + esc(t.howTitle) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howInterest) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howBook) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howBuy) + '</p>' + (j && j.shop_url ? '<a class="btn dark" href="' + esc(/^https?:/i.test(j.shop_url) ? j.shop_url : "https://" + j.shop_url) + '" target="_blank" rel="noopener">' + esc(t.shopLink) + '</a>' : '') + '<a class="btn sm" href="' + CFG.base + '/live/' + CFG.slug + '/profile?lang=' + state.lang + '">' + esc(t.profile) + ' · ' + esc(j ? j.name : "") + '</a>');
  });
  $("book").addEventListener("click", function(){
    if (!state.show) return; // la diretta non è ancora caricata
    requireContact(function(n, c){
      var slots = Array.isArray(state.show.slots) ? state.show.slots : [];
      var html = '<p class="eyebrow">' + esc(state.t.book) + '</p><h3>' + esc(state.t.when) + '</h3><p class="muted" style="font-size:14px">' + esc(state.t.book2 + state.jeweler.name) + '</p><div class="slots">';
      for (var i = 0; i < slots.length; i++) html += '<button class="slot" type="button" data-slot="' + esc(slots[i]) + '">' + esc(slots[i]) + '</button>';
      if (!slots.length) html += '<input id="slotFree" type="text" placeholder="…"><button class="btn dark" type="button" id="slotSend">OK</button>';
      html += '</div>';
      openModal(html);
      function choose(slot){
        var p = currentPiece();
        sb.rpc("create_request3", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: n, p_contact: c, p_type: "appointment", p_piece: p ? p.id : null, p_slot: slot }).then(function(r){
          if (r.error){ toast(r.error.message); return; }
          addClaim(r.data);
          openModal('<p class="ok">✓ ' + esc(state.t.confirmed) + '</p><h3>' + esc(slot) + '</h3><p class="muted" style="font-size:14px">' + esc(state.jeweler.name) + '</p><button class="btn dark" type="button" id="mClose">' + esc(state.t.back) + '</button>');
          $("mClose").addEventListener("click", closeModal);
          if (state.show.status !== "ended") sendClient(state.t.booked + slot);
        });
      }
      Array.prototype.forEach.call(modal.querySelectorAll(".slot"), function(b){ b.addEventListener("click", function(){ choose(b.getAttribute("data-slot")); }); });
      var fs = $("slotSend"); if (fs) fs.addEventListener("click", function(){ var v = ($("slotFree").value || "").trim(); if (v) choose(v); });
    });
  });
  $("share").addEventListener("click", function(){
    var link = (state.show && state.show.slug) ? CFG.base + "/live/" + CFG.slug + "/" + state.show.slug : CFG.base + "/live/" + CFG.slug;
    var done = function(){ toast(state.t.copied); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function(){ openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">'); });
    else openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">');
  });

  // ---- cuori ----
  $("heart").addEventListener("click", function(){
    if (!state.show || state.show.status !== "live") return;
    state.lastTap = Date.now(); state.queued++; state.likes++; $("likes").textContent = fmtK(state.likes, LOC[state.lang]);
    $("heartIc").classList.add("on"); burstHearts($("hearts"), 1);
  });
  setInterval(function(){
    if (!state.queued || !state.show) return;
    var n = state.queued; state.queued = 0;
    sb.rpc("like_show", { p_show: state.show.id, p_n: n }).then(function(r){ if (!r.error && typeof r.data === "number" && r.data > state.likes){ state.likes = r.data; $("likes").textContent = fmtK(state.likes, LOC[state.lang]); } });
  }, 1200);

  // ---- realtime: chat, stato, cuori, presenze ----
  function subscribe(){
    var ch = sb.channel("show-" + state.show.id, { config: { presence: { key: "v" + Math.random().toString(36).slice(2, 10) } } });
    ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"show_id=eq." + state.show.id }, function(p){ addMsg(p.new); })
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"shows", filter:"id=eq." + state.show.id }, function(p){
        var prev = state.show; state.show = p.new;
        if (p.new.likes > state.likes && Date.now() - state.lastTap > 1500) burstHearts($("hearts"), Math.min(p.new.likes - state.likes, 5));
        if (p.new.status !== prev.status || p.new.current_piece_id !== prev.current_piece_id || p.new.title !== prev.title) render();
        else { state.likes = Math.max(state.likes, p.new.likes || 0); $("likes").textContent = fmtK(state.likes, LOC[state.lang]); }
      })
      .on("postgres_changes", { event:"*", schema:"public", table:"pieces", filter:"show_id=eq." + state.show.id }, function(){ sb.from("pieces").select("*").eq("show_id", state.show.id).order("position").then(function(r){ state.pieces = r.data || []; render(); }); })
      .on("postgres_changes", { event:"*", schema:"public", table:"show_covers", filter:"show_id=eq." + state.show.id }, function(p){ if (p.new && p.new.data) setPoster(p.new.data); })
      .on("presence", { event:"sync" }, function(){ var n = Object.keys(ch.presenceState()).length; $("viewers").textContent = n; })
      // A ogni (ri)collegamento la presenza va rimandata, ma solo se deve esserci.
      .subscribe(function(status){ if (status === "SUBSCRIBED"){ pres.tracked = false; aggiornaPresenza(); } });
    state.channel = ch;
  }
  function setPoster(data){ var img = $("poster"); img.setAttribute("src", data); img.hidden = !!(video.tiles && video.tiles.count()); $("art").hidden = !img.hidden || $("art").hidden; }

  function boot(){
    sb.from("jewelers").select("*").eq("slug", CFG.slug).maybeSingle().then(function(r){
      if (!r.data){ $("notfound").hidden = false; return; }
      state.jeweler = r.data;
      var inv = CFG.token ? sb.rpc("join_show", { p_token: CFG.token }).then(function(x){ return (x.data && x.data[0]) || null; }) : Promise.resolve(null);
      inv.then(function(invite){
        state.invite = invite;
        if (CFG.showId) return sb.from("shows").select("*").eq("id", CFG.showId).eq("jeweler_id", state.jeweler.id).limit(1);
        if (invite) return sb.from("shows").select("*").eq("id", invite.show_id).limit(1);
        return sb.from("shows").select("*").eq("jeweler_id", state.jeweler.id).order("scheduled_at", { ascending:false }).limit(8);
      }).then(function(r){
        var rows = r.data || []; if (!rows.length){ $("notfound").hidden = false; return; }
        var live = rows.filter(function(s){ return s.status === "live"; })[0];
        var sched = rows.filter(function(s){ return s.status === "scheduled"; }).sort(function(a,b){ return new Date(a.scheduled_at) - new Date(b.scheduled_at); })[0];
        state.show = live || sched || rows[0];
        // lingua: ?lang, poi la scelta fatta in vetrina, poi il browser, poi la lingua della diretta
        var q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(), st = "";
        try { st = localStorage.getItem("vetrina-lang") || ""; } catch(e){}
        var nav = (navigator.language || "").slice(0, 2).toLowerCase();
        state.lang = TT[q] ? q : (TT[st] ? st : (TT[nav] ? nav : (TT[state.show.lang] ? state.show.lang : "it"))); state.t = TT[state.lang];
        if (TT[q]) { try { localStorage.setItem("vetrina-lang", q); } catch(e){} }
        document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        return Promise.all([
          sb.from("pieces").select("*").eq("show_id", state.show.id).order("position"),
          sb.from("messages").select("*").eq("show_id", state.show.id).order("created_at").limit(200),
          sb.from("show_covers").select("data").eq("show_id", state.show.id).maybeSingle()
        ]);
      }).then(function(res){
        if (!res) return;
        state.pieces = res[0].data || [];
        var pids = state.pieces.map(function(p){ return p.id; });
        if (pids.length) sb.from("piece_photos").select("piece_id,data").in("piece_id", pids).then(function(ph){ (ph.data || []).forEach(function(x){ state.photos[x.piece_id] = x.data; }); render(); });
        render();
        if (res[2].data && res[2].data.data) setPoster(res[2].data.data);
        (res[1].data || []).slice(-8).forEach(addMsg);
        subscribe();
      });
    });
  }
  boot();
  applySubs();
  try { if (/[?&]subs=demo/.test(location.search)){ if (!subs.lang) subs.lang = "en"; applySubs(); startDemo(); } } catch(e){}
})();
</script>
</body></html>
