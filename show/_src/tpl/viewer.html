<!doctype html><html lang="{{LANG}}"><head>{{HEAD}}<title>Diretta</title><style>{{CSS}}</style></head>
<body class="dark">
<div class="stagev">
  <div class="phone" id="phone">
    <div class="vid" id="vid"><img class="poster" id="poster" alt="" hidden><div class="artwrap" id="art"></div><div class="videos" id="videos"></div><div class="shade"></div></div>
    <div class="ptop">
      <a class="pill" id="pill" href="{{BASE}}/live"><span class="av" id="av"></span><span class="who"><b id="jname">…</b><span id="jsub" dir="auto"></span></span></a>
      <span class="lbl off" id="lbl"><i></i><span id="lblTxt"></span></span>
      <span class="eye" id="eye" hidden><span id="eyeIc"></span><span id="viewers">0</span></span>
      <a class="x" id="back" href="{{BASE}}/live" aria-label="Chiudi">×</a>
    </div>
    <div class="pchip" id="pchip" hidden><i></i><span id="pchipTxt" dir="auto"></span></div>
    <div class="waitv" id="wait" hidden><div><b id="waitT"></b><span id="waitS"></span></div></div>
    <form class="gate" id="gate"><b id="gateT"></b><p id="gateL"></p><input id="gateName" type="text" maxlength="60" autocomplete="name"><input id="gateMail" type="email" maxlength="254" autocomplete="email" inputmode="email" required><label class="cons"><input id="gateCons" type="checkbox"><span id="gateConsT"></span></label><button type="submit" id="gateGo"></button><p class="fine" id="gateP"></p></form>
    <button class="audio-btn" type="button" id="audioBtn" hidden></button>
    <div class="pchat" id="msgs" aria-live="polite"></div>
    <div class="hearts" id="hearts"></div>
    <div class="rail">
      <button type="button" id="heart"><span class="ic heart" id="heartIc"></span><span id="likes">0</span></button>
      <button type="button" id="interest"><span class="ic goldbg" id="gemIc"></span><span id="interestTxt"></span></button>
      <button type="button" id="book"><span class="ic" id="calIc"></span><span id="bookTxt"></span></button>
      <button type="button" id="share"><span class="ic" id="shareIc"></span><span id="shareTxt"></span></button>
      <button type="button" id="cc"><span class="ic" id="ccIc"></span><span id="ccTxt"></span></button>
      <button type="button" id="buy" hidden><span class="ic goldbg" id="bagIc"></span><span id="buyTxt"></span></button>
      <button type="button" id="how"><span class="ic" id="helpIc"></span><span id="howTxt"></span></button>
    </div>
    <form class="pin" id="form"><input id="msg" type="text" maxlength="500" autocomplete="off"><button type="submit" id="send"></button></form>
    <div class="subsbar" id="subsbar"><span class="sl" id="subLang"></span><p class="st" id="subTxt" data-wait=""></p></div>
    <div class="waitv" id="notfound" hidden><div><b>404</b><span id="nfTxt">Pagina non trovata.</span></div></div>
  </div>
</div>
<p class="credit" id="credit"></p>
<div class="modal" id="modal" hidden></div>
<script>
{{LKJS}}
(function(){
  var CFG = {"url":"{{URL}}","key":"{{KEY}}","slug":"{{SLUG}}","token":"{{TOKEN}}","lang":"{{LANG}}","tokenUrl":"{{TOKENURL}}","base":"{{BASE}}","showId":"{{SHOWID}}","art":{{ART}}};
  var TT = {{T}};
  var sb = window.supabase.createClient(CFG.url, CFG.key);
  var $ = function(id){ return document.getElementById(id); };
  var LOC = { it:"it-IT", en:"en-GB", fr:"fr-FR", ar:"ar-AE-u-nu-latn", ru:"ru-RU" };
  var state = { jeweler:null, show:null, pieces:[], photos:{}, invite:null, name:"", contact:"", lang:"it", t:TT.it, likes:0, channel:null, lastTap:0, queued:0 };
  try { state.name = localStorage.getItem("live-name") || ""; state.contact = localStorage.getItem("live-contact") || ""; } catch(e){}
  $("heartIc").innerHTML = ICON.heart; $("gemIc").innerHTML = ICON.gem; $("calIc").innerHTML = ICON.cal; $("shareIc").innerHTML = ICON.share; $("eyeIc").innerHTML = ICON.eye; $("bagIc").innerHTML = ICON.bag; $("helpIc").innerHTML = ICON.help;

  function fmtDate(iso){ try { return new Intl.DateTimeFormat(LOC[state.lang] || "it-IT", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(iso)); } catch(e){ return iso; } }
  function currentPiece(){ var id = state.show && state.show.current_piece_id; for (var i = 0; i < state.pieces.length; i++) if (state.pieces[i].id === id) return state.pieces[i]; return state.pieces[0] || null; }
  function tr(obj, fb){ var i = obj || {}; return i[state.lang] || (state.lang !== "it" && i.en) || fb || ""; }
  function showTitle(){ var s = state.show, i = s.title_i18n || {}; return i[state.lang] || (state.lang !== "it" && i.en) || s.title; }

  function render(){
    var s = state.show, t = state.t, j = state.jeweler;
    $("av").textContent = (j.name || "?").charAt(0).toUpperCase();
    $("jname").textContent = j.name; $("jsub").textContent = (j.city ? j.city + " · " : "") + showTitle();
    var live = s.status === "live";
    $("lbl").className = "lbl" + (live ? "" : " off"); $("lblTxt").textContent = live ? t.live : (s.status === "ended" ? t.ended : t.soon);
    $("eye").hidden = !live;
    var p = currentPiece();
    $("art").innerHTML = (p && state.photos[p.id]) ? '<img src="' + state.photos[p.id] + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">' : (p ? (CFG.art[p.art] || CFG.art.none) : CFG.art.none);
    var cap = p ? tr(p.caption_i18n, p.caption) : ""; $("pchip").hidden = !cap; $("pchipTxt").textContent = cap;
    var w = $("wait");
    if (s.status === "scheduled"){ w.hidden = false; $("waitT").textContent = t.waitSoon; $("waitS").textContent = fmtDate(s.scheduled_at); }
    else if (s.status === "ended"){ w.hidden = false; $("waitT").textContent = t.waitEnded; $("waitS").textContent = t.waitEndedSub; }
    else { w.hidden = true; }
    $("likes").textContent = fmtK(s.likes, LOC[state.lang]); state.likes = s.likes || 0;
    $("interestTxt").textContent = t.interest; $("bookTxt").textContent = t.book; $("shareTxt").textContent = t.invite; $("buyTxt").textContent = t.buy; $("howTxt").textContent = t.how; $("send").textContent = t.send; $("msg").placeholder = t.ask; $("audioBtn").textContent = t.audio;
    $("ccTxt").textContent = t.cc; $("subTxt").setAttribute("data-wait", t.subsWait); applySubs();
    aggiornaBuy(); apriPorta(); $("pill").href = CFG.base + "/live/" + CFG.slug + "/profile?lang=" + state.lang;
    $("interest").disabled = false; $("book").disabled = false; $("heart").disabled = !live; $("send").disabled = s.status === "ended"; $("msg").disabled = s.status === "ended";
    $("back").title = t.backTo; $("pill").title = t.profile;
    $("credit").textContent = t.foot;
    document.title = j.name + " · " + showTitle();
    if (live) connectVideo(); else disconnectVideo();
  }

  // ---- video (solo ricezione) ----
  var video = { room:null, tiles:null, connecting:false, tries:0, retry:null };
  // Se la trasmissione cade e riparte, la stanza è nuova: senza riaggancio
  // automatico lo spettatore resta sullo schermo nero e se ne va credendo
  // che la diretta sia finita.
  function riprova(ms){
    if (video.retry || video.room) return;
    video.retry = setTimeout(function(){
      video.retry = null;
      if (state.show && state.show.status === "live") connectVideo();
    }, ms || 2000);
  }
  function connectVideo(){
    var LK = window.LivekitClient;
    if (video.room || video.connecting) return;
    if (!LK){ video.tries++; if (video.tries < 20 && state.show && state.show.status === "live") setTimeout(connectVideo, 1500); return; }
    video.connecting = true;
    if (!video.tiles) video.tiles = new LkTiles($("videos"), { onChange: function(n){ $("videos").className = "videos" + (n ? " on" : ""); $("art").hidden = n > 0; $("poster").hidden = n > 0 || !$("poster").getAttribute("src"); } });
    var qs = "?show=" + encodeURIComponent(state.show.id) + (CFG.token ? "&t=" + encodeURIComponent(CFG.token) : "") + "&name=" + encodeURIComponent(guestName() || state.t.guest);
    fetch(CFG.tokenUrl + qs, { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.token) throw new Error(j && j.error || "token");
      var room = new LK.Room({ adaptiveStream:true, dynacast:true });
      lkAttachRemote(room, video.tiles, LK);
      attachSubs(room);
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function(){ $("audioBtn").hidden = room.canPlaybackAudio; });
      room.on(LK.RoomEvent.Disconnected, function(){
        video.room = null; $("audioBtn").hidden = true;
        if (video.tiles) video.tiles.clear();
        riprova(2000);
      });
      return room.connect(j.url, j.token).then(function(){ video.room = room; $("audioBtn").hidden = room.canPlaybackAudio; });
    }).catch(function(e){ console.warn("video", e); riprova(3000); }).then(function(){ video.connecting = false; });
  }
  function disconnectVideo(){ if (video.room){ var r = video.room; video.room = null; r.disconnect(); } if (video.tiles) video.tiles.clear(); $("audioBtn").hidden = true; }
  $("audioBtn").addEventListener("click", function(){ if (video.room) video.room.startAudio().then(function(){ $("audioBtn").hidden = true; }); });

  // ---- nome ospite ----
  function guestName(){ return state.invite ? state.invite.client_name : state.name; }
  function requireName(cb){
    var n = guestName(); if (n){ cb(n); return; }
    openModal('<p class="eyebrow">' + esc(state.t.yourName) + '</p><p class="muted" style="font-size:14px">' + esc(state.t.nameLead) + '</p><form id="nf"><input id="nameIn" type="text" maxlength="60" autocomplete="name" placeholder="' + esc(state.t.yourName) + '"><button class="btn dark" type="submit">' + esc(state.t.cont) + '</button></form>');
    $("nameIn").focus();
    $("nf").addEventListener("submit", function(e){ e.preventDefault(); var v = ($("nameIn").value || "").trim(); if (!v){ toast(state.t.askName); return; } state.name = v; try { localStorage.setItem("live-name", v); } catch(x){} closeModal(); cb(v); });
  }
  function requireContact(cb){
    var n = guestName();
    if (n && state.contact){ cb(n, state.contact); return; }
    openModal('<p class="eyebrow">' + esc(state.t.yourName) + '</p><p class="muted" style="font-size:14px">' + esc(state.t.contactLead) + '</p><form id="cf"><input id="nameIn" type="text" maxlength="60" autocomplete="name" placeholder="' + esc(state.t.yourName) + '" value="' + esc(n || "") + '"><input id="contactIn" type="text" maxlength="120" autocomplete="email" inputmode="email" placeholder="' + esc(state.t.contact) + '" value="' + esc(state.contact || "") + '"><button class="btn dark" type="submit">' + esc(state.t.cont) + '</button></form>');
    (n ? $("contactIn") : $("nameIn")).focus();
    $("cf").addEventListener("submit", function(e){
      e.preventDefault(); var v = ($("nameIn").value || "").trim(), c = ($("contactIn").value || "").trim();
      if (!v){ toast(state.t.askName); return; } if (c.length < 5){ toast(state.t.contact); return; }
      if (!state.invite) state.name = v; state.contact = c; try { localStorage.setItem("live-name", v); localStorage.setItem("live-contact", c); } catch(x){}
      closeModal(); cb(guestName(), c);
    });
  }
  function pickPiece(cb){
    var live = state.show && state.show.status === "live";
    if (live || state.pieces.length < 2){ cb(currentPiece()); return; }
    openModal('<p class="eyebrow">' + esc(state.t.whichPiece) + '</p><div class="slots">' + state.pieces.map(function(p){ return '<button class="slot" type="button" data-p="' + esc(p.id) + '">' + esc(p.name) + '</button>'; }).join("") + '</div>');
    Array.prototype.forEach.call(modal.querySelectorAll("[data-p]"), function(b){ b.addEventListener("click", function(){ var id = b.getAttribute("data-p"); closeModal(); cb(state.pieces.filter(function(p){ return p.id === id; })[0] || null); }); });
  }
  var modal = $("modal");
  function openModal(html){ modal.innerHTML = '<div class="mcard">' + html + '<button class="x" type="button" aria-label="Chiudi">×</button></div>'; modal.hidden = false; modal.querySelector(".x").addEventListener("click", closeModal); }
  function closeModal(){ modal.hidden = true; modal.innerHTML = ""; }
  modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });

  // ---- sottotitoli tradotti: fascia dedicata sotto l'immagine ----
  var SUBL = [{ k:"it", n:"Italiano", tag:"IT" }, { k:"en", n:"English", tag:"EN" }, { k:"fr", n:"Français", tag:"FR" }, { k:"ru", n:"Русский", tag:"RU" }, { k:"ar", n:"العربية", tag:"AR" }];
  var subs = { lang:null, clear:null, demo:null };
  try { subs.lang = localStorage.getItem("uniqaia-subs") || null; } catch(e){}
  function applySubs(){
    var on = !!subs.lang;
    $("phone").classList.toggle("subs", on);
    $("cc").classList.toggle("on", on);
    $("subsbar").setAttribute("dir", subs.lang === "ar" ? "rtl" : "ltr");
    var m = SUBL.filter(function(x){ return x.k === subs.lang; })[0];
    $("subLang").textContent = m ? m.tag : "";
    if (!on) $("subTxt").textContent = "";
  }
  function setSubs(lang){
    subs.lang = lang || null;
    try { if (subs.lang) localStorage.setItem("uniqaia-subs", subs.lang); else localStorage.removeItem("uniqaia-subs"); } catch(e){}
    $("subTxt").textContent = ""; applySubs();
    if (subs.demo && subs.lang) startDemo();
  }
  function showCaption(txt, final){
    if (!subs.lang || !txt) return;
    $("subTxt").textContent = txt;
    if (subs.clear) clearTimeout(subs.clear);
    if (final) subs.clear = setTimeout(function(){ $("subTxt").textContent = ""; }, 4500);
  }
  $("cc").addEventListener("click", function(){
    var t = state.t;
    openModal('<p class="eyebrow">' + esc(t.subsT) + '</p><div class="sublist">' +
      '<button type="button" data-s="" class="' + (subs.lang ? "" : "on") + '"><span>' + esc(t.subsOff) + '</span><small>OFF</small></button>' +
      SUBL.map(function(x){ return '<button type="button" data-s="' + x.k + '" class="' + (subs.lang === x.k ? "on" : "") + '"><span dir="auto">' + esc(x.k === "it" ? t.subsOrig : x.n) + '</span><small>' + x.tag + '</small></button>'; }).join("") + '</div>');
    Array.prototype.forEach.call(modal.querySelectorAll("[data-s]"), function(b){ b.addEventListener("click", function(){ closeModal(); setSubs(b.getAttribute("data-s")); }); });
  });
  // l'agent di traduzione pubblica un flusso di testo per lingua: sub.en, sub.fr, sub.ru, sub.ar
  function attachSubs(room){
    if (!room || !room.registerTextStreamHandler) return;
    SUBL.forEach(function(x){
      try {
        room.registerTextStreamHandler("sub." + x.k, function(reader){
          var a = (reader.info && reader.info.attributes) || {};
          var fin = a["lk.transcription_final"] !== "false";
          reader.readAll().then(function(txt){ if (subs.lang === x.k) showCaption(txt, fin); });
        });
      } catch(e){}
    });
  }
  var DEMO_SUBS = {
    it:["Questo è uno zaffiro Ceylon non riscaldato, da 2,14 carati.","Guardate il taglio a cuscino: le faccette prendono la luce da ogni lato.","Il certificato GIA conferma l'assenza di trattamenti termici.","La montatura è in oro bianco 18 carati, con pavé di diamanti."],
    en:["This is an unheated Ceylon sapphire, 2.14 carats.","Look at the cushion cut: the facets catch the light from every side.","The GIA report confirms there is no heat treatment.","The setting is 18 carat white gold, with a diamond pavé."],
    fr:["Voici un saphir de Ceylan non chauffé, de 2,14 carats.","Regardez la taille coussin : les facettes captent la lumière de tous les côtés.","Le certificat GIA confirme l'absence de traitement thermique.","La monture est en or blanc 18 carats, avec un pavé de diamants."],
    ru:["Это негретый цейлонский сапфир весом 2,14 карата.","Посмотрите на огранку «кушон»: грани ловят свет со всех сторон.","Сертификат GIA подтверждает отсутствие термической обработки.","Оправа — белое золото 750 пробы с паве из бриллиантов."],
    ar:["هذا ياقوت سيلاني غير معالج حرارياً، وزنه 2.14 قيراط.","انظروا إلى القصّ الوسادي: الأوجه تلتقط الضوء من كل جانب.","تقرير GIA يؤكد عدم وجود معالجة حرارية.","الطوق من الذهب الأبيض عيار 18 قيراطاً، مرصّع بالألماس."]
  };
  function startDemo(){
    if (subs.demo) clearInterval(subs.demo);
    var i = 0;
    subs.demo = setInterval(function(){ var a = DEMO_SUBS[subs.lang] || DEMO_SUBS.it; showCaption(a[i % a.length], true); i++; }, 4200);
  }

  // ---- chat ----
  var pending = [];
  function track(body){ var e = { body: body, shown: false }; pending.push(e); setTimeout(function(){ var k = pending.indexOf(e); if (k >= 0) pending.splice(k, 1); }, 15000); return e; }
  function echo(e){ if (pending.indexOf(e) < 0) return; e.shown = true; addMsg({ role:"client", author: guestName(), body: e.body }, true); }
  function addMsg(m, force){
    var box = $("msgs");
    var mine = m.role === "client" && m.author === (guestName() || "\u0000");
    if (!force && mine && m.id){ for (var i = 0; i < pending.length; i++) if (pending[i].body === m.body){ var e = pending.splice(i, 1)[0]; if (e.shown) return; break; } }
    var d = document.createElement("div"); d.className = "pm " + m.role + (mine ? " me" : ""); d.setAttribute("dir", "auto");
    var b = document.createElement("b"); b.textContent = mine ? state.t.me : m.author; d.appendChild(b); d.appendChild(document.createTextNode(m.body));
    box.appendChild(d); while (box.children.length > 8) box.removeChild(box.firstChild);
  }
  function sendClient(body){
    return sb.rpc("client_message", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: guestName(), p_body: body });
  }
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var body = ($("msg").value || "").trim(); if (!body) return;
    requireName(function(){
      $("msg").value = "";
      var en = track(body);
      sendClient(body).then(function(r){ if (r.error){ toast(r.error.message); var k = pending.indexOf(en); if (k >= 0) pending.splice(k, 1); } else echo(en); });
    });
  });
  $("interest").addEventListener("click", function(){
    requireContact(function(n, c){
      pickPiece(function(p){
        sb.rpc("create_request3", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: n, p_contact: c, p_type: "interest", p_piece: p ? p.id : null, p_slot: null }).then(function(r){
          if (r.error){ toast(r.error.message); return; }
          addClaim(r.data);
          toast(state.t.sentInterest + state.jeweler.name + (p ? ": " + tr(p.name_i18n, p.short || p.name) : ""));
          if (state.show.status !== "ended") sendClient(state.t.interestMsg + (p ? tr(p.name_i18n, p.short || p.name) : showTitle()));
        });
      });
    });
  });
  // ---- la porta: per entrare in diretta si lascia l'email ----
  // L'ingresso e il consenso al marketing restano separati di proposito: un
  // consenso dato in cambio dell'accesso non e' libero, quindi non vale, e
  // renderebbe inutilizzabile tutta la lista.
  var porta = { mostrata:false, dentro:false };
  function chiaveSpettatore(){
    var k = "";
    try { k = localStorage.getItem("uniqaia-viewer") || ""; } catch(e){}
    if (!k){
      try { k = crypto.randomUUID(); }
      catch(e){
        k = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
          var r = Math.random() * 16 | 0;
          return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
        });
      }
      try { localStorage.setItem("uniqaia-viewer", k); } catch(e){}
    }
    return k;
  }
  function emailNota(){
    if (state.invite && state.invite.email) return state.invite.email;
    try { return localStorage.getItem("uniqaia-email") || ""; } catch(e){ return ""; }
  }
  function registraIngresso(email, nome, consenso){
    porta.dentro = true;
    state.contact = email;
    if (nome && !state.invite) state.name = nome;
    try {
      localStorage.setItem("uniqaia-email", email);
      if (nome) localStorage.setItem("live-name", nome);
      localStorage.setItem("live-contact", email);
    } catch(e){}
    return sb.rpc("enter_show", {
      p_key: chiaveSpettatore(), p_show: state.show.id, p_email: email,
      p_name: nome || null, p_consent: !!consenso,
      p_invite: state.invite ? state.invite.invite_id : null, p_lang: state.lang
    });
  }
  function apriPorta(){
    if (porta.dentro || !state.show || state.show.status !== "live") return;
    var gia = emailNota();
    // Chi l'ha gia' lasciata non se la rivede chiedere: si registra e basta.
    if (gia){ registraIngresso(gia, guestName() || null, false); return; }
    if (porta.mostrata) return;
    porta.mostrata = true;
    var t = state.t, g = $("gate");
    $("gateT").textContent = t.gateTitle; $("gateL").textContent = t.gateLead;
    $("gateName").placeholder = t.gateName; $("gateMail").placeholder = t.gateEmail;
    $("gateConsT").textContent = t.gateConsent; $("gateGo").textContent = t.gateGo;
    $("gateP").textContent = t.gatePrivacy;
    g.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");
    $("gateName").value = guestName() || "";
    g.className = "gate on";
    setTimeout(function(){ try { $("gateMail").focus(); } catch(e){} }, 150);
  }
  $("gate").addEventListener("submit", function(e){
    e.preventDefault();
    var m = ($("gateMail").value || "").trim().toLowerCase();
    var n = ($("gateName").value || "").trim();
    if (!/^[^@s]+@[^@s]+.[a-z]{2,}$/i.test(m)){ toast(state.t.gateBadEmail); $("gateMail").focus(); return; }
    $("gateGo").disabled = true;
    registraIngresso(m, n, $("gateCons").checked).then(function(r){
      $("gateGo").disabled = false;
      if (r && r.error){ porta.dentro = false; toast(r.error.message); return; }
      $("gate").className = "gate";
    });
  });

  // ---- pagamento ----
  // I soldi non passano da Uniqaia. Il venditore manda il link del suo sistema
  // e qui lo si consegna a chi l'ha chiesto, scritto accanto a chi incassa.
  // La chiave e' il segreto della richiesta, tenuto solo in questo browser:
  // gli id delle richieste sono progressivi e chiunque li indovinerebbe.
  var pay = { last:null, timer:null };
  function claims(){ try { var a = JSON.parse(localStorage.getItem("uniqaia-claims") || "[]"); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
  function addClaim(c){
    if (!c) return;
    try {
      var a = claims();
      if (a.indexOf(c) >= 0) return;
      a.push(c); while (a.length > 20) a.shift();
      localStorage.setItem("uniqaia-claims", JSON.stringify(a));
    } catch(e){}
    loadPay();
  }
  function importo(l){
    if (l.amount_cents == null) return "";
    var v;
    try { v = (l.amount_cents / 100).toLocaleString(LOC[state.lang] || "it-IT", { minimumFractionDigits: l.amount_cents % 100 ? 2 : 0, maximumFractionDigits: 2 }); }
    catch(e){ v = String(l.amount_cents / 100); }
    return v + " " + (!l.currency || l.currency === "EUR" ? "€" : l.currency);
  }
  function prezzoPezzo(p){
    if (!p || !p.price_cents) return "";
    var v;
    try { v = (p.price_cents / 100).toLocaleString(LOC[state.lang] || "it-IT", { minimumFractionDigits: p.price_cents % 100 ? 2 : 0, maximumFractionDigits: 2 }); }
    catch(e){ v = String(p.price_cents / 100); }
    return v + " " + (!p.currency || p.currency === "EUR" ? "€" : p.currency);
  }
  // "Lo prendo" registra l'impegno su un pezzo preciso al prezzo di adesso.
  // Lo si manda anche quando il cliente va a pagare sul sito del venditore:
  // senza, una vendita nata in diretta non lascerebbe nessuna traccia qui.
  function loPrendo(p, url){
    if (!p) return;
    var manda = function(n, c){
      sb.rpc("create_request3", {
        p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null,
        p_guest: n, p_contact: c, p_type: "purchase", p_piece: p.id, p_slot: null
      }).then(function(r){
        if (r.error){ if (!url) toast(r.error.message); return; }
        addClaim(r.data);
        if (!url){
          toast(state.t.takenOk);
          if (state.show.status !== "ended") sendClient(state.t.takenMsg + tr(p.name_i18n, p.short || p.name));
        }
      });
    };
    // Dopo la porta il contatto c'e' gia': non si chiede due volte.
    if (state.contact) manda(guestName() || "Ospite", state.contact);
    else if (url) { /* fuori diretta si lascia passare senza trattenere nessuno */ }
    else requireContact(manda);
    if (url) window.open(/^https?:/i.test(url) ? url : "https://" + url, "_blank", "noopener");
  }
  function aggiornaBuy(){
    var t = state.t, j = state.jeweler, p = currentPiece(), b = $("buy");
    if (!t) return;
    if (pay.last){ b.hidden = false; $("buyTxt").textContent = t.payNow + (pay.last.amount_cents != null ? " · " + importo(pay.last) : ""); return; }
    if (p && p.buy_url){ b.hidden = false; $("buyTxt").textContent = t.buyPiece; return; }
    // Prezzo detto in diretta senza una pagina d'acquisto: ci si impegna qui,
    // e il link per pagare arriva dal venditore.
    if (p && p.price_cents){ b.hidden = false; $("buyTxt").textContent = t.takeIt + " · " + prezzoPezzo(p); return; }
    b.hidden = !(j && j.shop_url); $("buyTxt").textContent = t.buy;
  }
  function apriPagamento(l){
    var t = state.t;
    openModal('<p class="eyebrow">' + esc(t.payTitle) + '</p>' +
      (l.amount_cents != null ? '<h3 style="margin:.2em 0 .1em">' + esc(importo(l)) + '</h3>' : '') +
      (l.piece_name ? '<p class="muted" style="font-size:14px;margin:0 0 10px">' + esc(l.piece_name) + '</p>' : '') +
      '<p style="font-size:14px;line-height:1.5;margin:0 0 4px"><b>' + esc(t.payBy) + '</b> ' + esc(l.seller_name || "") + (l.seller_city ? ' · ' + esc(l.seller_city) : '') + (l.seller_country ? ' (' + esc(l.seller_country) + ')' : '') + '</p>' +
      '<p style="font-size:14px;line-height:1.5;margin:0 0 10px"><b>' + esc(t.payOn) + '</b> ' + esc(l.host) + '</p>' +
      (l.note ? '<p style="font-size:14px;line-height:1.5">' + esc(l.note) + '</p>' : '') +
      '<a class="btn dark" id="payGo" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.payOpen) + '</a>' +
      '<p class="muted" style="font-size:12.5px;line-height:1.5;margin-top:10px">' + esc(t.payOutside) + '</p>');
    var g = $("payGo");
    if (g) g.addEventListener("click", function(){ sb.rpc("mark_payment_link_seen", { p_claim: l.claim, p_id: l.id }); });
  }
  function loadPay(){
    var cs = claims(); if (!cs.length) return;
    sb.rpc("my_payment_links", { p_claims: cs }).then(function(r){
      if (r.error || !r.data || !r.data.length) return;
      var l = r.data[r.data.length - 1];
      var nuovo = !pay.last || pay.last.id !== l.id;
      pay.last = l; aggiornaBuy();
      if (!nuovo) return;
      var k = "uniqaia-pay-" + l.id, visto = false;
      try { visto = !!localStorage.getItem(k); localStorage.setItem(k, "1"); } catch(e){}
      if (!visto){ toast(state.t.payArrived); apriPagamento(l); }
    });
  }
  $("buy").addEventListener("click", function(){
    if (pay.last){ apriPagamento(pay.last); return; }
    var p = currentPiece();
    if (p && p.buy_url){ loPrendo(p, p.buy_url); return; }
    if (p && p.price_cents){ loPrendo(p, null); return; }
    var u = state.jeweler && state.jeweler.shop_url;
    if (u) window.open(/^https?:/i.test(u) ? u : "https://" + u, "_blank", "noopener");
  });
  pay.timer = setInterval(loadPay, 7000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) loadPay(); });
  loadPay();
  $("how").addEventListener("click", function(){
    var j = state.jeweler, t = state.t;
    openModal('<p class="eyebrow">' + esc(t.howTitle) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howInterest) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howBook) + '</p><p style="font-size:14px;line-height:1.5">' + esc(t.howBuy) + '</p>' + (j && j.shop_url ? '<a class="btn dark" href="' + esc(/^https?:/i.test(j.shop_url) ? j.shop_url : "https://" + j.shop_url) + '" target="_blank" rel="noopener">' + esc(t.shopLink) + '</a>' : '') + '<a class="btn sm" href="' + CFG.base + '/live/' + CFG.slug + '/profile?lang=' + state.lang + '">' + esc(t.profile) + ' · ' + esc(j ? j.name : "") + '</a>');
  });
  $("book").addEventListener("click", function(){
    requireContact(function(n, c){
      var slots = Array.isArray(state.show.slots) ? state.show.slots : [];
      var html = '<p class="eyebrow">' + esc(state.t.book) + '</p><h3>' + esc(state.t.when) + '</h3><p class="muted" style="font-size:14px">' + esc(state.t.book2 + state.jeweler.name) + '</p><div class="slots">';
      for (var i = 0; i < slots.length; i++) html += '<button class="slot" type="button" data-slot="' + esc(slots[i]) + '">' + esc(slots[i]) + '</button>';
      if (!slots.length) html += '<input id="slotFree" type="text" placeholder="…"><button class="btn dark" type="button" id="slotSend">OK</button>';
      html += '</div>';
      openModal(html);
      function choose(slot){
        var p = currentPiece();
        sb.rpc("create_request3", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: n, p_contact: c, p_type: "appointment", p_piece: p ? p.id : null, p_slot: slot }).then(function(r){
          if (r.error){ toast(r.error.message); return; }
          addClaim(r.data);
          openModal('<p class="ok">✓ ' + esc(state.t.confirmed) + '</p><h3>' + esc(slot) + '</h3><p class="muted" style="font-size:14px">' + esc(state.jeweler.name) + '</p><button class="btn dark" type="button" id="mClose">' + esc(state.t.back) + '</button>');
          $("mClose").addEventListener("click", closeModal);
          if (state.show.status !== "ended") sendClient(state.t.booked + slot);
        });
      }
      Array.prototype.forEach.call(modal.querySelectorAll(".slot"), function(b){ b.addEventListener("click", function(){ choose(b.getAttribute("data-slot")); }); });
      var fs = $("slotSend"); if (fs) fs.addEventListener("click", function(){ var v = ($("slotFree").value || "").trim(); if (v) choose(v); });
    });
  });
  $("share").addEventListener("click", function(){
    var link = (state.show && state.show.slug) ? CFG.base + "/live/" + CFG.slug + "/" + state.show.slug : CFG.base + "/live/" + CFG.slug;
    var done = function(){ toast(state.t.copied); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function(){ openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">'); });
    else openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">');
  });

  // ---- cuori ----
  $("heart").addEventListener("click", function(){
    if (!state.show || state.show.status !== "live") return;
    state.lastTap = Date.now(); state.queued++; state.likes++; $("likes").textContent = fmtK(state.likes, LOC[state.lang]);
    $("heartIc").classList.add("on"); burstHearts($("hearts"), 1);
  });
  setInterval(function(){
    if (!state.queued || !state.show) return;
    var n = state.queued; state.queued = 0;
    sb.rpc("like_show", { p_show: state.show.id, p_n: n }).then(function(r){ if (!r.error && typeof r.data === "number" && r.data > state.likes){ state.likes = r.data; $("likes").textContent = fmtK(state.likes, LOC[state.lang]); } });
  }, 1200);

  // ---- realtime: chat, stato, cuori, presenze ----
  function subscribe(){
    var ch = sb.channel("show-" + state.show.id, { config: { presence: { key: "v" + Math.random().toString(36).slice(2, 10) } } });
    ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"show_id=eq." + state.show.id }, function(p){ addMsg(p.new); })
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"shows", filter:"id=eq." + state.show.id }, function(p){
        var prev = state.show; state.show = p.new;
        if (p.new.likes > state.likes && Date.now() - state.lastTap > 1500) burstHearts($("hearts"), Math.min(p.new.likes - state.likes, 5));
        if (p.new.status !== prev.status || p.new.current_piece_id !== prev.current_piece_id || p.new.title !== prev.title) render();
        else { state.likes = Math.max(state.likes, p.new.likes || 0); $("likes").textContent = fmtK(state.likes, LOC[state.lang]); }
      })
      .on("postgres_changes", { event:"*", schema:"public", table:"pieces", filter:"show_id=eq." + state.show.id }, function(){ sb.from("pieces").select("*").eq("show_id", state.show.id).order("position").then(function(r){ state.pieces = r.data || []; render(); }); })
      .on("postgres_changes", { event:"*", schema:"public", table:"show_covers", filter:"show_id=eq." + state.show.id }, function(p){ if (p.new && p.new.data) setPoster(p.new.data); })
      .on("presence", { event:"sync" }, function(){ var n = Object.keys(ch.presenceState()).length; $("viewers").textContent = n; })
      .subscribe(function(status){ if (status === "SUBSCRIBED") ch.track({ at: Date.now() }); });
    state.channel = ch;
  }
  function setPoster(data){ var img = $("poster"); img.setAttribute("src", data); img.hidden = !!(video.tiles && video.tiles.count()); $("art").hidden = !img.hidden || $("art").hidden; }

  function boot(){
    sb.from("jewelers").select("*").eq("slug", CFG.slug).maybeSingle().then(function(r){
      if (!r.data){ $("notfound").hidden = false; return; }
      state.jeweler = r.data;
      var inv = CFG.token ? sb.rpc("join_show", { p_token: CFG.token }).then(function(x){ return (x.data && x.data[0]) || null; }) : Promise.resolve(null);
      inv.then(function(invite){
        state.invite = invite;
        if (CFG.showId) return sb.from("shows").select("*").eq("id", CFG.showId).eq("jeweler_id", state.jeweler.id).limit(1);
        if (invite) return sb.from("shows").select("*").eq("id", invite.show_id).limit(1);
        return sb.from("shows").select("*").eq("jeweler_id", state.jeweler.id).order("scheduled_at", { ascending:false }).limit(8);
      }).then(function(r){
        var rows = r.data || []; if (!rows.length){ $("notfound").hidden = false; return; }
        var live = rows.filter(function(s){ return s.status === "live"; })[0];
        var sched = rows.filter(function(s){ return s.status === "scheduled"; }).sort(function(a,b){ return new Date(a.scheduled_at) - new Date(b.scheduled_at); })[0];
        state.show = live || sched || rows[0];
        // lingua: ?lang, poi la scelta fatta in vetrina, poi il browser, poi la lingua della diretta
        var q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(), st = "";
        try { st = localStorage.getItem("vetrina-lang") || ""; } catch(e){}
        var nav = (navigator.language || "").slice(0, 2).toLowerCase();
        state.lang = TT[q] ? q : (TT[st] ? st : (TT[nav] ? nav : (TT[state.show.lang] ? state.show.lang : "it"))); state.t = TT[state.lang];
        if (TT[q]) { try { localStorage.setItem("vetrina-lang", q); } catch(e){} }
        document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        return Promise.all([
          sb.from("pieces").select("*").eq("show_id", state.show.id).order("position"),
          sb.from("messages").select("*").eq("show_id", state.show.id).order("created_at").limit(200),
          sb.from("show_covers").select("data").eq("show_id", state.show.id).maybeSingle()
        ]);
      }).then(function(res){
        if (!res) return;
        state.pieces = res[0].data || [];
        var pids = state.pieces.map(function(p){ return p.id; });
        if (pids.length) sb.from("piece_photos").select("piece_id,data").in("piece_id", pids).then(function(ph){ (ph.data || []).forEach(function(x){ state.photos[x.piece_id] = x.data; }); render(); });
        render();
        if (res[2].data && res[2].data.data) setPoster(res[2].data.data);
        (res[1].data || []).slice(-8).forEach(addMsg);
        subscribe();
      });
    });
  }
  boot();
  applySubs();
  try { if (/[?&]subs=demo/.test(location.search)){ if (!subs.lang) subs.lang = "en"; applySubs(); startDemo(); } } catch(e){}
})();
</script>
</body></html>
