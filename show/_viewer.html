<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@300..600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.0/dist/livekit-client.umd.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/livekit-client@2.22.0/dist/livekit-client.umd.min.js';document.head.appendChild(s)"></script><title>Diretta</title><style>
:root{--paper:#FFFFFF;--ink:#16181D;--muted:#5B606A;--line:#E7E4DC;--soft:#F6F4EF;--soft-2:#F8F1DF;--gold-hi:#EDD596;--gold:#CBA44F;--gold-lo:#A9833A;--gold-edge:#8C6A2B;--gold-ink:#1C1406;--live:#1E7A4F;--heart:#C6364E;--video:#1E2128;--display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;--body:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-edge);outline-offset:3px}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}
.gold{background:linear-gradient(140deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-edge);font-weight:500}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;border:1px solid var(--ink);background:none;color:var(--ink)}
.btn.primary{color:var(--gold-ink);border-color:var(--gold-edge)}
.btn.dark{background:var(--gold-ink);color:var(--gold-hi);border-color:var(--gold-ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .col{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.wordmark{font-family:var(--display);font-size:clamp(17px,3vw,22px);letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.16em;color:var(--gold-edge);margin-top:-2px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.status.live{color:var(--live)}.status.live i{background:var(--live);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,122,79,.5)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input,select,textarea{border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--paper);min-height:44px}
textarea{border-radius:12px;min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1C1406;color:#EDD596;padding:11px 18px;border-radius:999px;font-size:14px;z-index:70;display:flex;gap:9px;align-items:center;animation:rise .3s ease-out both;max-width:calc(100% - 28px)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--live);display:block;flex:none}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.modal{position:fixed;inset:0;background:rgba(14,16,20,.6);display:grid;place-items:center;padding:14px;z-index:60}
.mcard{position:relative;max-width:440px;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.mcard h3{font-family:var(--display);font-size:24px}
.mcard form{display:flex;flex-direction:column;gap:10px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{border:1px solid var(--line);background:var(--paper);padding:11px 14px;border-radius:999px;text-align:start}
.slot:hover{border-color:var(--gold-edge);background:var(--soft-2)}
.x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--muted)}
.ok{display:flex;align-items:center;gap:10px;color:var(--live);font-weight:500}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label input,label select,label textarea{width:100%}
footer{padding:22px 0 30px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
[hidden]{display:none!important}

/* ---- pannello: chat e tiles ---- */
.msgs{flex:1;min-height:220px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:2px;animation:risemsg .3s ease-out both}
.msg .who{font-size:12px;color:var(--muted)}
.msg .txt{font-size:15px;line-height:1.4;background:var(--soft);padding:8px 12px;border-radius:12px 12px 12px 3px;max-width:94%;overflow-wrap:anywhere}
.msg.gemologist .who{color:var(--gold-edge);font-weight:500}
.msg.gemologist .txt{background:var(--soft-2);border:1px solid var(--gold-hi)}
.msg.shop .who{color:var(--ink);font-weight:500}
.msg.shop .txt{border:1px solid var(--line);background:var(--paper)}
.msg.me{align-items:flex-end}
.msg.me .txt{background:var(--gold-ink);color:var(--gold-hi);border-radius:12px 12px 3px 12px}
@keyframes risemsg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.videos{position:absolute;inset:0;display:none}
.videos.on{display:block}
.videos .main{position:absolute;inset:0;background:#000}
.videos .main video{width:100%;height:100%;object-fit:cover;display:block}
.videos .pips{position:absolute;right:12px;top:48px;display:flex;flex-direction:column;gap:8px;width:26%;max-width:190px;min-width:84px;z-index:2}
.videos .pip{aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45);background:#000;cursor:pointer}
.videos .pip video{width:100%;height:100%;object-fit:cover;display:block}
.videos video.mirror{transform:scaleX(-1)}
.audios{display:none}

/* ---- pagina diretta (verticale) ---- */
body.dark{background:#0E0B07;color:#F7EBCB;padding:0}
.stagev{min-height:100dvh;display:grid;place-items:center}
.phone{position:relative;width:100%;height:100dvh;background:#000;overflow:hidden;color:#fff}
@media (min-width:760px){.stagev{padding:24px}.phone{width:400px;height:min(820px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1B1B1F}}
.vid{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#2A2A30,#0A0A0D)}
.vid::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 35% at 50% 28%,rgba(255,228,170,.3),transparent 70%)}
.vid .artwrap{position:relative;width:62%;margin-top:-56%;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));animation:sway 6s ease-in-out infinite}
.vid .artwrap svg{width:100%;height:auto;display:block}
.vid .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.7)}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-6px)}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.35) 35%,transparent 60%),linear-gradient(to bottom,rgba(0,0,0,.5),transparent 25%)}
.videos.on ~ .shade{background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.25) 30%,transparent 50%),linear-gradient(to bottom,rgba(0,0,0,.45),transparent 22%)}
.ptop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:4}
.ptop .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;min-width:0;flex:0 1 auto;line-height:1.2;color:#fff;text-decoration:none}
.ptop .pill .who{min-width:0;display:flex;flex-direction:column}
.ptop .pill .who b,.ptop .pill .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pill b{font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft-2);color:var(--gold-edge);display:grid;place-items:center;font-family:var(--display);font-size:13px;flex:none;border:1px solid var(--gold-hi)}
.ptop .av{width:28px;height:28px;font-size:12px}
.lbl{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;flex:none}
.lbl i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;animation:pulsew 1.6s ease-out infinite}
.lbl.off{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}.lbl.off i{animation:none;opacity:.6}
@keyframes pulsew{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ptop .eye{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);border-radius:999px;padding:5px 9px;font-size:12px;flex:none}
.ptop .eye svg{width:12px;height:12px}
.ptop .x{position:static;margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:20px;color:#fff;flex:none;text-decoration:none}
.pchip{position:absolute;left:12px;top:calc(68px + env(safe-area-inset-top,0px));z-index:4;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:72%}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block;flex:none}
.waitv{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(10,10,12,.55);color:#fff;font-size:16px;line-height:1.5}
.waitv b{display:block;font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:6px}
.rail{position:absolute;right:10px;bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:11px;letter-spacing:.02em;border:0;background:none;padding:0}
.rail .ic{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:grid;place-items:center}
.rail .ic svg{width:22px;height:22px}
.rail .ic.goldbg{background:linear-gradient(140deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#1C1406}
.rail .ic.heart.on{color:var(--heart)}
.rail button:disabled{opacity:.45}
.subs{position:absolute;left:12px;right:76px;bottom:calc(64px + 30% + 10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.subs .txt{width:100%;background:rgba(0,0,0,.62);border-radius:10px;padding:7px 11px;font-size:14.5px;line-height:1.3;color:#fff;min-height:40px}
.pchat{position:absolute;left:12px;right:76px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;max-height:30%;overflow:hidden;mask-image:linear-gradient(to bottom,transparent,#000 22%)}
.pm{align-self:flex-start;max-width:100%;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:14px;padding:6px 11px;font-size:13.5px;line-height:1.3;animation:up .35s ease-out both;color:#fff;overflow-wrap:anywhere}
.pm b{font-weight:500;color:#EDD596;margin-right:5px}
.pm.gemologist b{color:#F2E6C8}.pm.gemologist{border:1px solid rgba(237,213,150,.5)}
.pm.shop b{color:#fff}
.pm.me{align-self:flex-end;background:rgba(237,213,150,.9);color:#1C1406}.pm.me b{color:#8C6A2B}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pin{position:absolute;left:12px;right:76px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;margin:0}
.pin input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:10px 14px;outline:none;min-height:44px}
.pin input::placeholder{color:rgba(255,255,255,.7)}
.pin button{border-radius:999px;background:#fff;color:#111;padding:0 14px;font-weight:500;font-size:14px;border:0}
.hearts{position:absolute;right:22px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:60px;height:260px;pointer-events:none;z-index:6}
.hearts span{position:absolute;bottom:0;left:50%;width:22px;height:22px;animation:fly 1.3s ease-out forwards;color:var(--heart)}
.hearts span svg{width:100%;height:100%}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-240px) scale(1.25) rotate(var(--rot))}}
.audio-btn{position:absolute;left:50%;bottom:calc(64px + 30% + 60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;border-radius:999px;background:#fff;color:#111;border:0;padding:10px 18px;font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.credit{text-align:center;font-size:12px;color:rgba(247,235,203,.6);padding:14px;letter-spacing:.06em}
@media (max-width:759px){.credit{display:none}}

/* ---- vetrina ---- */
.topv{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topv .col{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.topright{display:flex;align-items:center;gap:8px}
.langs{position:relative}
.langs .cur{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#1C1406;color:#EDD596}
.langs .cur::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.8}
.langs .menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:160px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:30}
.langs .menu[hidden]{display:none}
.langs .menu button{text-align:start;font-size:14px;padding:9px 12px;border-radius:9px;border:0;background:none;color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:center}
.langs .menu button small{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.langs .menu button.on{background:var(--soft-2);color:var(--gold-edge);font-weight:500}
.about-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-hi);color:var(--gold-edge);font-family:var(--display);font-style:italic;font-size:17px;display:grid;place-items:center;padding:0;background:none;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 2px;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;font-size:15px;color:var(--muted);border:0;border-bottom:2px solid transparent;white-space:nowrap;background:none}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:500}
.tab .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--live);color:#fff;font-size:11px;margin-left:5px;padding:0 5px;vertical-align:1px}
.trust{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-edge)}
.trust span{display:inline-flex;align-items:flex-start;gap:6px;line-height:1.35}
.trust i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block;flex:none;margin-top:5px}
.vetrina section{margin-top:26px;scroll-margin-top:118px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh h2{font-family:var(--display);font-size:clamp(22px,4vw,28px);line-height:1.1}
.sh a,.sh button{font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;border:0;background:none;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 16px}}
.vcard{display:flex;flex-direction:column;gap:8px;text-align:start;width:100%;color:inherit;text-decoration:none;border:0;background:none;padding:0;font:inherit}
.cover{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--video);display:grid;place-items:center;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 38%,rgba(255,228,170,.26),transparent 70%);z-index:1}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 30%,transparent 55%);z-index:2}
.cover .art{width:66%;position:relative;z-index:1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5));transition:transform .5s ease}
.cover .art svg{width:100%;height:auto;display:block}
.vcard:hover .cover .art{transform:scale(1.04)}
.cover .ph{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,var(--c1,#2A2A30),var(--c2,#0A0A0D))}
.cover img.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .lbl{position:absolute;top:10px;inset-inline-start:10px;z-index:3}
.stat{position:absolute;top:10px;inset-inline-end:10px;z-index:3;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.stat span{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:12px;padding:4px 8px;border-radius:999px}
.stat svg{width:12px;height:12px}
.ctitle{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;color:#fff;font-family:var(--display);font-size:17px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.ctitle small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi);margin-top:5px;text-shadow:none}
.when{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:3;background:rgba(255,255,255,.92);color:#16181D;border-radius:12px;padding:8px 12px;text-align:center;line-height:1.15;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
.when b{display:block;font-family:var(--display);font-size:22px;font-weight:400}
.when small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8C6A2B}
.meta{display:flex;align-items:center;gap:9px}
.meta b{display:block;font-weight:500;font-size:14px;line-height:1.2}
.meta small{display:block;font-size:12px;color:var(--muted)}
.chk{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);color:#fff;font-size:9px;line-height:12px;text-align:center;vertical-align:1px;margin-left:3px}
.shops{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}
.shops::-webkit-scrollbar{display:none}
.seller{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;color:inherit;text-decoration:none}

  try { state.name = localStorage.getItem("live-name") || ""; } catch(e){}
  $("heartIc").innerHTML = ICON.heart; $("gemIc").innerHTML = ICON.gem; $("calIc").innerHTML = ICON.cal; $("shareIc").innerHTML = ICON.share; $("eyeIc").innerHTML = ICON.eye;

  function fmtDate(iso){ try { return new Intl.DateTimeFormat(LOC[state.lang] || "it-IT", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(iso)); } catch(e){ return iso; } }
  function currentPiece(){ var id = state.show && state.show.current_piece_id; for (var i = 0; i < state.pieces.length; i++) if (state.pieces[i].id === id) return state.pieces[i]; return state.pieces[0] || null; }
  function showTitle(){ var s = state.show, i = s.title_i18n || {}; return i[state.lang] || (state.lang !== "it" && i.en) || s.title; }

  function render(){
    var s = state.show, t = state.t, j = state.jeweler;
    $("av").textContent = (j.name || "?").charAt(0).toUpperCase();
    $("jname").textContent = j.name; $("jsub").textContent = (j.city ? j.city + " · " : "") + showTitle();
    var live = s.status === "live";
    $("lbl").className = "lbl" + (live ? "" : " off"); $("lblTxt").textContent = live ? t.live : (s.status === "ended" ? t.ended : t.soon);
    $("eye").hidden = !live;
    var p = currentPiece();
    $("art").innerHTML = p ? (CFG.art[p.art] || CFG.art.none) : CFG.art.none;
    $("pchip").hidden = !p || !p.caption; $("pchipTxt").textContent = p ? p.caption : "";
    var w = $("wait");
    if (s.status === "scheduled"){ w.hidden = false; $("waitT").textContent = t.waitSoon; $("waitS").textContent = fmtDate(s.scheduled_at); }
    else if (s.status === "ended"){ w.hidden = false; $("waitT").textContent = t.waitEnded; $("waitS").textContent = t.waitEndedSub; }
    else { w.hidden = true; }
    $("likes").textContent = fmtK(s.likes, LOC[state.lang]); state.likes = s.likes || 0;
    $("interestTxt").textContent = t.interest; $("bookTxt").textContent = t.book; $("shareTxt").textContent = t.invite; $("send").textContent = t.send; $("msg").placeholder = t.ask; $("audioBtn").textContent = t.audio;
    $("interest").disabled = s.status === "ended"; $("heart").disabled = !live; $("send").disabled = s.status === "ended"; $("msg").disabled = s.status === "ended";
    $("back").title = t.backTo; $("pill").title = t.backTo;
    $("credit").textContent = t.foot;
    document.title = j.name + " · " + showTitle();
    if (live) connectVideo(); else disconnectVideo();
  }

  // ---- video (solo ricezione) ----
  var video = { room:null, tiles:null, connecting:false, tries:0 };
  function connectVideo(){
    var LK = window.LivekitClient;
    if (video.room || video.connecting) return;
    if (!LK){ video.tries++; if (video.tries < 20 && state.show && state.show.status === "live") setTimeout(connectVideo, 1500); return; }
    video.connecting = true;
    if (!video.tiles) video.tiles = new LkTiles($("videos"), { onChange: function(n){ $("videos").className = "videos" + (n ? " on" : ""); $("art").hidden = n > 0; $("poster").hidden = n > 0 || !$("poster").getAttribute("src"); } });
    var qs = "?show=" + encodeURIComponent(state.show.id) + (CFG.token ? "&t=" + encodeURIComponent(CFG.token) : "") + "&name=" + encodeURIComponent(guestName() || state.t.guest);
    fetch(CFG.tokenUrl + qs, { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.token) throw new Error(j && j.error || "token");
      var room = new LK.Room({ adaptiveStream:true, dynacast:true });
      lkAttachRemote(room, video.tiles, LK);
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function(){ $("audioBtn").hidden = room.canPlaybackAudio; });
      room.on(LK.RoomEvent.Disconnected, function(){ video.room = null; $("audioBtn").hidden = true; });
      return room.connect(j.url, j.token).then(function(){ video.room = room; $("audioBtn").hidden = room.canPlaybackAudio; });
    }).catch(function(e){ console.warn("video", e); }).then(function(){ video.connecting = false; });
  }
  function disconnectVideo(){ if (video.room){ var r = video.room; video.room = null; r.disconnect(); } if (video.tiles) video.tiles.clear(); $("audioBtn").hidden = true; }
  $("audioBtn").addEventListener("click", function(){ if (video.room) video.room.startAudio().then(function(){ $("audioBtn").hidden = true; }); });

  // ---- nome ospite ----
  function guestName(){ return state.invite ? state.invite.client_name : state.name; }
  function requireName(cb){
    var n = guestName(); if (n){ cb(n); return; }
    openModal('<p class="eyebrow">' + esc(state.t.yourName) + '</p><p class="muted" style="font-size:14px">' + esc(state.t.nameLead) + '</p><form id="nf"><input id="nameIn" type="text" maxlength="60" autocomplete="name" placeholder="' + esc(state.t.yourName) + '"><button class="btn dark" type="submit">' + esc(state.t.cont) + '</button></form>');
    $("nameIn").focus();
    $("nf").addEventListener("submit", function(e){ e.preventDefault(); var v = ($("nameIn").value || "").trim(); if (!v){ toast(state.t.askName); return; } state.name = v; try { localStorage.setItem("live-name", v); } catch(x){} closeModal(); cb(v); });
  }
  var modal = $("modal");
  function openModal(html){ modal.innerHTML = '<div class="mcard">' + html + '<button class="x" type="button" aria-label="Chiudi">×</button></div>'; modal.hidden = false; modal.querySelector(".x").addEventListener("click", closeModal); }
  function closeModal(){ modal.hidden = true; modal.innerHTML = ""; }
  modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });

  // ---- chat ----
  var pending = [];
  function track(body){ var e = { body: body, shown: false }; pending.push(e); setTimeout(function(){ var k = pending.indexOf(e); if (k >= 0) pending.splice(k, 1); }, 15000); return e; }
  function echo(e){ if (pending.indexOf(e) < 0) return; e.shown = true; addMsg({ role:"client", author: guestName(), body: e.body }, true); }
  function addMsg(m, force){
    var box = $("msgs");
    var mine = m.role === "client" && m.author === (guestName() || "\u0000");
    if (!force && mine && m.id){ for (var i = 0; i < pending.length; i++) if (pending[i].body === m.body){ var e = pending.splice(i, 1)[0]; if (e.shown) return; break; } }
    var d = document.createElement("div"); d.className = "pm " + m.role + (mine ? " me" : ""); d.setAttribute("dir", "auto");
    var b = document.createElement("b"); b.textContent = mine ? state.t.me : m.author; d.appendChild(b); d.appendChild(document.createTextNode(m.body));
    box.appendChild(d); while (box.children.length > 8) box.removeChild(box.firstChild);
  }
  function sendClient(body){
    return sb.rpc("client_message", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: guestName(), p_body: body });
  }
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var body = ($("msg").value || "").trim(); if (!body) return;
    requireName(function(){
      $("msg").value = "";
      var en = track(body);
      sendClient(body).then(function(r){ if (r.error){ toast(r.error.message); var k = pending.indexOf(en); if (k >= 0) pending.splice(k, 1); } else echo(en); });
    });
  });
  $("interest").addEventListener("click", function(){
    requireName(function(n){
      var p = currentPiece();
      sb.rpc("create_request", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: n, p_type: "interest", p_piece: p ? p.id : null, p_slot: null }).then(function(r){
        if (r.error){ toast(r.error.message); return; }
        toast(state.t.sentInterest + state.jeweler.name + (p ? ": " + p.short : ""));
        sendClient(state.t.interestMsg + (p ? p.short : showTitle()));
      });
    });
  });
  $("book").addEventListener("click", function(){
    requireName(function(n){
      var slots = Array.isArray(state.show.slots) ? state.show.slots : [];
      var html = '<p class="eyebrow">' + esc(state.t.book) + '</p><h3>' + esc(state.t.when) + '</h3><p class="muted" style="font-size:14px">' + esc(state.t.book2 + state.jeweler.name) + '</p><div class="slots">';
      for (var i = 0; i < slots.length; i++) html += '<button class="slot" type="button" data-slot="' + esc(slots[i]) + '">' + esc(slots[i]) + '</button>';
      if (!slots.length) html += '<input id="slotFree" type="text" placeholder="…"><button class="btn dark" type="button" id="slotSend">OK</button>';
      html += '</div>';
      openModal(html);
      function choose(slot){
        var p = currentPiece();
        sb.rpc("create_request", { p_show: state.show.id, p_invite: state.invite ? state.invite.invite_id : null, p_guest: n, p_type: "appointment", p_piece: p ? p.id : null, p_slot: slot }).then(function(r){
          if (r.error){ toast(r.error.message); return; }
          openModal('<p class="ok">✓ ' + esc(state.t.confirmed) + '</p><h3>' + esc(slot) + '</h3><p class="muted" style="font-size:14px">' + esc(state.jeweler.name) + '</p><button class="btn dark" type="button" id="mClose">' + esc(state.t.back) + '</button>');
          $("mClose").addEventListener("click", closeModal);
          sendClient(state.t.booked + slot);
        });
      }
      Array.prototype.forEach.call(modal.querySelectorAll(".slot"), function(b){ b.addEventListener("click", function(){ choose(b.getAttribute("data-slot")); }); });
      var fs = $("slotSend"); if (fs) fs.addEventListener("click", function(){ var v = ($("slotFree").value || "").trim(); if (v) choose(v); });
    });
  });
  $("share").addEventListener("click", function(){
    var link = CFG.base + "/show/" + CFG.slug + "/";
    var done = function(){ toast(state.t.copied); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function(){ openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">'); });
    else openModal('<p class="eyebrow">' + esc(state.t.invite) + '</p><input type="text" readonly value="' + esc(link) + '">');
  });

  // ---- cuori ----
  $("heart").addEventListener("click", function(){
    if (!state.show || state.show.status !== "live") return;
    state.lastTap = Date.now(); state.queued++; state.likes++; $("likes").textContent = fmtK(state.likes, LOC[state.lang]);
    $("heartIc").classList.add("on"); burstHearts($("hearts"), 1);
  });
  setInterval(function(){
    if (!state.queued || !state.show) return;
    var n = state.queued; state.queued = 0;
    sb.rpc("like_show", { p_show: state.show.id, p_n: n }).then(function(r){ if (!r.error && typeof r.data === "number" && r.data > state.likes){ state.likes = r.data; $("likes").textContent = fmtK(state.likes, LOC[state.lang]); } });
  }, 1200);

  // ---- realtime: chat, stato, cuori, presenze ----
  function subscribe(){
    var ch = sb.channel("show-" + state.show.id, { config: { presence: { key: "v" + Math.random().toString(36).slice(2, 10) } } });
    ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"show_id=eq." + state.show.id }, function(p){ addMsg(p.new); })
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"shows", filter:"id=eq." + state.show.id }, function(p){
        var prev = state.show; state.show = p.new;
        if (p.new.likes > state.likes && Date.now() - state.lastTap > 1500) burstHearts($("hearts"), Math.min(p.new.likes - state.likes, 5));
        if (p.new.status !== prev.status || p.new.current_piece_id !== prev.current_piece_id || p.new.title !== prev.title) render();
        else { state.likes = Math.max(state.likes, p.new.likes || 0); $("likes").textContent = fmtK(state.likes, LOC[state.lang]); }
      })
      .on("postgres_changes", { event:"*", schema:"public", table:"pieces", filter:"show_id=eq." + state.show.id }, function(){ sb.from("pieces").select("*").eq("show_id", state.show.id).order("position").then(function(r){ state.pieces = r.data || []; render(); }); })
      .on("postgres_changes", { event:"*", schema:"public", table:"show_covers", filter:"show_id=eq." + state.show.id }, function(p){ if (p.new && p.new.data) setPoster(p.new.data); })
      .on("presence", { event:"sync" }, function(){ var n = Object.keys(ch.presenceState()).length; $("viewers").textContent = n; })
      .subscribe(function(status){ if (status === "SUBSCRIBED") ch.track({ at: Date.now() }); });
    state.channel = ch;
  }
  function setPoster(data){ var img = $("poster"); img.setAttribute("src", data); img.hidden = !!(video.tiles && video.tiles.count()); $("art").hidden = !img.hidden || $("art").hidden; }

  function boot(){
    sb.from("jewelers").select("*").eq("slug", CFG.slug).maybeSingle().then(function(r){
      if (!r.data){ $("notfound").hidden = false; return; }
      state.jeweler = r.data;
      var inv = CFG.token ? sb.rpc("join_show", { p_token: CFG.token }).then(function(x){ return (x.data && x.data[0]) || null; }) : Promise.resolve(null);
      inv.then(function(invite){
        state.invite = invite;
        if (CFG.showId) return sb.from("shows").select("*").eq("id", CFG.showId).eq("jeweler_id", state.jeweler.id).limit(1);
        if (invite) return sb.from("shows").select("*").eq("id", invite.show_id).limit(1);
        return sb.from("shows").select("*").eq("jeweler_id", state.jeweler.id).order("scheduled_at", { ascending:false }).limit(8);
      }).then(function(r){
        var rows = r.data || []; if (!rows.length){ $("notfound").hidden = false; return; }
        var live = rows.filter(function(s){ return s.status === "live"; })[0];
        var sched = rows.filter(function(s){ return s.status === "scheduled"; }).sort(function(a,b){ return new Date(a.scheduled_at) - new Date(b.scheduled_at); })[0];
        state.show = live || sched || rows[0];
        // lingua: ?lang, poi la scelta fatta in vetrina, poi il browser, poi la lingua della diretta
        var q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(), st = "";
        try { st = localStorage.getItem("vetrina-lang") || ""; } catch(e){}
        var nav = (navigator.language || "").slice(0, 2).toLowerCase();
        state.lang = TT[q] ? q : (TT[st] ? st : (TT[nav] ? nav : (TT[state.show.lang] ? state.show.lang : "it"))); state.t = TT[state.lang];
        if (TT[q]) { try { localStorage.setItem("vetrina-lang", q); } catch(e){} }
        document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        return Promise.all([
          sb.from("pieces").select("*").eq("show_id", state.show.id).order("position"),
          sb.from("messages").select("*").eq("show_id", state.show.id).order("created_at").limit(200),
          sb.from("show_covers").select("data").eq("show_id", state.show.id).maybeSingle()
        ]);
      }).then(function(res){
        if (!res) return;
        state.pieces = res[0].data || [];
        render();
        if (res[2].data && res[2].data.data) setPoster(res[2].data.data);
        (res[1].data || []).slice(-8).forEach(addMsg);
        subscribe();
      });
    });
  }
  boot();
})();
</script>
</body></html>
