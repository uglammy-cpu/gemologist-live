<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Cormorant+Garamond:wght@500&family=Jost:wght@300..600&display=swap">
<link rel="icon" type="image/svg+xml" href="/show/img/uniqaia-icon.svg"><link rel="icon" type="image/png" sizes="512x512" href="/show/img/uniqaia-icon.png"><link rel="apple-touch-icon" href="/show/img/uniqaia-icon.png"><meta name="theme-color" content="#15121C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.0/dist/livekit-client.umd.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/livekit-client@2.22.0/dist/livekit-client.umd.min.js';document.head.appendChild(s)"></script><title>Uniqaia</title><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/show/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uniqaia"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta property="og:type" content="website"><meta property="og:site_name" content="Uniqaia"><meta property="og:title" content="Uniqaia · My account"><meta property="og:description" content="Your saved lives, reminders and invitations on Uniqaia."><meta property="og:image" content="https://live.gemsandjewelrytechlab.com/show/img/uniqaia-og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="Your saved lives, reminders and invitations on Uniqaia."><style>
:root{--paper:#FFFFFF;--ink:#16181D;--muted:#5B606A;--line:#E7E4DC;--soft:#F6F4EF;--soft-2:#F8F1DF;--gold-hi:#EDD596;--gold:#CBA44F;--gold-lo:#A9833A;--gold-edge:#8C6A2B;--gold-ink:#1C1406;--live:#1E7A4F;--livered:#E11D2E;--heart:#C6364E;--video:#1E2128;--display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;--body:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-edge);outline-offset:3px}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}
.gold{background:linear-gradient(140deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-edge);font-weight:500}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;border:1px solid var(--ink);background:none;color:var(--ink)}
.btn.primary{color:var(--gold-ink);border-color:var(--gold-edge)}
.btn.dark{background:var(--gold-ink);color:var(--gold-hi);border-color:var(--gold-ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .col{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand .logo{display:block;height:28px;color:var(--ink);text-decoration:none}
.brand .logo svg,.wm svg{height:100%;width:auto;display:block;overflow:visible}
.brand small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.16em;color:var(--gold-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.welcome,body.dark{--logo-gold:#D4AF6A;--logo-gem:#F0606F}
.wordmark{font-family:var(--display);font-size:clamp(17px,3vw,22px);letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.16em;color:var(--gold-edge);margin-top:-2px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.status.live{color:var(--live)}.status.live i{background:var(--live);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,122,79,.5)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input,select,textarea{border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--paper);min-height:44px}
textarea{border-radius:12px;min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1C1406;color:#EDD596;padding:11px 18px;border-radius:999px;font-size:14px;z-index:70;display:flex;gap:9px;align-items:center;animation:rise .3s ease-out both;max-width:calc(100% - 28px)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--live);display:block;flex:none}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.modal{position:fixed;inset:0;background:rgba(14,16,20,.6);display:grid;place-items:center;padding:14px;z-index:60}
.mcard{position:relative;max-width:440px;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.mcard h3{font-family:var(--display);font-size:24px}
.mcard form{display:flex;flex-direction:column;gap:10px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{border:1px solid var(--line);background:var(--paper);padding:11px 14px;border-radius:999px;text-align:start}
.slot:hover{border-color:var(--gold-edge);background:var(--soft-2)}
.x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--muted)}
.ok{display:flex;align-items:center;gap:10px;color:var(--live);font-weight:500}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label input,label select,label textarea{width:100%}
footer{padding:22px 0 30px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.uqf{max-width:640px;margin:0 auto;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;line-height:1.5;color:var(--muted);text-align:center}
.uqf p,.uqf nav{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:3px 16px}
.uqf-id>*,.uqf-links a{white-space:nowrap}
.uqf-brand{color:var(--ink);font-weight:600;font-size:11.5px;letter-spacing:.24em}
.uqf a{color:inherit;text-decoration:none;transition:color .2s}
.uqf a:hover,.uqf a:focus-visible{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.uqf-links a{color:var(--ink);opacity:.82}
.uqf-note{font-size:11px;opacity:.85}
@media (max-width:520px){.uqf{gap:8px}.uqf p{gap:3px 13px}.uqf nav.uqf-links{display:grid;grid-template-columns:repeat(2,auto);justify-content:center;justify-items:center;gap:4px 18px}.uqf-links a{white-space:normal}}
[hidden]{display:none!important}

/* ---- pannello: chat e tiles ---- */
.msgs{flex:1;min-height:220px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:2px;animation:risemsg .3s ease-out both}
.msg .who{font-size:12px;color:var(--muted)}
.msg .txt{font-size:15px;line-height:1.4;background:var(--soft);padding:8px 12px;border-radius:12px 12px 12px 3px;max-width:94%;overflow-wrap:anywhere}
.msg.gemologist .who{color:var(--gold-edge);font-weight:500}
.msg.gemologist .txt{background:var(--soft-2);border:1px solid var(--gold-hi)}
.msg.shop .who{color:var(--ink);font-weight:500}
.msg.shop .txt{border:1px solid var(--line);background:var(--paper)}
.msg.me{align-items:flex-end}
.msg.me .txt{background:var(--gold-ink);color:var(--gold-hi);border-radius:12px 12px 3px 12px}
@keyframes risemsg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.videos{position:absolute;inset:0;display:none}
.videos.on{display:block}
.videos .main{position:absolute;inset:0;background:#000}
.videos .main video{width:100%;height:100%;object-fit:cover;display:block}
.videos .pips{position:absolute;right:12px;top:48px;display:flex;flex-direction:column;gap:8px;width:26%;max-width:190px;min-width:84px;z-index:2}
.videos .pip{aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45);background:#000;cursor:pointer}
.videos .pip video{width:100%;height:100%;object-fit:cover;display:block}
.videos video.mirror{transform:scaleX(-1)}
.audios{display:none}

/* ---- pagina diretta (verticale) ---- */
body.dark{background:#0E0B07;color:#F7EBCB;padding:0}
.stagev{min-height:100dvh;display:grid;place-items:center}
.phone{position:relative;width:100%;height:100dvh;background:#000;overflow:hidden;color:#fff}
@media (min-width:760px){.stagev{padding:24px}.phone{width:400px;height:min(820px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1B1B1F}}
.vid{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#2A2A30,#0A0A0D)}
.vid::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 35% at 50% 28%,rgba(255,228,170,.3),transparent 70%)}
.vid .artwrap{position:relative;width:62%;margin-top:-56%;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));animation:sway 6s ease-in-out infinite}
.vid .artwrap svg{width:100%;height:auto;display:block}
.vid .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.7)}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-6px)}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.35) 35%,transparent 60%),linear-gradient(to bottom,rgba(0,0,0,.5),transparent 25%)}
.videos.on ~ .shade{background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.25) 30%,transparent 50%),linear-gradient(to bottom,rgba(0,0,0,.45),transparent 22%)}
.ptop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:4}
.ptop .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;min-width:0;flex:0 1 auto;line-height:1.2;color:#fff;text-decoration:none}
.ptop .pill .who{min-width:0;display:flex;flex-direction:column}
.ptop .pill .who b,.ptop .pill .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pill b{font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft-2);color:var(--gold-edge);display:grid;place-items:center;font-family:var(--display);font-size:13px;flex:none;border:1px solid var(--gold-hi)}
.ptop .av{width:28px;height:28px;font-size:12px}
.lbl{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;flex:none}
.lbl i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;animation:pulsew 1.6s ease-out infinite}
.lbl.off{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}.lbl.off i{animation:none;opacity:.6}
@keyframes pulsew{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ptop .eye{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);border-radius:999px;padding:5px 9px;font-size:12px;flex:none}
.ptop .eye svg{width:12px;height:12px}
.ptop .x{position:static;margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:20px;color:#fff;flex:none;text-decoration:none}
.pchip{position:absolute;left:12px;top:calc(68px + env(safe-area-inset-top,0px));z-index:4;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:72%}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block;flex:none}
.gate{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;justify-content:center;gap:11px;padding:26px 22px;background:rgba(7,7,10,.94);color:#fff;overflow-y:auto}
.gate.on{display:flex}
.gate b{display:block;font-family:var(--display);font-size:25px;font-weight:400;line-height:1.2}
.gate p{margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.74)}
.gate input[type=email],.gate input[type=text]{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid rgba(247,235,203,.26);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:16px}
.gate input::placeholder{color:rgba(255,255,255,.44)}
.gate .cons{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.84);cursor:pointer}
.gate .cons input{flex:none;width:18px;height:18px;margin:1px 0 0;accent-color:var(--gold)}
.gate .cons span{flex:1 1 auto;min-width:0}
.gate .fine{font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.52)}
.gate button{width:100%;min-height:48px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.gate[dir="rtl"] .cons{flex-direction:row-reverse;text-align:right}
.idlev{position:absolute;inset:0;z-index:19;display:grid;place-items:center;text-align:center;padding:26px 22px;background:rgba(7,7,10,.72);color:#fff;cursor:pointer}
.idlev b{display:block;font-family:var(--display);font-size:25px;font-weight:400;line-height:1.2;margin-bottom:8px}
.idlev p{margin:0 auto 18px;max-width:300px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.8)}
.idlev button{min-height:48px;padding:0 28px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.nsub{margin:-4px 0 14px;font-size:14px;line-height:1.5;color:var(--muted);max-width:52ch}
.ag.night{grid-template-columns:52px minmax(0,1fr) auto;cursor:default}
.ag.night .agt small{white-space:normal}
.ag.night .agt b{font-size:20px}
.ag.night .agt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;text-overflow:clip;line-height:1.4}
.agn{text-align:center;min-width:68px;max-width:96px}
.agn b{display:block;font-family:var(--display);font-size:22px;font-weight:400;line-height:1}
.agn small{display:block;font-size:10.5px;line-height:1.3;color:var(--muted);margin-top:2px}
.clock{display:flex;align-items:baseline;gap:9px;margin:0 0 10px;padding:8px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.clock b{font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.clock span{font-size:12.5px;color:var(--muted)}
.clock.warn{background:#FFF7E6;border-color:#E8C87A}
.clock.red{background:#FDEEEE;border-color:#E39A9A}
.clock.red b{color:#B3261E}
.clock.over{background:#B3261E;border-color:#B3261E}
.clock.over b,.clock.over span{color:#fff}
.waitv{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(10,10,12,.55);color:#fff;font-size:16px;line-height:1.5}
.waitv b{display:block;font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:6px}
.rail{position:absolute;right:10px;bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:11px;letter-spacing:.02em;border:0;background:none;padding:0}
.rail .ic{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:grid;place-items:center}
.rail .ic svg{width:22px;height:22px}
.rail .ic.goldbg{background:linear-gradient(140deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#1C1406}
.rail .ic.heart.on{color:var(--heart)}
.rail button:disabled{opacity:.45}
.subs{position:absolute;left:12px;right:76px;bottom:calc(64px + 30% + 10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.subs .txt{width:100%;background:rgba(0,0,0,.62);border-radius:10px;padding:7px 11px;font-size:14.5px;line-height:1.3;color:#fff;min-height:40px}
.pchat{position:absolute;left:12px;right:76px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;max-height:30%;overflow:hidden;mask-image:linear-gradient(to bottom,transparent,#000 22%)}
.pm{align-self:flex-start;max-width:100%;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:14px;padding:6px 11px;font-size:13.5px;line-height:1.3;animation:up .35s ease-out both;color:#fff;overflow-wrap:anywhere}
.pm b{font-weight:500;color:#EDD596;margin-right:5px}
.pm.gemologist b{color:#F2E6C8}.pm.gemologist{border:1px solid rgba(237,213,150,.5)}
.pm.shop b{color:#fff}
.pm.me{align-self:flex-end;background:rgba(237,213,150,.9);color:#1C1406}.pm.me b{color:#8C6A2B}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pin{position:absolute;left:12px;right:76px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;margin:0}
.pin input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:10px 14px;outline:none;min-height:44px}
.pin input::placeholder{color:rgba(255,255,255,.7)}
.pin button{border-radius:999px;background:#fff;color:#111;padding:0 14px;font-weight:500;font-size:14px;border:0}
.hearts{position:absolute;right:22px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:60px;height:260px;pointer-events:none;z-index:6}
.hearts span{position:absolute;bottom:0;left:50%;width:22px;height:22px;animation:fly 1.3s ease-out forwards;color:var(--heart)}
.hearts span svg{width:100%;height:100%}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-240px) scale(1.25) rotate(var(--rot))}}
.audio-btn{position:absolute;left:50%;bottom:calc(64px + 30% + 60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;border-radius:999px;background:#fff;color:#111;border:0;padding:10px 18px;font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.lpiece .lprice{display:block;margin-top:6px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none}
.lpiece a.lprice span{display:block;font-size:10.5px;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px;border-bottom:1px solid var(--line);padding-bottom:4px}
.lpiece a.lprice:hover span{color:var(--ink);border-color:currentColor}
.lpiece .decl{display:block;margin-top:6px;font-size:11.5px;line-height:1.45;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.lpiece .decl i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.75;margin-top:3px}

function LkTiles(container, opts){
  var self = this; opts = opts || {};
  this.box = container; this.tiles = {}; this.audios = document.createElement("div"); this.audios.className = "audios"; container.appendChild(this.audios);
  this.main = document.createElement("div"); this.main.className = "main"; container.appendChild(this.main);

  // che commenta sta nell'angolo. Senza questo vince chi si collega prima.
  this.add = function(id, el, label, mirror, inserto){
    if (self.tiles[id]) self.remove(id);
    if (mirror) el.className = (el.className || "") + " mirror";
    var wrap = document.createElement("div"); wrap.appendChild(el); wrap.title = label || "";
    wrap.setAttribute("data-inserto", inserto ? "1" : "0");

    var cur = self.main.firstChild;
    // Chi è solo in stanza prende lo schermo grande, anche la gemmologa:
    // un riquadro grande vuoto con un francobollo nell'angolo non si guarda.
    if (!cur || (!inserto && cur.getAttribute("data-inserto") === "1")){
      if (cur){ cur.className = "pip"; self.pips.insertBefore(cur, self.pips.firstChild); }
      wrap.className = ""; self.main.appendChild(wrap);
    } else {
      wrap.className = "pip"; self.pips.appendChild(wrap);
    }
    wrap.addEventListener("click", function(){ self.promote(id); });

    if (cur){ cur.className = "pip"; self.pips.insertBefore(cur, self.pips.firstChild); }
  };

    var w = self.tiles[id]; if (!w) return; self.tiles[id] = null;
    var wasMain = w.parentNode === self.main; w.remove();
    if (wasMain && self.pips.firstChild){ var n = self.pips.firstChild; self.main.appendChild(n); n.className = ""; }
    self.onChange(self.count());

function lkAttachRemote(room, tiles, LK){

    var id = participant.identity + ":" + (pub.trackSid || track.sid);

    else if (track.kind === "audio"){ tiles.addAudio(id, track.attach()); }
  }
  function offTrack(track, pub, participant){
    var id = participant.identity + ":" + (pub.trackSid || track.sid);
    track.detach().forEach(function(el){ el.remove(); });
    if (track.kind === "video") tiles.remove(id); else tiles.removeAudio(id);
  }
  room.on(LK.RoomEvent.TrackSubscribed, onTrack);
  room.on(LK.RoomEvent.TrackUnsubscribed, offTrack);
  room.on(LK.RoomEvent.ParticipantDisconnected, function(p){ Object.keys(tiles.tiles).forEach(function(id){ if (id.indexOf(p.identity + ":") === 0) tiles.remove(id); }); });
  room.on(LK.RoomEvent.Disconnected, function(){ tiles.clear(); });
}

        return '<div class="sl"><div class="d"><small>' + esc(fmt(x.at, { weekday:"short" })) + '</small><b>' + esc(fmt(x.at, { day:"numeric" })) + '</b></div>'
          + '<div class="t"><a href="' + esc(link(x)) + '"><b dir="auto">' + esc(tr(x.title_i18n, x.title)) + '</b><small>' + esc(fmt(x.at, { month:"long" })) + ' · ' + esc(sub) + '</small></a>'
          + (x.status === "ended" ? "" : '<div class="rr"><label><input type="checkbox" data-r="24" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '"' + (x.rem24 !== false ? " checked" : "") + '>' + esc(UQG.t("rem24")) + '</label>'
            + '<label><input type="checkbox" data-r="15" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '"' + (x.rem15 !== false ? " checked" : "") + '>' + esc(UQG.t("rem15")) + '</label></div>')
          + '</div><button class="rm" type="button" data-k="' + esc(x.kind) + '" data-id="' + esc(x.id) + '">' + esc(m.remove) + '</button></div>';
      }).join("");
      var n = +p.invited || 0;
      page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="who">' + esc(p.email || "") + '</p>' + (offMsg ? '<p class="note">' + esc(offMsg) + '</p>' : '')
        + '<section><h2>' + esc(m.saved) + '</h2>' + (rows || '<p class="lead">' + esc(m.empty) + '</p><p><a class="btn" href="' + ROOT + '?lang=' + lang + '">' + esc(m.browse) + '</a></p>')
        + '<p style="margin-top:16px"><label class="tog"><input type="checkbox" id="rem"' + (p.reminders ? " checked" : "") + '><span>' + esc(m.rem) + '</span></label></p></section>'
        // My Invitations: solo il numero, nessun premio né classifica (LEG-015, sezione D)
        + '<section><h2>' + esc(m.inv) + '</h2><p class="lead">' + esc(m.invT) + '</p><span class="me-lbl">' + esc(m.yourLink) + '</span><div class="inv"><input readonly id="invUrl" aria-label="' + esc(m.yourLink) + '" value="' + esc(inv) + '"><button class="btn" type="button" id="cp">' + esc(m.copy) + '</button><span id="shr"></span></div>'
        + '<p class="lead" style="font-size:13px;margin-top:8px">' + esc(m.yourCode.replace("{c}", p.ref_code || "")) + '</p>'
        + '<p class="lead" style="margin:14px 0 2px;color:var(--ink)">' + esc(m.joined.replace("{n}", n)) + '</p><p class="lead" style="font-size:13px">' + esc(m.privacyNote) + '</p></section>'
        + '<section class="acts"><button class="btn" type="button" id="out">' + esc(m.signout) + '</button><button class="btn danger" type="button" id="del">' + esc(m.del) + '</button></section>'
        + '<div class="note" id="delBox" hidden><p style="margin:0 0 12px">' + esc(m.delAsk) + '</p><div class="acts"><button class="btn danger" type="button" id="delYes">' + esc(m.delYes) + '</button><button class="btn" type="button" id="delNo">' + esc(m.delNo) + '</button></div></div>'
        + '<p class="lead" id="msg" role="status"></p>';
      Array.prototype.forEach.call(page.querySelectorAll(".rm"), function(b){ b.addEventListener("click", function(){ b.disabled = true; UQG.rpc("save_life", { p_kind: b.getAttribute("data-k"), p_id: b.getAttribute("data-id"), p_on: false }).then(render, function(){ b.disabled = false; $("msg").textContent = m.err; }); }); });
      Array.prototype.forEach.call(page.querySelectorAll("[data-r]"), function(c){ c.addEventListener("change", function(){
        var row = c.closest(".rr"), a = row.querySelector('[data-r="24"]'), b = row.querySelector('[data-r="15"]');
        UQG.rpc("set_life_reminders", { p_kind: c.getAttribute("data-k"), p_id: c.getAttribute("data-id"), p_rem24: a.checked, p_rem15: b.checked }).catch(function(){ c.checked = !c.checked; $("msg").textContent = m.err; });
      }); });
      $("rem").addEventListener("change", function(){ var c = this; UQG.rpc("set_reminders", { p_on: c.checked }).then(function(){ offMsg = ""; }, function(){ c.checked = !c.checked; $("msg").textContent = m.err; }); });
      $("cp").addEventListener("click", function(){ var i = $("invUrl"); i.select(); var done = function(){ UQG.toast(m.copied); }; if (navigator.clipboard) navigator.clipboard.writeText(i.value).then(done, done); else { try { document.execCommand("copy"); } catch(e){} done(); } });
      $("shr").replaceWith(UQG.shareBtn({ kind: "home", id: null, url: inv, title: "Uniqaia", text: m.invMsg.replace("{code}", p.ref_code || "") }, "btn"));
      $("out").addEventListener("click", function(){ UQG.signOut().then(render); });
      $("del").addEventListener("click", function(){ $("delBox").hidden = false; $("delYes").focus(); });
      $("delNo").addEventListener("click", function(){ $("delBox").hidden = true; $("del").focus(); });
      $("delYes").addEventListener("click", function(){
        this.disabled = true;
        UQG.rpc("delete_my_account").then(function(){ return UQG.signOut(); }).then(function(){ page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="note">' + esc(m.delDone) + '</p>'; },
          function(e){ $("delYes").disabled = false; $("msg").textContent = /seller/.test(String(e && e.message)) ? m.delSeller : m.err; });
      });
    }, function(){ page.innerHTML = '<h1>' + esc(m.title) + '</h1><p class="lead">' + esc(m.err) + '</p>'; });
  }
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/show/sw.js").catch(function(){})});</script></body></html>
