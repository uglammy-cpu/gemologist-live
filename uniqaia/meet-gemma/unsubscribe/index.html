<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unsubscribe · Uniqaia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Manrope;font-weight:700;font-display:swap;src:url(../fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(../fonts/manrope-latin-800-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
body{background:#F8F2EB;color:#1D1A1F;font:700 17px/1.6 Manrope,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{max-width:480px;width:100%;background:#FFFCF8;border:1px solid #D8CDBD;border-radius:20px;padding:34px 28px;text-align:center}
h1{font:800 24px/1.3 Manrope,sans-serif;margin-bottom:12px}
p{color:#5B5560;font-weight:700}
button{margin-top:22px;font:800 17px/1 Manrope,sans-serif;background:#2E2A31;color:#FFFCF8;border:0;border-radius:999px;padding:17px 30px;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
a{color:#1D1A1F}
</style>
</head>
<body>
<main class="card">
  <h1 id="h">Unsubscribe from Uniqaia emails</h1>
  <p id="p">Confirm below and we won’t email this address about Uniqaia again.</p>
  <button id="b" type="button">Unsubscribe me</button>
</main>
<script>
(function(){
  var FN = "https://itoxzepuukyvdxxtfetf.supabase.co/functions/v1/campaign/unsubscribe";
  var t = new URLSearchParams(location.search).get("t") || "";
  var h = document.getElementById("h"), p = document.getElementById("p"), b = document.getElementById("b");
  if (!/^[0-9a-f-]{36}$/i.test(t)) { h.textContent = "This link is not valid"; p.innerHTML = 'To unsubscribe, reply to our email with “unsubscribe” or write to <a href="mailto:elena@uniqaia.com?subject=unsubscribe">elena@uniqaia.com</a>.'; b.hidden = true; return; }
  b.addEventListener("click", function(){
    b.disabled = true;
    fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: t }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok) throw new Error();
        h.textContent = "You’re unsubscribed"; p.textContent = "We won’t email this address about Uniqaia again."; b.hidden = true;
      })
      .catch(function(){ b.disabled = false; p.innerHTML = 'Something went wrong. Please try again, or write to <a href="mailto:elena@uniqaia.com?subject=unsubscribe">elena@uniqaia.com</a>.'; });
  });
})();
</script>
</body>
</html>
